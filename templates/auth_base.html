{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <script>
        (function() {
            const path = window.location.pathname;
            const isOnboarding = path.includes('/signup/') || path.includes('/building-core/') || path.includes('/verify-otp/') || path.includes('/setup-account/');
            if (isOnboarding) {
                const lang = localStorage.getItem('signupLang') || 'ar';
                document.documentElement.lang = lang;
                document.documentElement.dir = (lang === 'ar') ? 'rtl' : 'ltr';
            } else {
                document.documentElement.lang = 'en';
                document.documentElement.dir = 'ltr';
            }
        })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REDIVIO ERP</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            DEFAULT: '#2c82f0',
                            hover: '#1e73e1',
                            dark: '#1660c1',
                            light: '#5d9ef5'
                        }
                    }
                }
            }
        }
    </script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@300;400;600&display=swap');
        .tech-font { font-family: 'Rajdhani', sans-serif; }
        body { font-family: 'Inter', sans-serif; background-color: #0B132B; }
        
        /* Global Styles for Inputs */
        .input-field { 
            width: 100%; 
            background-color: rgba(255,255,255,0.03); 
            border: 1px solid rgba(255,255,255,0.1); 
            backdrop-filter: blur(12px);
            color: white; 
            padding: 0.85rem 1rem; 
            border-radius: 0.75rem; 
            outline: none; 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
            font-size: 0.875rem;
        }
        .input-field:focus { 
            border-color: #2c82f0; 
            background-color: rgba(255,255,255,0.06);
            box-shadow: 0 0 0 4px rgba(44, 130, 240, 0.15), inset 0 0 0 1px rgba(255,255,255,0.1); 
        }
        .input-field::placeholder {
            color: #64748b;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4 overflow-x-hidden relative">
    
    <!-- Premium Grid & Glow Background -->
    <div class="fixed inset-0 z-0 opacity-20 pointer-events-none" 
         style="background-image: linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px); background-size: 50px 50px;">
    </div>
    <div class="fixed top-0 left-1/4 w-96 h-96 bg-brand rounded-full mix-blend-screen filter blur-[120px] opacity-20 pointer-events-none"></div>
    <div class="fixed bottom-0 right-1/4 w-96 h-96 bg-blue-400 rounded-full mix-blend-screen filter blur-[120px] opacity-10 pointer-events-none"></div>

    {% block content %}{% endblock %}

</body>
</html>
