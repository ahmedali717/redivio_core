{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <script>
        (function() {
            const path = window.location.pathname;
            const isOnboarding = path.includes('/signup/') || path.includes('/building-core/') || path.includes('/verify-otp/') || path.includes('/setup-account/');
            if (isOnboarding) {
                const lang = localStorage.getItem('signupLang') || 'ar';
                document.documentElement.lang = lang;
                document.documentElement.dir = (lang === 'ar') ? 'rtl' : 'ltr';
            } else {
                document.documentElement.lang = 'en';
                document.documentElement.dir = 'ltr';
            }
        })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REDIVIO ERP</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            DEFAULT: '#2c82f0', // The Sky Blue Egypt color
                            hover: '#2563eb',
                            dark: '#1d4ed8',
                            light: '#60a5fa'
                        }
                    }
                }
            }
        }
    </script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@300;400;600&display=swap');
        .tech-font { font-family: 'Rajdhani', sans-serif; }
        body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #2c82f0 0%, #1e73e1 100%); min-height: 100vh; }
        
        /* Global Styles for Inputs (Light Theme for Cards) */
        .input-field { 
            width: 100%; 
            background-color: #f8fafc; 
            border: 1px solid #e2e8f0; 
            color: #0f172a; 
            padding: 0.85rem 1rem; 
            border-radius: 0.75rem; 
            outline: none; 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
            font-size: 0.875rem;
        }
        .input-field:focus { 
            border-color: #2c82f0; 
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(44, 130, 240, 0.15); 
        }
        .input-field::placeholder {
            color: #94a3b8;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4 overflow-x-hidden relative">
    
    <!-- Sky Blue Premium Pattern -->
    <div class="fixed inset-0 z-0 opacity-10 pointer-events-none" 
         style="background-image: radial-gradient(circle at 2px 2px, white 1px, transparent 0); background-size: 32px 32px;">
    </div>
    <div class="fixed top-0 left-0 w-full h-96 bg-gradient-to-b from-white/10 to-transparent pointer-events-none"></div>

    {% block content %}{% endblock %}

</body>
</html>
