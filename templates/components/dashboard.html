<div class="max-w-7xl mx-auto space-y-8 animate-in fade-in slide-in-from-bottom-5 duration-700 pb-10" v-cloak>
    
    <!-- Hero Banner -->
    <div class="bg-gradient-to-br from-slate-900 via-[#0f172a] to-blue-950 rounded-[2rem] p-10 text-white shadow-2xl relative overflow-hidden flex flex-col md:flex-row justify-between items-start md:items-center gap-6 border border-white/10">
        <!-- Abstract Shapes & Glassmorphism -->
        <div class="absolute top-0 right-0 w-[500px] h-[500px] bg-blue-600/20 rounded-full blur-[80px] -translate-y-1/2 translate-x-1/3"></div>
        <div class="absolute bottom-0 left-0 w-[400px] h-[400px] bg-indigo-500/20 rounded-full blur-[80px] translate-y-1/2 -translate-x-1/4"></div>
        <div class="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] opacity-5 mix-blend-overlay"></div>
        
        <div class="relative z-10 w-full max-w-2xl" :dir="isArabic ? 'rtl' : 'ltr'">
            <div class="flex items-center gap-3 mb-5">
                <span class="px-4 py-1.5 bg-white/10 backdrop-blur-md border border-white/20 rounded-full text-[10px] font-black uppercase tracking-widest text-blue-200 shadow-inner">
                    <span v-text="isArabic ? 'نظرة عامة متقدمة' : 'Executive Overview'"></span>
                </span>
                <span class="flex items-center gap-2 bg-emerald-500/20 text-emerald-300 px-3 py-1.5 rounded-full border border-emerald-500/30 text-[10px] font-bold uppercase tracking-wider backdrop-blur-md">
                    <span class="relative flex h-2 w-2">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
                    </span>
                    <span v-text="isArabic ? 'النظام متصل' : 'System Online'"></span>
                </span>
            </div>
            
            <h1 class="text-4xl md:text-5xl font-black mb-4 tracking-tight leading-tight">
                <span v-text="isArabic ? 'مرحباً،' : 'Welcome back,'"></span> <span v-text="user.name || 'Admin'" class="text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-indigo-300"></span>
            </h1>
            <p class="text-slate-300 text-base md:text-lg font-medium leading-relaxed max-w-xl opacity-90">
                <span v-text="isArabic ? 'إليك ملخص أداء العمليات التشغيلية في' : 'Here is the operational performance summary for'"></span> 
                <span class="font-bold text-white px-1" v-text="config.company_name"></span> 
                <span v-text="isArabic ? 'بشكل لحظي.' : 'in real-time.'"></span>
            </p>
        </div>
        
        <!-- Quick Action Button -->
        <div class="relative z-10 w-full md:w-auto flex justify-end">
            <button @click="showBrandDropdown = true" class="group relative px-6 py-4 font-bold text-white rounded-2xl bg-white/10 hover:bg-white/20 border border-white/20 backdrop-blur-md shadow-xl transition-all overflow-hidden flex items-center gap-3 w-full md:w-auto justify-center">
                <div class="absolute inset-0 w-full h-full bg-gradient-to-r from-transparent via-white/10 to-transparent -translate-x-full group-hover:animate-[shimmer_2s_infinite]"></div>
                <i class="fas fa-layer-group text-lg text-blue-300"></i>
                <span class="tracking-wide" v-text="isArabic ? 'التبديل بين الموديولات الأساسية' : 'Access Core Modules'"></span>
            </button>
        </div>
    </div>

    <!-- KPIs Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
        
        <!-- KPI 1 -->
        <div class="bg-white p-6 rounded-[1.5rem] border border-slate-100 shadow-[0_8px_30px_rgb(0,0,0,0.04)] hover:shadow-[0_8px_30px_rgb(0,0,0,0.08)] hover:-translate-y-1 transition-all duration-300 group relative overflow-hidden">
            <div class="absolute right-0 top-0 w-32 h-32 bg-blue-50 rounded-bl-full z-0 transition-transform duration-500 group-hover:scale-110 opacity-50"></div>
            <div class="relative z-10 flex justify-between items-start mb-6">
                <div class="w-12 h-12 flex items-center justify-center bg-blue-50 text-blue-600 rounded-xl shadow-sm border border-blue-100/50"><i class="fas fa-cube text-xl"></i></div>
                <span class="text-emerald-600 bg-emerald-50 px-2.5 py-1 rounded-lg text-[10px] font-black flex items-center gap-1.5 border border-emerald-100 shadow-sm">+12% <i class="fas fa-arrow-trend-up"></i></span>
            </div>
            <div class="relative z-10" :class="isArabic ? 'text-right' : 'text-left'">
                <p class="text-[11px] text-slate-400 font-bold uppercase tracking-widest mb-1" v-text="isArabic ? 'إجمالي الأصناف' : 'Total SKUs'"></p>
                <h3 class="text-4xl font-black text-slate-800 tech-font tracking-tighter" v-text="kpis.materials || 0"></h3>
            </div>
        </div>

        <!-- KPI 2 -->
        <div class="bg-white p-6 rounded-[1.5rem] border border-slate-100 shadow-[0_8px_30px_rgb(0,0,0,0.04)] hover:shadow-[0_8px_30px_rgb(0,0,0,0.08)] hover:-translate-y-1 transition-all duration-300 group relative overflow-hidden">
            <div class="absolute right-0 top-0 w-32 h-32 bg-indigo-50 rounded-bl-full z-0 transition-transform duration-500 group-hover:scale-110 opacity-50"></div>
            <div class="relative z-10 flex justify-between items-start mb-6">
                <div class="w-12 h-12 flex items-center justify-center bg-indigo-50 text-indigo-600 rounded-xl shadow-sm border border-indigo-100/50"><i class="fas fa-boxes-stacked text-xl"></i></div>
                <span class="text-slate-500 bg-slate-50 px-2.5 py-1 rounded-lg text-[10px] font-black flex items-center gap-1.5 border border-slate-100 shadow-sm">Stable <i class="fas fa-minus"></i></span>
            </div>
            <div class="relative z-10" :class="isArabic ? 'text-right' : 'text-left'">
                <p class="text-[11px] text-slate-400 font-bold uppercase tracking-widest mb-1" v-text="isArabic ? 'القطع بالمخزون' : 'Items in Stock'"></p>
                <h3 class="text-4xl font-black text-slate-800 tech-font tracking-tighter" v-text="kpis.stock_qty || 0"></h3>
            </div>
        </div>

        <!-- KPI 3 -->
        <div class="bg-white p-6 rounded-[1.5rem] border border-slate-100 shadow-[0_8px_30px_rgb(0,0,0,0.04)] hover:shadow-[0_8px_30px_rgb(0,0,0,0.08)] hover:-translate-y-1 transition-all duration-300 group relative overflow-hidden">
            <div class="absolute right-0 top-0 w-32 h-32 bg-emerald-50 rounded-bl-full z-0 transition-transform duration-500 group-hover:scale-110 opacity-50"></div>
            <div class="relative z-10 flex justify-between items-start mb-6">
                <div class="w-12 h-12 flex items-center justify-center bg-emerald-50 text-emerald-600 rounded-xl shadow-sm border border-emerald-100/50"><i class="fas fa-truck-fast text-xl"></i></div>
                <span class="text-emerald-600 bg-emerald-50 px-2.5 py-1 rounded-lg text-[10px] font-black flex items-center gap-1.5 border border-emerald-100 shadow-sm">Active <i class="fas fa-circle-check"></i></span>
            </div>
            <div class="relative z-10" :class="isArabic ? 'text-right' : 'text-left'">
                <p class="text-[11px] text-slate-400 font-bold uppercase tracking-widest mb-1" v-text="isArabic ? 'الموردين المعتمدين' : 'Approved Vendors'"></p>
                <h3 class="text-4xl font-black text-slate-800 tech-font tracking-tighter" v-text="kpis.vendors || 0"></h3>
            </div>
        </div>

        <!-- KPI 4 -->
        <div class="bg-white p-6 rounded-[1.5rem] border border-slate-100 shadow-[0_8px_30px_rgb(0,0,0,0.04)] hover:shadow-[0_8px_30px_rgb(0,0,0,0.08)] hover:-translate-y-1 transition-all duration-300 group relative overflow-hidden">
            <div class="absolute right-0 top-0 w-32 h-32 bg-rose-50 rounded-bl-full z-0 transition-transform duration-500 group-hover:scale-110 opacity-50"></div>
            <div class="relative z-10 flex justify-between items-start mb-6">
                <div class="w-12 h-12 flex items-center justify-center bg-rose-50 text-rose-600 rounded-xl shadow-sm border border-rose-100/50"><i class="fas fa-file-signature text-xl"></i></div>
                <span class="text-rose-600 bg-rose-50 px-2.5 py-1 rounded-lg text-[10px] font-black flex items-center gap-1.5 border border-rose-100 shadow-sm animate-pulse" v-if="kpis.pending_pos > 0"><span v-text="kpis.pending_pos"></span> Pending</span>
                <span class="text-slate-500 bg-slate-50 px-2.5 py-1 rounded-lg text-[10px] font-black flex items-center gap-1.5 border border-slate-100 shadow-sm" v-else>Clear</span>
            </div>
            <div class="relative z-10" :class="isArabic ? 'text-right' : 'text-left'">
                <p class="text-[11px] text-slate-400 font-bold uppercase tracking-widest mb-1" v-text="isArabic ? 'أوامر معلقة' : 'Pending POs'"></p>
                <h3 class="text-4xl font-black text-slate-800 tech-font tracking-tighter focus-in" v-text="kpis.pending_pos || 0"></h3>
            </div>
        </div>
    </div>

    <!-- Charts & Activity Area -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- Main Chart Area -->
        <div class="lg:col-span-2 bg-white border border-slate-100 rounded-[2rem] p-8 shadow-[0_8px_30px_rgb(0,0,0,0.04)] relative">
            <div class="flex justify-between items-center mb-8">
                <div>
                    <h3 class="font-black text-xl text-slate-800" v-text="isArabic ? 'تحليلات الأداء' : 'Performance Analytics'"></h3>
                    <p class="text-xs font-bold text-slate-400 mt-1 uppercase tracking-wider" v-text="isArabic ? 'معدل الحركات المخزنية والمبيعات' : 'Inventory & Sales Metrics'"></p>
                </div>
                <div class="flex gap-2 bg-slate-50 p-1 rounded-xl border border-slate-100">
                    <button class="px-4 py-1.5 rounded-lg text-xs font-bold bg-white shadow-sm text-blue-600">This Month</button>
                    <button class="px-4 py-1.5 rounded-lg text-xs font-bold text-slate-500 hover:text-slate-700">Last Qtr</button>
                </div>
            </div>
            
            <!-- CSS Grid Bar Chart Placeholder -->
            <div class="h-64 flex items-end justify-between gap-4 w-full mt-4 border-b-2 border-slate-100 pb-4 relative">
                <!-- Grid Lines -->
                <div class="absolute inset-x-0 bottom-1/4 border-b border-dashed border-slate-200 z-0 text-[9px] text-slate-400 text-right pr-2">250</div>
                <div class="absolute inset-x-0 bottom-2/4 border-b border-dashed border-slate-200 z-0 text-[9px] text-slate-400 text-right pr-2">500</div>
                <div class="absolute inset-x-0 bottom-3/4 border-b border-dashed border-slate-200 z-0 text-[9px] text-slate-400 text-right pr-2">750</div>
                
                <!-- Bars -->
                <div class="w-full bg-blue-100/50 rounded-t-lg relative group h-[40%] hover:bg-blue-200/50 transition-colors z-10 cursor-pointer">
                    <div class="absolute bottom-full left-1/2 -translate-x-1/2 mb-2 bg-slate-800 text-white text-[10px] py-1 px-2 rounded opacity-0 group-hover:opacity-100 font-bold transition-opacity">400</div>
                </div>
                <div class="w-full bg-blue-500 rounded-t-lg relative shadow-[0_0_15px_rgba(59,130,246,0.5)] group h-[80%] hover:bg-blue-400 transition-colors z-10 cursor-pointer">
                    <div class="absolute bottom-full left-1/2 -translate-x-1/2 mb-2 bg-slate-800 text-white text-[10px] py-1 px-2 rounded opacity-0 group-hover:opacity-100 font-bold transition-opacity">800</div>
                </div>
                <div class="w-full bg-blue-100/50 rounded-t-lg relative group h-[60%] hover:bg-blue-200/50 transition-colors z-10 cursor-pointer">
                     <div class="absolute bottom-full left-1/2 -translate-x-1/2 mb-2 bg-slate-800 text-white text-[10px] py-1 px-2 rounded opacity-0 group-hover:opacity-100 font-bold transition-opacity">600</div>
                </div>
                <div class="w-full bg-blue-100/50 rounded-t-lg relative group h-[45%] hover:bg-blue-200/50 transition-colors z-10 cursor-pointer">
                     <div class="absolute bottom-full left-1/2 -translate-x-1/2 mb-2 bg-slate-800 text-white text-[10px] py-1 px-2 rounded opacity-0 group-hover:opacity-100 font-bold transition-opacity">450</div>
                </div>
                <div class="w-full bg-blue-100/50 rounded-t-lg relative group h-[70%] hover:bg-blue-200/50 transition-colors z-10 cursor-pointer">
                     <div class="absolute bottom-full left-1/2 -translate-x-1/2 mb-2 bg-slate-800 text-white text-[10px] py-1 px-2 rounded opacity-0 group-hover:opacity-100 font-bold transition-opacity">700</div>
                </div>
                <div class="w-full bg-blue-100/50 rounded-t-lg relative group h-[50%] hover:bg-blue-200/50 transition-colors z-10 cursor-pointer">
                     <div class="absolute bottom-full left-1/2 -translate-x-1/2 mb-2 bg-slate-800 text-white text-[10px] py-1 px-2 rounded opacity-0 group-hover:opacity-100 font-bold transition-opacity">500</div>
                </div>
            </div>
            <div class="flex justify-between items-center text-[10px] font-bold text-slate-400 mt-3 px-2 uppercase">
                <span>Jan</span><span>Feb</span><span>Mar</span><span>Apr</span><span>May</span><span>Jun</span>
            </div>
        </div>

        <!-- Side Panel: Activity & Support -->
        <div class="space-y-6 flex flex-col h-full">
            
            <div class="bg-white border border-slate-100 rounded-[2rem] p-7 shadow-[0_8px_30px_rgb(0,0,0,0.04)] flex-1">
                 <div class="flex items-center justify-between mb-6">
                     <h3 class="font-black text-slate-800" v-text="isArabic ? 'آخر النشاطات' : 'System Events'"></h3>
                     <button @click="showActivityLog = true" class="w-8 h-8 rounded-full bg-slate-50 text-blue-600 flex items-center justify-center hover:bg-blue-50 transition-colors">
                         <i class="fas fa-expand-alt text-xs"></i>
                     </button>
                 </div>
                 
                 <div class="space-y-5 relative before:absolute before:inset-y-0 before:left-3 before:w-px before:bg-slate-100">
                     <div class="flex items-start gap-4 relative">
                         <div class="w-6 h-6 rounded-full bg-blue-50 border-2 border-white flex items-center justify-center shrink-0 z-10 shadow-sm mt-0.5">
                             <div class="w-2 h-2 rounded-full bg-blue-500 animate-pulse"></div>
                         </div>
                         <div>
                             <p class="text-sm font-bold text-slate-700" v-text="isArabic ? 'تم تشغيل النظام بنجاح' : 'System Online'"></p>
                             <p class="text-[10px] text-slate-400 font-medium mt-1">Services initiated correctly.</p>
                         </div>
                     </div>
                     <div class="flex items-start gap-4 relative">
                         <div class="w-6 h-6 rounded-full bg-emerald-50 border-2 border-white flex items-center justify-center shrink-0 z-10 shadow-sm mt-0.5">
                             <div class="w-2 h-2 rounded-full bg-emerald-500"></div>
                         </div>
                         <div>
                             <p class="text-sm font-bold text-slate-700" v-text="isArabic ? 'تم تفعيل التخزين المؤقت' : 'Cache Optimized'"></p>
                             <p class="text-[10px] text-slate-400 font-medium mt-1">Vue DOM sync successful.</p>
                         </div>
                     </div>
                 </div>
                 
                 <button @click="showActivityLog = true" class="w-full mt-6 py-3 border-2 border-dashed border-slate-200 rounded-xl text-xs font-bold text-slate-400 hover:text-blue-600 hover:border-blue-200 hover:bg-blue-50 transition-all uppercase tracking-widest">
                     <span v-text="isArabic ? 'عرض كل السجلات' : 'View Complete Log'"></span>
                 </button>
            </div>

            <!-- Support Card -->
            <div class="bg-gradient-to-tr from-slate-900 to-slate-800 rounded-[2rem] p-7 text-white relative overflow-hidden shadow-xl">
                 <div class="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/carbon-fibre.png')] opacity-20"></div>
                 <div class="relative z-10">
                     <div class="w-12 h-12 bg-white/10 backdrop-blur-md rounded-2xl flex items-center justify-center mb-4 border border-white/20">
                         <i class="fas fa-headset text-2xl text-blue-300"></i>
                     </div>
                     <h3 class="font-black text-xl mb-2" v-text="isArabic ? 'تحتاج مساعدة ؟' : 'Enterprise Support'"></h3>
                     <p class="text-slate-400 text-xs mb-6 max-w-[200px] leading-relaxed font-medium" v-text="isArabic ? 'الوصول المباشر لقاعدة المعرفة وفريق الدعم الفني الخاص بمنشأتك.' : 'Direct access to knowledge base and dedicated support team.'"></p>
                     
                     <button class="w-full bg-white text-slate-900 hover:bg-slate-100 px-5 py-3.5 rounded-xl text-xs font-black uppercase tracking-wider shadow-lg transition-all flex items-center justify-center gap-2">
                         <span v-text="isArabic ? 'فتح تذكرة' : 'Open Ticket'"></span>
                         <i class="fas fa-arrow-right"></i>
                     </button>
                 </div>
                 <i class="fas fa-life-ring absolute -bottom-8 -right-8 text-[120px] text-white/[0.03] rotate-12"></i>
            </div>
        </div>
    </div>
</div>
