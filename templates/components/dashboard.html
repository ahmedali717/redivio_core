<div class="max-w-7xl mx-auto space-y-8 animate-fade-in-up" v-cloak>
    
    <div class="bg-gradient-to-r from-blue-600 to-indigo-700 rounded-2xl p-8 text-white shadow-xl relative overflow-hidden">
        <div class="absolute right-0 top-0 h-full w-1/2 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] opacity-10"></div>
        <div class="relative z-10" dir="ltr">
            <h1 class="text-3xl font-bold mb-2">
                Good Morning, <span v-text="user.name || 'Captain'"></span>! 👋
            </h1>
            <p class="text-blue-100 max-w-xl">
                Here's what's happening in <span class="font-bold text-white" v-text="config.company_name"></span> today. Your operations are running smoothly.
            </p>
        </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
        
        <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm hover:shadow-md transition-shadow">
            <div class="flex justify-between items-start mb-4">
                <div class="p-3 bg-blue-50 text-blue-600 rounded-lg"><i class="fas fa-cube text-xl"></i></div>
                <span class="text-green-500 text-xs font-bold flex items-center">+12% <i class="fas fa-arrow-up ml-1"></i></span>
            </div>
            <h3 class="text-3xl font-bold text-slate-800 tech-font" v-text="kpis.materials || 0"></h3>
            <p class="text-sm text-slate-400 font-medium" v-text="isArabic ? 'إجمالي الأصناف' : 'Total SKUs'"></p>
        </div>

        <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm hover:shadow-md transition-shadow">
            <div class="flex justify-between items-start mb-4">
                <div class="p-3 bg-amber-50 text-amber-600 rounded-lg"><i class="fas fa-boxes text-xl"></i></div>
                <span class="text-slate-400 text-xs font-bold">Stable</span>
            </div>
            <h3 class="text-3xl font-bold text-slate-800 tech-font" v-text="kpis.stock_qty || 0"></h3>
            <p class="text-sm text-slate-400 font-medium" v-text="isArabic ? 'القطع بالمخزون' : 'Items in Stock'"></p>
        </div>

        <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm hover:shadow-md transition-shadow">
            <div class="flex justify-between items-start mb-4">
                <div class="p-3 bg-purple-50 text-purple-600 rounded-lg"><i class="fas fa-truck text-xl"></i></div>
                <span class="text-xs font-bold text-purple-600">Active</span>
            </div>
            <h3 class="text-3xl font-bold text-slate-800 tech-font" v-text="kpis.vendors || 0"></h3>
            <p class="text-sm text-slate-400 font-medium" v-text="isArabic ? 'الموردين' : 'Vendors'"></p>
        </div>

        <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm hover:shadow-md transition-shadow">
            <div class="flex justify-between items-start mb-4">
                <div class="p-3 bg-green-50 text-green-600 rounded-lg"><i class="fas fa-file-invoice-dollar text-xl"></i></div>
                <span class="text-red-400 text-xs font-bold flex items-center">3 Pending</span>
            </div>
            <h3 class="text-3xl font-bold text-slate-800 tech-font" v-text="kpis.pending_pos || 0"></h3>
            <p class="text-sm text-slate-400 font-medium" v-text="isArabic ? 'أوامر المشتريات' : 'Purchase Orders'"></p>
        </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div class="bg-white border border-slate-200 rounded-xl p-6">
             <h3 class="font-bold text-slate-800 mb-4" v-text="isArabic ? 'آخر النشاطات' : 'Recent Activity'"></h3>
             <div class="space-y-4">
                 <div class="flex items-center gap-3 text-sm text-slate-500">
                     <div class="w-2 h-2 rounded-full bg-blue-500"></div> <span v-text="isArabic ? 'تم تشغيل النظام بنجاح' : 'System initialized successfully.'"></span>
                 </div>
                 <div class="flex items-center gap-3 text-sm text-slate-500">
                     <div class="w-2 h-2 rounded-full bg-green-500"></div> <span v-text="isArabic ? 'تم إنشاء المستودع الرئيسي' : 'Warehouse MAIN created.'"></span>
                 </div>
             </div>
        </div>
        <div class="bg-slate-900 rounded-xl p-6 text-white relative overflow-hidden">
             <div class="relative z-10">
                 <h3 class="font-bold mb-2" v-text="isArabic ? 'تحتاج مساعدة ؟' : 'Need Help?'"></h3>
                 <p class="text-slate-400 text-sm mb-4" v-text="isArabic ? 'راجع دليل المستخدم أو تواصل مع الدعم الفني' : 'Check our documentation or contact support.'"></p>
                 <button class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-lg text-sm font-bold" v-text="isArabic ? 'مركز الدعم' : 'Support Center'"></button>
             </div>
             <i class="fas fa-headset absolute -bottom-4 -right-4 text-8xl text-slate-800/50"></i>
        </div>
    </div>
</div>
