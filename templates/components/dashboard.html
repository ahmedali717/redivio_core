<div class="max-w-[1600px] mx-auto space-y-10 animate-in fade-in slide-in-from-bottom-8 duration-1000 pb-16 px-4 sm:px-8" v-cloak>
    
    <!-- 🚀 Enterprise Hero Control Section -->
    <div class="bg-gradient-to-br from-[#0f172a] via-[#1e293b] to-[#0f172a] rounded-[3rem] p-10 sm:p-14 text-white shadow-[0_30px_100px_rgba(0,0,0,0.4)] relative overflow-hidden flex flex-col xl:flex-row justify-between items-start xl:items-center gap-10 border border-white/5 group">
        <!-- Ambient Background FX -->
        <div class="absolute -top-24 -right-24 w-[600px] h-[600px] bg-blue-500/10 rounded-full blur-[120px] transition-all duration-1000 group-hover:bg-blue-500/15"></div>
        <div class="absolute -bottom-24 -left-24 w-[500px] h-[500px] bg-indigo-500/10 rounded-full blur-[120px] transition-all duration-1000 group-hover:bg-indigo-500/15"></div>
        <div class="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/carbon-fibre.png')] opacity-[0.03] mix-blend-overlay"></div>
        
        <div class="relative z-10 max-w-3xl" :dir="isArabic ? 'rtl' : 'ltr'">
            <div class="flex flex-wrap items-center gap-4 mb-8">
                <div class="px-5 py-2 bg-white/5 backdrop-blur-xl border border-white/10 rounded-2xl text-[11px] font-black uppercase tracking-[0.2em] text-blue-300 shadow-2xl flex items-center gap-2">
                    <i class="fas fa-microchip animate-pulse"></i>
                    <span v-text="isArabic ? 'مركز قيادة العمليات المركزية' : 'Central Operations Command'"></span>
                </div>
                <div class="px-4 py-2 bg-emerald-500/10 backdrop-blur-xl border border-emerald-500/20 rounded-2xl text-[10px] font-bold text-emerald-400 uppercase tracking-widest flex items-center gap-2">
                    <span class="relative flex h-2.5 w-2.5">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-500"></span>
                    </span>
                    <span v-text="isArabic ? 'الأنظمة تعمل بكفاءة' : 'System Health: Optimal'"></span>
                </div>
            </div>
            
            <h1 class="text-5xl md:text-7xl font-black mb-6 tracking-tight leading-[1.1] text-white">
                <span v-text="isArabic ? 'مرحباً بعودتك،' : 'Welcome Back,'"></span><br/>
                <span v-text="user.name || 'Admin'" class="text-transparent bg-clip-text bg-gradient-to-r from-blue-400 via-indigo-300 to-emerald-300"></span>
            </h1>
            <p class="text-slate-400 text-lg md:text-xl font-medium leading-relaxed max-w-2xl opacity-90 italic">
                <span v-text="isArabic ? 'أداؤك التشغيلي لليوم جاهز للمراجعة في' : 'Your real-time operational performance matrix for'"></span> 
                <span class="font-black text-white not-italic underline decoration-blue-500/50 underline-offset-4">[[ config.company_name || 'Redivio Global' ]]</span>
            </p>
        </div>
        
        <!-- Global Stats Quick Glance -->
        <div class="relative z-10 w-full xl:w-auto grid grid-cols-2 gap-4 lg:flex lg:flex-row xl:flex-col lg:gap-6">
            <div class="bg-white/5 backdrop-blur-2xl border border-white/10 p-6 rounded-[2rem] min-w-[200px] hover:bg-white/10 transition-all hover:scale-105 cursor-default">
                <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2" v-text="isArabic ? 'إجمالي المبيعات (YTD)' : 'Gross Revenue (YTD)'"></p>
                <h4 class="text-2xl font-black tech-font text-emerald-400">[[ formatCurrency ? formatCurrency(kpis.sales_total*12.4) : '...' ]]</h4>
                <div class="flex items-center gap-2 mt-2">
                    <span class="text-[10px] font-bold text-emerald-500 bg-emerald-500/10 px-2 py-0.5 rounded-full">+14.2%</span>
                    <span class="text-[9px] text-slate-500 font-bold uppercase transition-all">vs prev. yr</span>
                </div>
            </div>
            <div class="bg-white/5 backdrop-blur-2xl border border-white/10 p-6 rounded-[2rem] min-w-[200px] hover:bg-white/10 transition-all hover:scale-105 cursor-default">
                <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-2" v-text="isArabic ? 'معدل كفاءة المخزون' : 'Stock Utilization'"></p>
                <h4 class="text-2xl font-black tech-font text-blue-400">92.8%</h4>
                <div class="w-full bg-white/10 h-1.5 mt-3 rounded-full overflow-hidden">
                    <div class="bg-blue-500 h-full rounded-full w-[92.8%] shadow-[0_0_10px_rgba(59,130,246,0.5)]"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 📊 Operations Matrix Grid (Functional Links) -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-8">
        
        <!-- Inventory Module Card -->
        <div @click="view = 'inventory_module'" class="group bg-white rounded-[2.5rem] p-8 border border-slate-100 shadow-[0_15px_40px_rgba(0,0,0,0.03)] hover:shadow-[0_25px_60px_rgba(0,0,0,0.08)] transition-all cursor-pointer relative overflow-hidden">
            <div class="absolute -right-10 -top-10 w-40 h-40 bg-blue-50 rounded-full group-hover:scale-125 transition-transform duration-700 opacity-60"></div>
            <div class="relative z-10">
                <div class="w-16 h-16 bg-blue-600 rounded-2xl flex items-center justify-center text-white shadow-xl mb-6 group-hover:rotate-6 transition-transform">
                    <i class="fas fa-boxes-stacked text-2xl"></i>
                </div>
                <h3 class="text-2xl font-black text-slate-800 mb-2" v-text="isArabic ? 'إدارة المستودعات' : 'Storage / WMS'"></h3>
                <p class="text-sm text-slate-500 font-medium mb-6 leading-relaxed" v-text="isArabic ? 'إدارة حركات الأصناف، الأرصدة، وعمليات الصرف والاستلام.' : 'Command center for stock movements, levels, and warehousing logistics.'"></p>
                <div class="flex justify-between items-center text-sm font-black text-blue-600 uppercase tracking-widest">
                    <span v-text="isArabic ? 'فتح الموديول' : 'Control Center'"></span>
                    <i class="fas fa-arrow-right group-hover:translate-x-2 transition-transform" :class="isArabic ? 'rotate-180' : ''"></i>
                </div>
            </div>
        </div>

        <!-- Sales Module Card -->
        <div @click="view = 'sales_module'" class="group bg-white rounded-[2.5rem] p-8 border border-slate-100 shadow-[0_15px_40px_rgba(0,0,0,0.03)] hover:shadow-[0_25px_60px_rgba(0,0,0,0.08)] transition-all cursor-pointer relative overflow-hidden">
            <div class="absolute -right-10 -top-10 w-40 h-40 bg-rose-50 rounded-full group-hover:scale-125 transition-transform duration-700 opacity-60"></div>
            <div class="relative z-10">
                <div class="w-16 h-16 bg-rose-600 rounded-2xl flex items-center justify-center text-white shadow-xl mb-6 group-hover:rotate-6 transition-transform">
                    <i class="fas fa-cart-shopping text-2xl"></i>
                </div>
                <h3 class="text-2xl font-black text-slate-800 mb-2" v-text="isArabic ? 'إدارة المبيعات' : 'Sales / CRM'"></h3>
                <p class="text-sm text-slate-500 font-medium mb-6 leading-relaxed" v-text="isArabic ? 'متابعة العملاء، عروض الأسعار، وأوامر البيع والتحصيلات.' : 'Real-time pipeline overview, quotations, and revenue tracking.'"></p>
                <div class="flex justify-between items-center text-sm font-black text-rose-600 uppercase tracking-widest">
                    <span v-text="isArabic ? 'فتح الموديول' : 'Open Pipeline'"></span>
                    <i class="fas fa-arrow-right group-hover:translate-x-2 transition-transform" :class="isArabic ? 'rotate-180' : ''"></i>
                </div>
            </div>
        </div>

        <!-- Procurement Module Card -->
        <div @click="view = 'procurement_module'" class="group bg-white rounded-[2.5rem] p-8 border border-slate-100 shadow-[0_15px_40px_rgba(0,0,0,0.03)] hover:shadow-[0_25px_60px_rgba(0,0,0,0.08)] transition-all cursor-pointer relative overflow-hidden">
            <div class="absolute -right-10 -top-10 w-40 h-40 bg-purple-50 rounded-full group-hover:scale-125 transition-transform duration-700 opacity-60"></div>
            <div class="relative z-10">
                <div class="w-16 h-16 bg-purple-600 rounded-2xl flex items-center justify-center text-white shadow-xl mb-6 group-hover:rotate-6 transition-transform">
                    <i class="fas fa-truck-fast text-2xl"></i>
                </div>
                <h3 class="text-2xl font-black text-slate-800 mb-2" v-text="isArabic ? 'إدارة المشتريات' : 'Procurement'"></h3>
                <p class="text-sm text-slate-500 font-medium mb-6 leading-relaxed" v-text="isArabic ? 'إدارة الموردين، أوامر التوريد، واعتمادات التكلفة.' : 'Supplier management, purchase requisitions, and ETA tracking.'"></p>
                <div class="flex justify-between items-center text-sm font-black text-purple-600 uppercase tracking-widest">
                    <span v-text="isArabic ? 'فتح الموديول' : 'Supply Loop'"></span>
                    <i class="fas fa-arrow-right group-hover:translate-x-2 transition-transform" :class="isArabic ? 'rotate-180' : ''"></i>
                </div>
            </div>
        </div>

        <!-- Finance Module Card -->
        <div @click="view = 'accounting_module'" class="group bg-white rounded-[2.5rem] p-8 border border-slate-100 shadow-[0_15px_40px_rgba(0,0,0,0.03)] hover:shadow-[0_25px_60px_rgba(0,0,0,0.08)] transition-all cursor-pointer relative overflow-hidden">
            <div class="absolute -right-10 -top-10 w-40 h-40 bg-emerald-50 rounded-full group-hover:scale-125 transition-transform duration-700 opacity-60"></div>
            <div class="relative z-10">
                <div class="w-16 h-16 bg-emerald-600 rounded-2xl flex items-center justify-center text-white shadow-xl mb-6 group-hover:rotate-6 transition-transform">
                    <i class="fas fa-file-invoice-dollar text-2xl"></i>
                </div>
                <h3 class="text-2xl font-black text-slate-800 mb-2" v-text="isArabic ? 'المالية والحسابات' : 'Finance / Ledger'"></h3>
                <p class="text-sm text-slate-500 font-medium mb-6 leading-relaxed" v-text="isArabic ? 'التقارير المالية، مراكز التكلفة، وإدارة الفواتير والضرائب.' : 'Financial statements, cost centers, and tax compliance portal.'"></p>
                <div class="flex justify-between items-center text-sm font-black text-emerald-600 uppercase tracking-widest">
                    <span v-text="isArabic ? 'فتح الموديول' : 'Ledger View'"></span>
                    <i class="fas fa-arrow-right group-hover:translate-x-2 transition-transform" :class="isArabic ? 'rotate-180' : ''"></i>
                </div>
            </div>
        </div>
    </div>

    <!-- 👥 System Pulse & Active Intelligence -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 items-stretch">
        
        <!-- Live Active Users Panel (New Feature) -->
        <div class="bg-white border border-slate-100 rounded-[3rem] p-10 shadow-[0_15px_40px_rgba(0,0,0,0.03)] flex flex-col h-full">
            <div class="flex items-center justify-between mb-8">
                <div>
                    <h3 class="font-black text-2xl text-slate-800" v-text="isArabic ? 'المستخدمين النشطين' : 'Active Intel'"></h3>
                    <p class="text-xs font-bold text-slate-400 mt-1 uppercase tracking-widest" v-text="isArabic ? 'المتابعة اللحظية للجلسات' : 'Live Session Monitoring'"></p>
                </div>
                <div class="w-12 h-12 bg-blue-50 text-blue-600 rounded-[1.25rem] flex items-center justify-center">
                    <i class="fas fa-users-viewfinder text-xl"></i>
                </div>
            </div>
            
            <div class="flex-1 space-y-6">
                <div v-for="u in activeUsers" :key="u.id" class="flex items-center gap-5 p-4 bg-slate-50 rounded-2xl border border-slate-100/50 hover:bg-slate-100 transition-colors group">
                    <div class="relative">
                        <div class="w-12 h-12 bg-gradient-to-br from-slate-200 to-slate-300 rounded-xl flex items-center justify-center text-slate-500 font-bold uppercase overflow-hidden">
                            <span v-text="u.name.split(' ').map(n=>n[0]).join('')"></span>
                        </div>
                        <div :class="u.status === 'online' ? 'bg-emerald-500' : 'bg-amber-500'" class="absolute -bottom-1 -right-1 w-4 h-4 border-2 border-white rounded-full"></div>
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="flex items-center justify-between">
                            <p class="font-bold text-slate-800 truncate">[[ u.name ]]</p>
                            <span class="text-[9px] font-black text-slate-400 uppercase tracking-tighter" v-text="u.last_action"></span>
                        </div>
                        <p class="text-[10px] text-blue-600 font-bold uppercase tracking-widest mt-0.5">[[ u.role ]]</p>
                    </div>
                </div>
            </div>
            
            <button class="w-full mt-8 py-4 bg-slate-900 hover:bg-black text-white rounded-[1.5rem] text-xs font-black uppercase tracking-widest shadow-xl transition-all">
                <span v-text="isArabic ? 'إدارة كافة الجلسات' : 'Access Access Manager'"></span>
            </button>
        </div>

        <!-- Comprehensive Revenue Index (Enhanced Chart Area) -->
        <div class="lg:col-span-2 bg-slate-900 border border-slate-800 rounded-[3rem] p-10 shadow-[0_30px_60px_rgba(0,0,0,0.15)] relative overflow-hidden flex flex-col justify-between group">
            <div class="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] opacity-[0.02]"></div>
            
            <div class="relative z-10 flex flex-col md:flex-row justify-between items-start md:items-center gap-6 mb-10">
                <div>
                    <h3 class="font-black text-2xl text-white" v-text="isArabic ? 'مؤشر النمو التشغيلي' : 'Operational Growth Index'"></h3>
                    <p class="text-[10px] font-black text-slate-400 mt-1 uppercase tracking-widest" v-text="isArabic ? 'مقارنة المبيعات vs التكاليف (شهرياً)' : 'Comparative Sales vs Expenditure flow'"></p>
                </div>
                <div class="flex items-center gap-6 bg-white/5 p-3 rounded-2xl backdrop-blur-xl border border-white/10">
                    <div class="flex items-center gap-2">
                        <div class="w-3 h-3 bg-blue-500 rounded-full shadow-[0_0_8px_rgba(59,130,246,0.6)]"></div>
                        <span class="text-[10px] font-black text-slate-300 uppercase">Inbound Value</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <div class="w-3 h-3 bg-rose-500 rounded-full shadow-[0_0_8px_rgba(244,63,94,0.6)]"></div>
                        <span class="text-[10px] font-black text-slate-300 uppercase">Expenditure</span>
                    </div>
                </div>
            </div>
            
            <div class="relative z-10 flex-1 w-full flex items-end justify-between gap-3 border-b border-white/5 pb-4 h-64">
                <div v-for="i in 12" :key="i" class="flex-1 flex flex-col justify-end gap-1.5 h-full group relative">
                    <div class="w-full bg-rose-500/30 rounded-t-lg transition-all duration-700 ease-out cursor-pointer hover:bg-rose-500 group-hover:shadow-[0_-5px_15px_rgba(244,63,94,0.3)]" :style="{height: (20 + (i*4) + (Math.random()*15)) + '%'}"></div>
                    <div class="w-full bg-blue-500 rounded-t-lg transition-all duration-700 ease-out cursor-pointer hover:bg-blue-400 group-hover:shadow-[0_-5px_15px_rgba(59,130,246,0.4)]" :style="{height: (30 + (i*5) + (Math.random()*20)) + '%'}"></div>
                </div>
            </div>
            
            <div class="relative z-10 flex justify-between items-center text-[10px] font-black text-slate-500 mt-6 px-1 uppercase tracking-widest">
                <span>Jan</span><span>Feb</span><span>Mar</span><span>Apr</span><span>May</span><span>Jun</span><span>Jul</span><span>Aug</span><span>Sep</span><span>Oct</span><span>Nov</span><span>Dec</span>
            </div>
        </div>
    </div>
</div>
