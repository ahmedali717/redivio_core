<header class="h-20 bg-white/80 backdrop-blur-md border-b border-slate-200 flex items-center justify-between px-8 sticky top-0 z-10" v-cloak>
    <div>
        <h2 class="text-2xl font-bold text-slate-800 capitalize tracking-tight flex items-center gap-2">
            <span class="text-blue-600" v-if="view === 'dashboard'"><i class="fas fa-chart-pie"></i></span>
            <span class="text-blue-600" v-if="view === 'org_builder'"><i class="fas fa-sitemap"></i></span>
            <span v-if="['inventory', 'wms', 'inventory_module'].includes(view)" class="flex items-center justify-center">
                <img src="/static/brand/rims_icon.png" class="w-6 h-6 object-contain" alt="RIMS">
            </span>
            <span v-if="['procurement_module', 'vendors_list', 'vendor_ledger'].includes(view)" class="flex items-center justify-center">
                <img src="/static/brand/rpms_icon.png" class="w-6 h-6 object-contain" alt="RPMS">
            </span>
            <span class="text-blue-600" v-if="view === 'item_master'"><i class="fas fa-barcode"></i></span>
            <span class="text-blue-600" v-if="view === 'global_config'"><i class="fas fa-cogs"></i></span>
            
            <span v-text="localizedViewName"></span>
        </h2>

        <div class="flex items-center gap-4 mt-1">
            <div class="flex flex-col border-l-2 border-blue-500 pl-3">
                <span class="text-xs font-bold text-slate-700" v-text="licenseStatus.companyName"></span>
                <span class="text-[10px] text-slate-400 font-medium">
                    <span v-text="isArabic ? 'تاريخ الإنشاء:' : 'Created:'"></span>
                    <span class="text-slate-600" v-text="licenseStatus.createdAt ? new Date(licenseStatus.createdAt).toLocaleDateString('en-GB') : '...'"></span>
                </span>
            </div>

            <div class="flex flex-col gap-1 w-32 ml-2">
                <div class="flex justify-between text-[9px] font-black text-slate-500 uppercase tracking-tighter">
                    <span><span v-text="licenseStatus.daysRemaining"></span> <span v-text="isArabic ? 'يوم متبقي' : 'Days'"></span></span>
                    <span v-text="Math.round((licenseStatus.daysRemaining / 15) * 100) + '%'"></span>
                </div>
                <div class="h-1.5 w-full bg-slate-200 rounded-full overflow-hidden shadow-inner">
                    <div class="h-full transition-all duration-1000 ease-out" 
                         :class="licenseStatus.daysRemaining <= 3 ? 'bg-red-500' : 'bg-blue-500'"
                         :style="{ width: (licenseStatus.daysRemaining / 15 * 100) + '%' }">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="flex items-center gap-6">
        <div class="hidden lg:flex items-center gap-2 px-3 py-1.5 bg-blue-50 rounded-lg border border-blue-100 shadow-sm">
            <i class="fas fa-hourglass-half text-blue-500 text-xs animate-pulse"></i>
            <span class="text-xs font-bold text-blue-700">
                <span v-text="licenseStatus.daysRemaining"></span> / 15 <span v-text="isArabic ? 'يوم متبقي' : 'Days Left'"></span>
            </span>
        </div>

        <!-- 🚀 القائمة المنسدلة المحدثة للتبديل بين الشركات (The Dropdown you mentioned) -->
        <div class="relative group">
            <button class="flex items-center gap-3 px-4 py-2 bg-slate-50 border border-slate-200 rounded-xl hover:bg-white hover:border-blue-400 transition-all shadow-sm">
                <div class="text-right">
                    <p class="text-[10px] text-slate-400 font-bold uppercase leading-none mb-1" v-text="isArabic ? 'المنشأة الحالية' : 'Current Entity'"></p>
                    <p class="text-xs font-bold text-slate-700 leading-none" v-text="opcos.find(o => o.id === parseInt(activeOpcoId))?.name || '...'"></p>
                </div>
                <i class="fas fa-shuffle text-blue-500 text-xs transition-transform group-hover:rotate-180"></i>
            </button>

            <div class="absolute top-full right-0 mt-2 w-64 bg-white border border-slate-200 rounded-2xl shadow-2xl opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all z-50 overflow-hidden">
                <div class="p-3 border-b border-slate-50 bg-slate-50/50 flex justify-between items-center">
                    <span class="text-[10px] font-black text-slate-400 uppercase" v-text="isArabic ? 'اختر منشأة للعمل' : 'Select Work Entity'"></span>
                    <i class="fas fa-building text-blue-200"></i>
                </div>
                <div class="max-h-60 overflow-y-auto">
                    <div v-for="company in allOpcos" 
                         :key="company.id"
                         @click="switchCompany(company.id)"
                         class="p-4 hover:bg-blue-50 cursor-pointer flex items-center justify-between transition-colors border-b border-slate-50 last:border-0"
                         :class="{'bg-blue-50/50 border-r-4 border-blue-500': company.id === parseInt(activeOpcoId)}">
                        <div>
                            <p class="text-sm font-bold text-slate-700" v-text="company.name"></p>
                            <p class="text-[9px] text-slate-400 font-mono" v-text="company.code"></p>
                        </div>
                        <i v-if="company.id === parseInt(activeOpcoId)" class="fas fa-circle-check text-blue-500"></i>
                    </div>
                </div>
            </div>
        </div>

        <div class="hidden md:flex flex-col items-end">
            <span class="text-2xl font-bold text-slate-700 tech-font leading-none" v-text="currentTime"></span>
            <span class="text-[10px] text-slate-400 font-bold uppercase tracking-widest mt-1" v-text="currentDate"></span>
        </div>
        
        <div class="h-8 w-px bg-slate-200 mx-2"></div>
        
        <!-- 🚀 إشعارات وسجل (Notifications & Logs) -->
        <div class="flex items-center gap-2">
            <!-- Notifications Dropdown -->
            <div class="relative notif-area-container">
                <button @click="showNotificationsDropdown = !showNotificationsDropdown" class="w-10 h-10 rounded-full bg-slate-50 hover:bg-slate-100 text-slate-500 transition-all flex items-center justify-center border border-slate-100 shadow-sm relative">
                    <i class="fas fa-bell"></i>
                    <span class="absolute top-0 right-0 w-3 h-3 bg-red-500 rounded-full border-2 border-white animate-pulse"></span>
                </button>
                
                <div v-if="showNotificationsDropdown" 
                     :class="isArabic ? 'left-0' : 'right-0'"
                     class="absolute top-full mt-2 w-80 bg-white border border-slate-200 rounded-2xl shadow-2xl z-50 overflow-hidden animate-in zoom-in-95 duration-200">
                    <div class="p-4 border-b border-slate-100 bg-slate-50/80 flex justify-between items-center">
                        <span class="font-bold text-slate-700" v-text="isArabic ? 'الإشعارات' : 'Notifications'"></span>
                        <span class="text-xs text-blue-600 bg-blue-50 px-2 py-1 rounded-full font-bold uppercase">2 New</span>
                    </div>
                    <div class="max-h-80 overflow-y-auto">
                        <div class="p-4 border-b border-slate-50 hover:bg-slate-50 cursor-pointer transition-colors flex gap-3 text-right" :dir="isArabic ? 'rtl' : 'ltr'">
                            <div class="w-8 h-8 rounded-full bg-indigo-50 text-indigo-500 flex items-center justify-center shrink-0"><i class="fas fa-box"></i></div>
                            <div class="flex-1">
                                <p class="text-sm text-slate-700 font-bold" v-text="isArabic ? 'انخفاض مخزون صنف' : 'Low Stock Alert'"></p>
                                <p class="text-xs text-slate-500 mt-1 leading-relaxed" v-text="isArabic ? 'الصنف #ITEM-001 وصل للحد الأدنى المتوقع، يرجى إعادة الطلب.' : 'Item #ITEM-001 reached minimum level.'"></p>
                                <p class="text-[10px] text-slate-400 mt-1">2 mins ago</p>
                            </div>
                        </div>
                        <div class="p-4 hover:bg-slate-50 cursor-pointer transition-colors flex gap-3 text-right" :dir="isArabic ? 'rtl' : 'ltr'">
                            <div class="w-8 h-8 rounded-full bg-rose-50 text-rose-500 flex items-center justify-center shrink-0"><i class="fas fa-file-invoice"></i></div>
                            <div class="flex-1">
                                <p class="text-sm text-slate-700 font-bold" v-text="isArabic ? 'تحديث النظام ' : 'System Alert'"></p>
                                <p class="text-xs text-slate-500 mt-1 leading-relaxed" v-text="isArabic ? 'تم تحديث سياستك الضريبية بنجاح وتسجيل الفواتير المتبقية.' : 'System tax policies updated successfully.'"></p>
                                <p class="text-[10px] text-slate-400 mt-1">1 hour ago</p>
                            </div>
                        </div>
                    </div>
                    <div class="p-3 text-center border-t border-slate-100 bg-slate-50 hover:bg-slate-100 cursor-pointer transition-colors text-xs font-bold text-blue-600">
                        <span v-text="isArabic ? 'عرض كل الإشعارات' : 'View All Notifications'"></span>
                    </div>
                </div>
            </div>

            <!-- Activity Log Toggle -->
            <button @click="showActivityLog = !showActivityLog" class="w-10 h-10 rounded-full bg-slate-50 hover:bg-blue-50 hover:text-blue-600 text-slate-500 transition-all flex items-center justify-center border border-slate-100 shadow-sm relative group" :class="{'bg-blue-50 text-blue-600 border-blue-200': showActivityLog}">
                <i class="fas fa-history group-hover:-rotate-45 transition-transform duration-300"></i>
            </button>

            <!-- Settings Shortcut -->
            <button @click="view = 'global_config'" class="w-10 h-10 rounded-full bg-slate-50 hover:bg-slate-800 hover:text-white text-slate-500 transition-all flex items-center justify-center border border-slate-100 shadow-sm group" :class="{'bg-slate-800 text-white border-slate-700': view === 'global_config'}">
                <i class="fas fa-cog group-hover:rotate-90 transition-transform duration-500"></i>
            </button>
        </div>

        <div class="h-8 w-px bg-slate-200 mx-2"></div>
        
        <a href="/logout/" class="w-10 h-10 rounded-full bg-slate-50 hover:bg-red-500 text-slate-400 hover:text-white transition-all duration-300 flex items-center justify-center border border-slate-100 shadow-sm group">
            <i class="fas fa-sign-out-alt group-hover:scale-110 transition-transform"></i>
        </a>
    </div>
</header>
