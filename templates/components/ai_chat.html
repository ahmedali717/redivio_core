{% load static %}
<div id="ai-chat-widget" class="fixed bottom-6 right-6 z-[9999] font-sans" dir="rtl">
    <!-- Chat Button -->
    <button id="ai-chat-btn" class="w-14 h-14 bg-gradient-to-r from-blue-600 to-indigo-600 rounded-full shadow-2xl shadow-blue-500/50 text-white flex items-center justify-center hover:scale-110 transition-transform cursor-pointer relative group p-2">
        <img src="{% static 'brand/logo_r.png' %}" class="w-full h-full object-contain" alt="Redivio AI">
        <div class="absolute -top-1 -right-1 w-4 h-4 bg-red-500 rounded-full border-2 border-white animate-pulse"></div>
        
        <!-- Tooltip -->
        <div class="absolute -top-12 right-0 bg-slate-800 text-white text-xs px-3 py-1.5 rounded-lg whitespace-nowrap opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none">
            المساعد الذكي (Redivio AI)
        </div>
    </button>

    <!-- Chat Window -->
    <div id="ai-chat-window" class="hidden absolute bottom-20 right-0 w-[380px] bg-white rounded-2xl shadow-2xl border border-slate-200 overflow-hidden flex flex-col origin-bottom-right transition-all duration-300" style="height: 550px; max-height: 80vh;">
        <!-- Header -->
        <div class="bg-gradient-to-r from-blue-600 to-indigo-600 p-4 flex items-center justify-between text-white">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-white rounded-full flex items-center justify-center backdrop-blur-sm p-1.5 shadow-sm">
                    <img src="{% static 'brand/logo_r.png' %}" class="w-full h-full object-contain" alt="Redivio AI">
                </div>
                <div>
                    <h3 class="font-bold text-sm">المساعد الذكي</h3>
                    <p class="text-xs text-blue-100">مدعوم بـ Redivio AI</p>
                </div>
            </div>
            <button id="ai-chat-close" class="w-8 h-8 hover:bg-white/20 rounded-full flex items-center justify-center transition-colors">
                <i class="fas fa-times"></i>
            </button>
        </div>

        <!-- Messages Area -->
        <div id="ai-chat-messages" class="flex-1 overflow-y-auto p-4 space-y-4 bg-slate-50">
            <!-- Welcome Message -->
            <div class="flex gap-3">
                <div class="w-8 h-8 bg-blue-100 rounded-full flex items-center justify-center flex-shrink-0">
                    <i class="fas fa-robot text-blue-600 text-xs"></i>
                </div>
                <div class="bg-white p-3 rounded-2xl rounded-tr-sm shadow-sm border border-slate-100 text-sm text-slate-700">
                    أهلاً بك في نظام Redivio! 👋<br>
                    أنا المساعد الذكي الخاص بك، أقدر أساعدك في:
                    <ul class="list-disc list-inside mt-2 text-slate-500 space-y-1">
                        <li>شرح كيفية استخدام النظام</li>
                        <li>الاستعلام عن المخزون والأصناف</li>
                        <li>تحليل البيانات السريعة</li>
                    </ul>
                    كيف يمكنني مساعدتك اليوم؟
                </div>
            </div>
        </div>

        <!-- Input Area -->
        <div class="p-3 bg-white border-t border-slate-100">
            <form id="ai-chat-form" class="flex gap-2">
                <input type="text" id="ai-chat-input" placeholder="اسأل عن أي شيء في النظام..." 
                       class="flex-1 bg-slate-100 text-sm rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-blue-500/20 focus:bg-white transition-all border border-transparent focus:border-blue-500">
                <button type="submit" class="w-12 h-12 bg-blue-600 hover:bg-blue-700 text-white rounded-xl flex items-center justify-center shadow-md transition-colors disabled:opacity-50">
                    <i class="fas fa-paper-plane rtl:-scale-x-100"></i>
                </button>
            </form>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const chatBtn = document.getElementById('ai-chat-btn');
        const chatWindow = document.getElementById('ai-chat-window');
        const closeBtn = document.getElementById('ai-chat-close');
        const chatForm = document.getElementById('ai-chat-form');
        const chatInput = document.getElementById('ai-chat-input');
        const messagesArea = document.getElementById('ai-chat-messages');
        const submitBtn = chatForm.querySelector('button');

        // Toggle Chat Window
        const toggleChat = () => {
            chatWindow.classList.toggle('hidden');
            if(!chatWindow.classList.contains('hidden')) {
                chatInput.focus();
                // Remove notification dot
                const dot = chatBtn.querySelector('.animate-pulse');
                if(dot) dot.remove();
            }
        };

        chatBtn.addEventListener('click', toggleChat);
        closeBtn.addEventListener('click', toggleChat);

        // Append Message
        const appendMessage = (text, isUser = false) => {
            const div = document.createElement('div');
            div.className = `flex gap-3 ${isUser ? 'flex-row-reverse' : ''}`;
            
            const avatar = isUser ? 
                `<div class="w-8 h-8 bg-slate-200 rounded-full flex items-center justify-center flex-shrink-0"><i class="fas fa-user text-slate-500 text-xs"></i></div>` :
                `<div class="w-8 h-8 bg-blue-100 rounded-full flex items-center justify-center flex-shrink-0 overflow-hidden p-1.5"><img src="{% static 'brand/logo_r.png' %}" class="w-full h-full object-contain" alt="R"></div>`;
            
            const bubbleClasses = isUser ? 
                'bg-blue-600 text-white rounded-2xl rounded-tl-sm shadow-sm p-3 text-sm' : 
                'bg-white text-slate-700 rounded-2xl rounded-tr-sm shadow-sm border border-slate-100 p-3 text-sm';
            
            // Basic markdown-like parsing (bolding, line breaks)
            const formattedText = text.replace(/\n/g, '<br>').replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');

            div.innerHTML = `
                ${avatar}
                <div class="${bubbleClasses}" style="max-width: 80%;">${formattedText}</div>
            `;
            
            messagesArea.appendChild(div);
            messagesArea.scrollTop = messagesArea.scrollHeight;
        };

        const appendTypingIndicator = () => {
            const id = 'typing-' + Date.now();
            const div = document.createElement('div');
            div.id = id;
            div.className = 'flex gap-3';
            div.innerHTML = `
                <div class="w-8 h-8 bg-blue-100 rounded-full flex items-center justify-center flex-shrink-0 overflow-hidden p-1.5"><img src="{% static 'brand/logo_r.png' %}" class="w-full h-full object-contain" alt="R"></div>
                <div class="bg-white p-4 rounded-2xl rounded-tr-sm shadow-sm border border-slate-100 flex items-center gap-1 w-16">
                    <div class="w-2 h-2 bg-slate-300 rounded-full animate-bounce"></div>
                    <div class="w-2 h-2 bg-slate-300 rounded-full animate-bounce" style="animation-delay: 0.1s"></div>
                    <div class="w-2 h-2 bg-slate-300 rounded-full animate-bounce" style="animation-delay: 0.2s"></div>
                </div>
            `;
            messagesArea.appendChild(div);
            messagesArea.scrollTop = messagesArea.scrollHeight;
            return id;
        };

        const removeTypingIndicator = (id) => {
            const el = document.getElementById(id);
            if(el) el.remove();
        };

        // Handle Form Submit
        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const message = chatInput.value.trim();
            if(!message) return;

            // 1. Show user message
            appendMessage(message, true);
            chatInput.value = '';
            submitBtn.disabled = true;

            // 2. Show typing indicator
            const typingId = appendTypingIndicator();

            try {
                // 3. Send to Backend
                const response = await fetch('/ai/chat/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ message })
                });

                const data = await response.json();
                
                removeTypingIndicator(typingId);
                
                if(!response.ok) {
                    appendMessage(`⚠️ عذراً، حدث خطأ: ${data.error || 'يرجى التأكد من إعدادات API Key.'}`);
                } else {
                    appendMessage(data.reply);
                }

            } catch (error) {
                removeTypingIndicator(typingId);
                appendMessage('⚠️ خطأ في الاتصال بالخادم. تأكد من تشغيل السيرفر بشكل صحيح.');
            } finally {
                submitBtn.disabled = false;
                chatInput.focus();
            }
        });
    });
</script>
