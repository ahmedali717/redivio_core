<aside :class="sidebarCollapsed ? 'w-20' : 'w-64'"
    class="bg-gradient-to-b from-brand to-brand-dark text-white flex flex-col h-[calc(100vh-1.5rem)] my-3 mx-3 rounded-[1.5rem] hidden md:flex shadow-[0_15px_40px_rgba(44,130,240,0.3)] border border-white/20 z-20 transition-all duration-300 relative overflow-hidden"
    v-cloak>

    <button @click="sidebarCollapsed = !sidebarCollapsed" :class="isArabic ? '-left-3' : '-right-3'"
        class="absolute top-20 w-6 h-6 bg-white rounded-full flex items-center justify-center text-xs text-brand shadow-lg hover:scale-110 transition-transform cursor-pointer border border-brand/20 z-50">
        <i
            :class="sidebarCollapsed ? (isArabic ? 'fa-solid fa-chevron-left' : 'fa-solid fa-chevron-right') : (isArabic ? 'fa-solid fa-chevron-right' : 'fa-solid fa-chevron-left')"></i>
    </button>

    <div
        class="h-20 flex items-center gap-3 px-5 border-b border-white/20 bg-white/10 overflow-visible text-white relative brand-area-container">
        <div class="flex items-center gap-3 cursor-pointer group" @click="showBrandDropdown = !showBrandDropdown">
            <img src="/static/brand/logo_white.png" onerror="this.src='/static/brand/logo_r.png'" class="w-9 h-9 object-contain shrink-0 brightness-0 invert" alt="Redivio Logo">
            <span v-show="!sidebarCollapsed"
                class="text-lg font-bold tracking-wider tech-font animate-in fade-in duration-300">REDIVIO</span>
            <i v-show="!sidebarCollapsed"
                class="fa-solid fa-chevron-down text-[10px] text-white/70 transition-transform"
                :class="{'rotate-180': showBrandDropdown}"></i>
        </div>

        <!-- 🚀 القائمة المتداخلة الجديدة (Nested Fly-out Menu) -->
        <div v-if="showBrandDropdown" :class="isArabic ? 'right-4 left-auto' : 'left-4 right-auto'"
            class="absolute top-16 w-56 bg-white border border-slate-100 rounded-2xl shadow-[0_20px_50px_rgba(0,0,0,0.1)] z-[100] overflow-visible animate-in zoom-in-95 duration-200 text-slate-800">

            <div class="p-2 space-y-1">
                <!-- Dashboard / Command Center (Only in Modular Mode) -->
                <button v-if="systemMode !== 'standalone' && canAccess('dashboard')" @click="view = 'dashboard'; showBrandDropdown = false"
                    class="w-full flex items-center gap-3 p-2.5 rounded-xl hover:bg-slate-50 text-slate-600 hover:text-brand text-left transition-all group/item">
                    <i
                        class="fas fa-chart-pie w-5 text-center text-slate-400 group-hover/item:text-brand transition-colors"></i>
                    <span class="text-[11px] font-bold tracking-wider">[[ isArabic ? 'لوحة القيادة التنفيذية' : 'Command Center'
                        ]]</span>
                </button>

                <!-- Dynamic Purchased Modules -->
                <template v-for="mod in sidebarGroups.operations.filter(m => m.id !== 'org_builder')" :key="mod.id">
                    <button v-if="canAccess(mod.id)"
                        @click="view = mod.id; showBrandDropdown = false; if(mod.id === 'inventory_module') inventoryTab = 'levels';"
                        class="w-full flex items-center gap-3 p-2.5 rounded-xl hover:bg-slate-50 text-slate-600 hover:text-brand text-left transition-all group/item">

                        <div v-if="mod.id === 'inventory_module'"
                            class="w-5 h-5 flex items-center justify-center shrink-0">
                            <img src="/static/brand/rims_icon.png"
                                class="w-full h-full object-contain filter group-hover:brightness-0 group-hover:sepia group-hover:hue-rotate-[200deg] group-hover:saturate-500 transition-all"
                                alt="RIMS">
                        </div>
                        <div v-else-if="mod.id === 'procurement_module'"
                            class="w-5 h-5 flex items-center justify-center shrink-0">
                            <img src="/static/brand/rpms_icon.png"
                                class="w-full h-full object-contain filter group-hover:brightness-0 group-hover:sepia group-hover:hue-rotate-[200deg] group-hover:saturate-500 transition-all"
                                alt="RPMS">
                        </div>
                        <i v-else :class="mod.icon"
                            class="w-5 text-center text-slate-400 group-hover/item:text-brand transition-colors"></i>

                        <span class="text-[11px] font-bold" v-text="isArabic ? mod.name.ar : mod.name.en"></span>
                    </button>
                </template>


                <div class="h-px bg-slate-100 my-2 mx-1"></div>

                <div class="px-3 py-2 text-center">
                    <span class="text-[9px] text-brand-dark font-black uppercase tracking-[0.2em] bg-brand/10 py-1 px-3 rounded-full">Core v1.0.4</span>
                </div>
            </div>
        </div>
    </div>

    <nav class="flex-1 overflow-y-auto py-6 px-3 space-y-1">

        <!-- Inventory Context -->

                </div>

            <a href="#" v-if="canAccess('inventory_module')" @click.prevent="inventoryTab = 'items'"

            <a href="#" v-if="canAccess('global_config')" @click.prevent="view = 'global_config'"

            <input name="next" type="hidden" value="{{ request.get_full_path }}">

                class="w-full flex items-center gap-3 px-3 py-2 text-slate-400 hover:bg-white/10 hover:text-white rounded-lg transition-all text-[11px] font-bold border border-white/10 hover:border-brand/50 uppercase tracking-tighter shadow-sm">
