<aside :class="sidebarCollapsed ? 'w-20' : 'w-64'" class="bg-slate-900 text-white flex flex-col h-full hidden md:flex shadow-xl z-20 transition-all duration-300 relative" v-cloak>
    
    <button @click="sidebarCollapsed = !sidebarCollapsed" 
            class="absolute -right-3 top-20 w-6 h-6 bg-blue-600 rounded-full flex items-center justify-center text-xs shadow-lg hover:scale-110 transition-transform cursor-pointer border-2 border-slate-900 z-50">
        <i :class="sidebarCollapsed ? 'fa-solid fa-chevron-right' : 'fa-solid fa-chevron-left'"></i>
    </button>

    <div class="h-16 flex items-center gap-3 px-4 border-b border-slate-800 bg-slate-950 overflow-visible text-white relative brand-area-container">
        <div class="flex items-center gap-3 cursor-pointer group" @click="showBrandDropdown = !showBrandDropdown">
            <img src="/static/brand/logo_r.png" class="w-8 h-8 object-contain shrink-0" alt="Redivio Logo">
            <span v-show="!sidebarCollapsed" class="text-lg font-bold tracking-wider tech-font animate-in fade-in duration-300">REDIVIO</span>
            <i v-show="!sidebarCollapsed" class="fa-solid fa-chevron-down text-[10px] text-slate-500 transition-transform" :class="{'rotate-180': showBrandDropdown}"></i>
        </div>

        <!-- 🚀 القائمة المتداخلة الجديدة (Nested Fly-out Menu) -->
        <div v-if="showBrandDropdown" 
             class="absolute top-14 left-4 w-56 bg-slate-900 border border-slate-700 rounded-2xl shadow-[0_20px_50px_rgba(0,0,0,0.5)] z-[100] overflow-visible animate-in zoom-in-95 duration-200">
            
            <div class="p-2 space-y-1">
                <!-- قسم العمليات -->
                <div class="relative group/nested">
                    <div class="flex items-center justify-between p-3 rounded-xl hover:bg-slate-800 cursor-pointer text-slate-300 hover:text-white transition-all group-hover/nested:bg-slate-800">
                        <div class="flex items-center gap-3">
                            <div class="w-7 h-7 bg-blue-500/10 rounded-lg flex items-center justify-center">
                                <i class="fas fa-rocket text-blue-500 text-xs"></i>
                            </div>
                            <span class="text-[11px] font-black uppercase tracking-widest">[[ isArabic ? 'العمليات' : 'Operation' ]]</span>
                        </div>
                        <i class="fas fa-chevron-right text-[10px] text-slate-600 transition-transform" :class="isArabic ? 'rotate-180 group-hover/nested:rotate-90' : 'group-hover/nested:rotate-90'"></i>
                    </div>
                    
                    <!-- القائمة الفرعية: العمليات -->
                    <div :class="isArabic ? 'right-full mr-1' : 'left-full ml-1'" 
                         class="absolute top-0 w-60 bg-slate-900 border border-slate-700 rounded-2xl shadow-2xl opacity-0 invisible group-hover/nested:opacity-100 group-hover/nested:visible transition-all duration-300 p-2 space-y-1 z-[110]">
                        <button @click="view = 'dashboard'; showBrandDropdown = false" class="w-full flex items-center gap-3 p-2.5 rounded-xl hover:bg-blue-600 text-slate-400 hover:text-white text-left transition-all group/item">
                            <i class="fas fa-chart-pie w-5 text-center text-blue-500 group-hover/item:text-white"></i>
                            <span class="text-[11px] font-bold">[[ isArabic ? 'لوحة التحكم' : 'Dashboard' ]]</span>
                        </button>
                        <button @click="view = 'inventory_module'; inventoryTab = 'levels'; showBrandDropdown = false" class="w-full flex items-center gap-3 p-2.5 rounded-xl hover:bg-indigo-600 text-slate-400 hover:text-white text-left transition-all group/item">
                            <i class="fas fa-boxes-stacked w-5 text-center text-indigo-500 group-hover/item:text-white"></i>
                            <span class="text-[11px] font-bold">[[ isArabic ? 'المستودعات' : 'Inventory' ]]</span>
                        </button>
                        <button @click="view = 'procurement_module'; showBrandDropdown = false" class="w-full flex items-center gap-3 p-2.5 rounded-xl hover:bg-emerald-600 text-slate-400 hover:text-white text-left transition-all group/item">
                            <i class="fas fa-truck w-5 text-center text-emerald-500 group-hover/item:text-white"></i>
                            <span class="text-[11px] font-bold">[[ isArabic ? 'المشتريات' : 'Procurement' ]]</span>
                        </button>
                        <button @click="view = 'sales_module'; showBrandDropdown = false" class="w-full flex items-center gap-3 p-2.5 rounded-xl hover:bg-rose-600 text-slate-400 hover:text-white text-left transition-all group/item">
                            <i class="fas fa-cart-shopping w-5 text-center text-rose-500 group-hover/item:text-white"></i>
                            <span class="text-[11px] font-bold">[[ isArabic ? 'المبيعات' : 'Sales' ]]</span>
                        </button>
                        <button @click="view = 'accounting_module'; showBrandDropdown = false" class="w-full flex items-center gap-3 p-2.5 rounded-xl hover:bg-amber-600 text-slate-400 hover:text-white text-left transition-all group/item">
                            <i class="fas fa-file-invoice-dollar w-5 text-center text-amber-500 group-hover/item:text-white"></i>
                            <span class="text-[11px] font-bold">[[ isArabic ? 'المحاسبة' : 'Accounting' ]]</span>
                        </button>
                    </div>
                </div>

                <!-- قسم الإعدادات -->
                <div class="relative group/nested">
                    <div class="flex items-center justify-between p-3 rounded-xl hover:bg-slate-800 cursor-pointer text-slate-300 hover:text-white transition-all group-hover/nested:bg-slate-800">
                        <div class="flex items-center gap-3">
                            <div class="w-7 h-7 bg-amber-500/10 rounded-lg flex items-center justify-center">
                                <i class="fas fa-sliders text-amber-500 text-xs"></i>
                            </div>
                            <span class="text-[11px] font-black uppercase tracking-widest">[[ isArabic ? 'الإعدادات' : 'Settings' ]]</span>
                        </div>
                        <i class="fas fa-chevron-right text-[10px] text-slate-600 transition-transform" :class="isArabic ? 'rotate-180 group-hover/nested:rotate-90' : 'group-hover/nested:rotate-90'"></i>
                    </div>
                    
                    <!-- القائمة الفرعية: الإعدادات -->
                    <div :class="isArabic ? 'right-full mr-1' : 'left-full ml-1'" 
                         class="absolute top-0 w-60 bg-slate-900 border border-slate-700 rounded-2xl shadow-2xl opacity-0 invisible group-hover/nested:opacity-100 group-hover/nested:visible transition-all duration-300 p-2 space-y-1 z-[110]">
                        <button @click="view = 'org_builder'; showBrandDropdown = false" class="w-full flex items-center gap-3 p-2.5 rounded-xl hover:bg-blue-600 text-slate-400 hover:text-white text-left transition-all group/item">
                            <i class="fas fa-sitemap w-5 text-center text-blue-400 group-hover/item:text-white"></i>
                            <span class="text-[11px] font-bold">[[ isArabic ? 'بناء الهيكل' : 'Org Builder' ]]</span>
                        </button>
                        <button @click="view = 'global_config'; showBrandDropdown = false" class="w-full flex items-center gap-3 p-2.5 rounded-xl hover:bg-slate-700 text-slate-400 hover:text-white text-left transition-all group/item">
                            <i class="fas fa-cogs w-5 text-center text-slate-500 group-hover/item:text-white"></i>
                            <span class="text-[11px] font-bold">[[ isArabic ? 'إعدادات النظام' : 'System' ]]</span>
                        </button>
                        <button @click="view = 'users'; showBrandDropdown = false" class="w-full flex items-center gap-3 p-2.5 rounded-xl hover:bg-slate-700 text-slate-400 hover:text-white text-left transition-all group/item">
                            <i class="fas fa-users w-5 text-center text-slate-500 group-hover/item:text-white"></i>
                            <span class="text-[11px] font-bold">[[ isArabic ? 'المستخدمين' : 'Users' ]]</span>
                        </button>
                    </div>
                </div>

                <div class="h-px bg-slate-800 my-2 mx-1"></div>
                
                <div class="px-3 py-2">
                    <span class="text-[8px] text-slate-600 font-black uppercase tracking-[0.2em]">Core v1.0.4</span>
                </div>
            </div>
        </div>
    </div>

    <nav class="flex-1 overflow-y-auto py-6 px-3 space-y-1">
        
        <!-- Inventory Context -->
        <template v-if="view === 'inventory_module'">
            <div class="text-[10px] font-bold text-indigo-400 uppercase tracking-widest px-3 mb-4 mt-2 overflow-hidden">
                <span v-show="!sidebarCollapsed" v-text="isArabic ? 'إدارة المستودعات' : 'Inventory Management'"></span>
                <hr v-show="sidebarCollapsed" class="border-indigo-800">
            </div>
            
            <a href="#" @click.prevent="inventoryTab = 'levels'" 
               :class="inventoryTab === 'levels' ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-900/20' : 'text-slate-400 hover:bg-slate-800'"
               class="flex items-center gap-3 px-3 py-2.5 rounded-lg transition-all group overflow-hidden">
                <i class="fas fa-boxes-stacked w-6 text-center text-lg"></i>
                <span v-show="!sidebarCollapsed" class="font-medium text-sm whitespace-nowrap" v-text="isArabic ? 'الأرصدة' : 'Stock Levels'"></span>
            </a>
            <a href="#" @click.prevent="inventoryTab = 'items'" 
               :class="inventoryTab === 'items' ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-900/20' : 'text-slate-400 hover:bg-slate-800'"
               class="flex items-center gap-3 px-3 py-2.5 rounded-lg transition-all group overflow-hidden">
                <i class="fas fa-barcode w-6 text-center text-lg"></i>
                <span v-show="!sidebarCollapsed" class="font-medium text-sm whitespace-nowrap" v-text="isArabic ? 'سجل الأصناف' : 'Item Master'"></span>
            </a>
            <a href="#" @click.prevent="inventoryTab = 'item_ledger'" 
               :class="inventoryTab === 'item_ledger' ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-900/20' : 'text-slate-400 hover:bg-slate-800'"
               class="flex items-center gap-3 px-3 py-2.5 rounded-lg transition-all group overflow-hidden">
                <i class="fas fa-exchange-alt w-6 text-center text-lg"></i>
                <span v-show="!sidebarCollapsed" class="font-medium text-sm whitespace-nowrap" v-text="isArabic ? 'العمليات المخزنية' : 'Inventory Moves'"></span>
            </a>
            <a href="#" @click.prevent="inventoryTab = 'moves'" 
               :class="inventoryTab === 'moves' ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-900/20' : 'text-slate-400 hover:bg-slate-800'"
               class="flex items-center gap-3 px-3 py-2.5 rounded-lg transition-all group overflow-hidden">
                <i class="fas fa-history w-6 text-center text-lg"></i>
                <span v-show="!sidebarCollapsed" class="font-medium text-sm whitespace-nowrap" v-text="isArabic ? 'حركة صنف' : 'Item Ledger'"></span>
            </a>
            <a href="#" @click.prevent="inventoryTab = 'reports'" 
               :class="inventoryTab === 'reports' ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-900/20' : 'text-slate-400 hover:bg-slate-800'"
               class="flex items-center gap-3 px-3 py-2.5 rounded-lg transition-all group overflow-hidden">
                <i class="fas fa-chart-line w-6 text-center text-lg"></i>
                <span v-show="!sidebarCollapsed" class="font-medium text-sm whitespace-nowrap" v-text="isArabic ? 'التقارير' : 'Reports'"></span>
            </a>
        </template>

        <!-- Sales Context -->
        <template v-else-if="view === 'sales_module'">
            <div class="text-[10px] font-bold text-rose-400 uppercase tracking-widest px-3 mb-4 mt-2 overflow-hidden">
                <span v-show="!sidebarCollapsed" v-text="isArabic ? 'إدارة المبيعات' : 'Sales Management'"></span>
                <hr v-show="sidebarCollapsed" class="border-rose-800">
            </div>
            
            <a href="#" @click.prevent="salesTab = 'dashboard'" 
               :class="salesTab === 'dashboard' ? 'bg-rose-600 text-white shadow-lg shadow-rose-900/20' : 'text-slate-400 hover:bg-slate-800'"
               class="flex items-center gap-3 px-3 py-2.5 rounded-lg transition-all group overflow-hidden">
                <i class="fas fa-chart-line w-6 text-center text-lg"></i>
                <span v-show="!sidebarCollapsed" class="font-medium text-sm whitespace-nowrap" v-text="isArabic ? 'نظرة عامة' : 'Overview'"></span>
            </a>
            <a href="#" @click.prevent="salesTab = 'orders'" 
               :class="salesTab === 'orders' ? 'bg-rose-600 text-white shadow-lg shadow-rose-900/20' : 'text-slate-400 hover:bg-slate-800'"
               class="flex items-center gap-3 px-3 py-2.5 rounded-lg transition-all group overflow-hidden">
                <i class="fas fa-file-invoice-dollar w-6 text-center text-lg"></i>
                <span v-show="!sidebarCollapsed" class="font-medium text-sm whitespace-nowrap" v-text="isArabic ? 'أوامر البيع' : 'Sales Orders'"></span>
            </a>
        </template>

        <!-- Accounting Context -->
        <template v-else-if="view === 'accounting_module'">
            <div class="text-[10px] font-bold text-amber-400 uppercase tracking-widest px-3 mb-4 mt-2 overflow-hidden">
                <span v-show="!sidebarCollapsed" v-text="isArabic ? 'المحاسبة والمالية' : 'Accounting & Finance'"></span>
                <hr v-show="sidebarCollapsed" class="border-amber-800">
            </div>
            
            <a href="#" @click.prevent="accountingTab = 'dashboard'" 
               :class="accountingTab === 'dashboard' ? 'bg-amber-600 text-white shadow-lg shadow-amber-900/20' : 'text-slate-400 hover:bg-slate-800'"
               class="flex items-center gap-3 px-3 py-2.5 rounded-lg transition-all group overflow-hidden">
                <i class="fas fa-chart-line w-6 text-center text-lg"></i>
                <span v-show="!sidebarCollapsed" class="font-medium text-sm whitespace-nowrap" v-text="isArabic ? 'نظرة عامة' : 'Overview'"></span>
            </a>
            <a href="#" @click.prevent="accountingTab = 'customers'" 
               :class="accountingTab === 'customers' ? 'bg-amber-600 text-white shadow-lg shadow-amber-900/20' : 'text-slate-400 hover:bg-slate-800'"
               class="flex items-center gap-3 px-3 py-2.5 rounded-lg transition-all group overflow-hidden">
                <i class="fas fa-users w-6 text-center text-lg"></i>
                <span v-show="!sidebarCollapsed" class="font-medium text-sm whitespace-nowrap" v-text="isArabic ? 'العملاء' : 'Customers'"></span>
            </a>
            <a href="#" @click.prevent="accountingTab = 'invoices'" 
               :class="accountingTab === 'invoices' ? 'bg-amber-600 text-white shadow-lg shadow-amber-900/20' : 'text-slate-400 hover:bg-slate-800'"
               class="flex items-center gap-3 px-3 py-2.5 rounded-lg transition-all group overflow-hidden">
                <i class="fas fa-file-invoice w-6 text-center text-lg"></i>
                <span v-show="!sidebarCollapsed" class="font-medium text-sm whitespace-nowrap" v-text="isArabic ? 'الفواتير' : 'Invoices'"></span>
            </a>
            <a href="#" @click.prevent="accountingTab = 'payments'" 
               :class="accountingTab === 'payments' ? 'bg-amber-600 text-white shadow-lg shadow-amber-900/20' : 'text-slate-400 hover:bg-slate-800'"
               class="flex items-center gap-3 px-3 py-2.5 rounded-lg transition-all group overflow-hidden">
                <i class="fas fa-money-bill-wave w-6 text-center text-lg"></i>
                <span v-show="!sidebarCollapsed" class="font-medium text-sm whitespace-nowrap" v-text="isArabic ? 'المدفوعات' : 'Payments'"></span>
            </a>
        </template>

        <!-- Procurement Context -->
        <template v-else-if="['procurement_module', 'vendors_list', 'vendor_ledger'].includes(view)">
            <div class="text-[10px] font-bold text-emerald-400 uppercase tracking-widest px-3 mb-4 mt-2 overflow-hidden">
                <span v-show="!sidebarCollapsed" v-text="isArabic ? 'إدارة المشتريات' : 'Procurement'"></span>
                <hr v-show="sidebarCollapsed" class="border-emerald-800">
            </div>
            
            <a href="#" @click.prevent="view = 'procurement_module'" 
               :class="view === 'procurement_module' ? 'bg-emerald-600 text-white shadow-lg shadow-emerald-900/20' : 'text-slate-400 hover:bg-slate-800'"
               class="flex items-center gap-3 px-3 py-2.5 rounded-lg transition-all group overflow-hidden">
                <i class="fas fa-truck-loading w-6 text-center text-lg"></i>
                <span v-show="!sidebarCollapsed" class="font-medium text-sm whitespace-nowrap" v-text="isArabic ? 'أوامر الشراء' : 'Purchase Orders'"></span>
            </a>
            <a href="#" @click.prevent="view = 'vendors_list'" 
               :class="view === 'vendors_list' ? 'bg-emerald-600 text-white shadow-lg shadow-emerald-900/20' : 'text-slate-400 hover:bg-slate-800'"
               class="flex items-center gap-3 px-3 py-2.5 rounded-lg transition-all group overflow-hidden">
                <i class="fas fa-building w-6 text-center text-lg"></i>
                <span v-show="!sidebarCollapsed" class="font-medium text-sm whitespace-nowrap" v-text="isArabic ? 'سجل الموردين' : 'Vendors'"></span>
            </a>
            <a href="#" v-if="view === 'vendor_ledger'" 
               class="bg-emerald-600 text-white shadow-lg shadow-emerald-900/20 flex items-center gap-3 px-3 py-2.5 rounded-lg transition-all group overflow-hidden">
                <i class="fas fa-book w-6 text-center text-lg"></i>
                <span v-show="!sidebarCollapsed" class="font-medium text-sm whitespace-nowrap" v-text="isArabic ? 'كشف حساب مورد' : 'Vendor Ledger'"></span>
            </a>
        </template>

        <!-- Settings Context -->
        <template v-else-if="['global_config', 'org_builder', 'users'].includes(view)">
            <div class="text-[10px] font-bold text-slate-400 uppercase tracking-widest px-3 mb-4 mt-2 overflow-hidden">
                <span v-show="!sidebarCollapsed" v-text="isArabic ? 'الإعدادات والتهيئة' : 'Configuration'"></span>
                <hr v-show="sidebarCollapsed" class="border-slate-800">
            </div>
            
            <a href="#" @click.prevent="view = 'org_builder'"
               :class="view === 'org_builder' ? 'bg-slate-700 text-white' : 'text-slate-400 hover:bg-slate-800'"
               class="flex items-center gap-3 px-3 py-2.5 rounded-lg transition-all group overflow-hidden">
                <i class="fas fa-sitemap w-6 text-center text-lg"></i>
                <span v-show="!sidebarCollapsed" class="font-medium text-sm whitespace-nowrap" v-text="isArabic ? 'هيكلة المنظمة' : 'Org Builder'"></span>
             </a>

            <a href="#" @click.prevent="view = 'global_config'"
               :class="view === 'global_config' ? 'bg-slate-700 text-white' : 'text-slate-400 hover:bg-slate-800'"
               class="flex items-center gap-3 px-3 py-2.5 rounded-lg transition-all group overflow-hidden">
                <i class="fas fa-cogs w-6 text-center text-lg"></i>
                <span v-show="!sidebarCollapsed" class="font-medium text-sm whitespace-nowrap" v-text="isArabic ? 'إعدادات النظام' : 'Global Settings'"></span>
             </a>

            <a href="#" @click.prevent="view = 'users'"
               :class="view === 'users' ? 'bg-slate-700 text-white' : 'text-slate-400 hover:bg-slate-800'"
               class="flex items-center gap-3 px-3 py-2.5 rounded-lg transition-all group overflow-hidden">
                <i class="fas fa-users w-6 text-center text-lg"></i>
                <span v-show="!sidebarCollapsed" class="font-medium text-sm whitespace-nowrap" v-text="isArabic ? 'المستخدمين' : 'Users'"></span>
             </a>
        </template>

        <!-- Default Context (Dashboard or Generic) -->
        <template v-else>
            <div class="text-[10px] font-bold text-blue-400 uppercase tracking-widest px-3 mb-4 mt-2 overflow-hidden">
                <span v-show="!sidebarCollapsed" v-text="isArabic ? 'الرئيسية' : 'Main Menu'"></span>
                <hr v-show="sidebarCollapsed" class="border-blue-800">
            </div>
            
            <a href="#" @click.prevent="view = 'dashboard'" 
               :class="view === 'dashboard' ? 'bg-blue-600 text-white shadow-lg shadow-blue-900/20' : 'text-slate-400 hover:bg-slate-800'"
               class="flex items-center gap-3 px-3 py-2.5 rounded-lg transition-all group overflow-hidden">
                <i class="fas fa-chart-pie w-6 text-center text-lg"></i>
                <span v-show="!sidebarCollapsed" class="font-medium text-sm whitespace-nowrap" v-text="isArabic ? 'لوحة التحكم' : 'Dashboard'"></span>
            </a>
            
            <div class="mt-8 px-3 text-[10px] text-slate-500 text-center" v-show="!sidebarCollapsed">
                <p v-text="isArabic ? 'استخدم قائمة REDIVIO بالاعلى للتنقل' : 'Use the top REDIVIO menu to navigate'"></p>
                <i class="fas fa-arrow-up mt-4 text-xl animate-bounce text-slate-600"></i>
            </div>
        </template>
        
    </nav>

    <div class="p-4 border-t border-slate-800 bg-slate-950/50 text-white">
        <div class="flex items-center gap-3 overflow-hidden">
            <div class="w-8 h-8 rounded-full bg-blue-600 flex items-center justify-center font-bold text-xs shrink-0 shadow-lg" v-text="user.name ? user.name.charAt(0).toUpperCase() : 'U'">
            </div>
            <div v-show="!sidebarCollapsed" class="flex-1 min-w-0 animate-in fade-in">
                <p class="text-xs font-bold truncate" v-text="user.name || 'Admin'"></p>
                <a href="/logout/" class="text-[10px] text-red-400 hover:text-red-300 flex items-center gap-1">
                    <i class="fas fa-sign-out-alt"></i> <span v-text="isArabic ? 'خروج' : 'Logout'"></span>
                </a>
            </div>
        </div>
    </div>
    
    <!-- 🌍 Language Switcher -->
    <div class="px-4 py-3 border-t border-slate-800 bg-slate-900/50">
        <form action="{% url 'set_language' %}" method="post" class="w-full">
            {% csrf_token %}
            <input name="next" type="hidden" value="{{ request.get_full_path }}">
            <input name="language" type="hidden" value="{% if LANGUAGE_CODE == 'ar' %}en{% else %}ar{% endif %}">
            <button type="submit" class="w-full flex items-center gap-3 px-3 py-2 text-slate-400 hover:bg-slate-800 hover:text-white rounded-lg transition-all text-[11px] font-bold border border-slate-700/50 hover:border-blue-500/50 uppercase tracking-tighter">
                <i class="fas fa-language w-5 text-center text-lg"></i>
                <span v-show="!sidebarCollapsed" v-text="isArabic ? 'Switch to English' : 'التحويل للعربية'"></span>
            </button>
        </form>
    </div>
</aside>
