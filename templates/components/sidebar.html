<aside :class="sidebarCollapsed ? 'w-20' : 'w-64'" class="bg-slate-900 text-white flex flex-col h-full hidden md:flex shadow-xl z-20 transition-all duration-300 relative" v-cloak>
    
    <button @click="sidebarCollapsed = !sidebarCollapsed" 
            class="absolute -right-3 top-20 w-6 h-6 bg-blue-600 rounded-full flex items-center justify-center text-xs shadow-lg hover:scale-110 transition-transform cursor-pointer border-2 border-slate-900 z-50">
        <i :class="sidebarCollapsed ? 'fa-solid fa-chevron-right' : 'fa-solid fa-chevron-left'"></i>
    </button>

    <div class="h-16 flex items-center gap-3 px-4 border-b border-slate-800 bg-slate-950 overflow-visible text-white relative brand-area-container">
        <div class="flex items-center gap-3 cursor-pointer group" @click="showBrandDropdown = !showBrandDropdown">
            <img src="/static/brand/logo_r.png" class="w-8 h-8 object-contain shrink-0" alt="Redivio Logo">
            <span v-show="!sidebarCollapsed" class="text-lg font-bold tracking-wider tech-font animate-in fade-in duration-300">REDIVIO</span>
            <i v-show="!sidebarCollapsed" class="fa-solid fa-chevron-down text-[10px] text-slate-500 transition-transform" :class="{'rotate-180': showBrandDropdown}"></i>
        </div>

        <!-- 🚀 القائمة المنسدلة الجديدة (Mega Menu) -->
        <div v-if="showBrandDropdown" 
             class="absolute top-14 left-4 w-80 bg-slate-900 border border-slate-700 rounded-2xl shadow-[0_20px_50px_rgba(0,0,0,0.5)] z-[100] overflow-hidden animate-in zoom-in-95 duration-200">
            
            <div class="p-5 grid grid-cols-2 gap-6">
                <!-- العمود الأول: العمليات -->
                <div class="space-y-4">
                    <p class="text-[10px] font-black text-blue-400 uppercase tracking-widest border-b border-slate-800 pb-2 flex items-center justify-between">
                        <span>[[ isArabic ? 'العمليات' : 'Operation' ]]</span>
                        <i class="fas fa-rocket"></i>
                    </p>
                    <div class="flex flex-col gap-1">
                        <button @click="view = 'dashboard'; showBrandDropdown = false" class="text-[11px] font-bold text-slate-400 hover:text-white hover:bg-blue-600/20 p-2 rounded-lg transition-all text-left flex items-center gap-2 group/item">
                            <i class="fas fa-chart-pie w-5 text-center text-blue-500 group-hover/item:scale-110 transition-transform"></i> 
                            <span>[[ isArabic ? 'لوحة التحكم' : 'Dashboard' ]]</span>
                        </button>
                        <button @click="view = 'inventory_module'; inventoryTab = 'levels'; showBrandDropdown = false" class="text-[11px] font-bold text-slate-400 hover:text-white hover:bg-blue-600/20 p-2 rounded-lg transition-all text-left flex items-center gap-2 group/item">
                            <i class="fas fa-boxes-stacked w-5 text-center text-indigo-500 group-hover/item:scale-110 transition-transform"></i> 
                            <span>[[ isArabic ? 'المستودعات' : 'Inventory' ]]</span>
                        </button>
                        <button @click="view = 'procurement_module'; showBrandDropdown = false" class="text-[11px] font-bold text-slate-400 hover:text-white hover:bg-blue-600/20 p-2 rounded-lg transition-all text-left flex items-center gap-2 group/item">
                            <i class="fas fa-truck w-5 text-center text-emerald-500 group-hover/item:scale-110 transition-transform"></i> 
                            <span>[[ isArabic ? 'المشتريات' : 'Procure' ]]</span>
                        </button>
                        <button @click="view = 'sales_module'; showBrandDropdown = false" class="text-[11px] font-bold text-slate-400 hover:text-white hover:bg-blue-600/20 p-2 rounded-lg transition-all text-left flex items-center gap-2 group/item">
                            <i class="fas fa-cart-shopping w-5 text-center text-rose-500 group-hover/item:scale-110 transition-transform"></i> 
                            <span>[[ isArabic ? 'المبيعات' : 'Sales' ]]</span>
                        </button>
                        <button @click="view = 'accounting_module'; showBrandDropdown = false" class="text-[11px] font-bold text-slate-400 hover:text-white hover:bg-blue-600/20 p-2 rounded-lg transition-all text-left flex items-center gap-2 group/item">
                            <i class="fas fa-file-invoice-dollar w-5 text-center text-amber-500 group-hover/item:scale-110 transition-transform"></i> 
                            <span>[[ isArabic ? 'المحاسبة' : 'Accounts' ]]</span>
                        </button>
                    </div>
                </div>

                <!-- العمود الثاني: الإعدادات -->
                <div class="space-y-4 border-l border-slate-800 pl-4">
                    <p class="text-[10px] font-black text-slate-500 uppercase tracking-widest border-b border-slate-800 pb-2 flex items-center justify-between">
                        <span>[[ isArabic ? 'الإعدادات' : 'Settings' ]]</span>
                        <i class="fas fa-sliders"></i>
                    </p>
                    <div class="flex flex-col gap-1">
                        <button @click="view = 'org_builder'; showBrandDropdown = false" class="text-[11px] font-bold text-slate-400 hover:text-white hover:bg-slate-800 p-2 rounded-lg transition-all text-left flex items-center gap-2 group/item">
                            <i class="fas fa-sitemap w-5 text-center text-blue-400"></i> 
                            <span>[[ isArabic ? 'بناء الهيكل' : 'Org Build' ]]</span>
                        </button>
                        <button @click="view = 'global_config'; showBrandDropdown = false" class="text-[11px] font-bold text-slate-400 hover:text-white hover:bg-slate-800 p-2 rounded-lg transition-all text-left flex items-center gap-2 group/item">
                            <i class="fas fa-cogs w-5 text-center text-slate-500"></i> 
                            <span>[[ isArabic ? 'إعدادات النظام' : 'System' ]]</span>
                        </button>
                        <button @click="view = 'users'; showBrandDropdown = false" class="text-[11px] font-bold text-slate-400 hover:text-white hover:bg-slate-800 p-2 rounded-lg transition-all text-left flex items-center gap-2 group/item">
                            <i class="fas fa-users w-5 text-center text-slate-500"></i> 
                            <span>[[ isArabic ? 'المستخدمين' : 'Users' ]]</span>
                        </button>
                    </div>
                </div>
            </div>
            
            <div class="bg-black/50 p-2 border-t border-slate-800 text-center">
                <span class="text-[8px] text-slate-600 font-bold uppercase tracking-[0.2em]">Enterprise Core Suite</span>
            </div>
        </div>
    </div>

    <nav class="flex-1 overflow-y-auto py-6 px-3 space-y-1">
        
        <div class="text-[10px] font-bold text-slate-500 uppercase tracking-widest px-3 mb-2 overflow-hidden">
            <span v-show="!sidebarCollapsed" v-text="isArabic ? 'العمليات والتحليل' : 'Operations & Analytics'"></span>
            <hr v-show="sidebarCollapsed" class="border-slate-800">
        </div>

        <div class="space-y-1">
            <a href="#" @click.prevent="view = 'dashboard'" 
               :class="view === 'dashboard' ? 'bg-blue-600 text-white shadow-lg' : 'text-slate-400 hover:bg-slate-800'"
               class="flex items-center gap-3 px-3 py-2.5 rounded-lg transition-all group overflow-hidden">
                <i class="fas fa-chart-pie w-6 text-center text-lg"></i>
                <span v-show="!sidebarCollapsed" class="font-medium text-sm whitespace-nowrap" v-text="isArabic ? 'لوحة التحكم' : 'Dashboard'"></span>
            </a>

            <a href="#" @click.prevent="view = 'inventory_module'; inventoryTab = 'levels'; getListData()" 
               :class="view === 'inventory_module' ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-900/20' : 'text-slate-400 hover:bg-slate-800'"
               class="flex items-center gap-3 px-3 py-2.5 rounded-lg transition-all group overflow-hidden border-l-4 border-transparent"
               :class="{'border-indigo-400': view === 'inventory_module'}">
                <i class="fas fa-boxes-stacked w-6 text-center text-lg"></i>
                <span v-show="!sidebarCollapsed" class="font-medium text-sm whitespace-nowrap" v-text="isArabic ? 'إدارة المستودعات' : 'Inventory Module'"></span>
            </a>

            <a href="#" @click.prevent="view = 'procurement_module'" 
               :class="view === 'procurement_module' ? 'bg-emerald-600 text-white shadow-lg shadow-emerald-900/20' : 'text-slate-400 hover:bg-slate-800'"
               class="flex items-center gap-3 px-3 py-2.5 rounded-lg transition-all group overflow-hidden border-l-4 border-transparent"
               :class="{'border-emerald-400': view === 'procurement_module'}">
                <i class="fas fa-file-invoice-dollar w-6 text-center text-lg"></i>
                <span v-show="!sidebarCollapsed" class="font-medium text-sm whitespace-nowrap" v-text="isArabic ? 'إدارة المشتريات' : 'Procurement'"></span>
            </a>

            <a href="#" @click.prevent="view = 'sales_module'; salesTab = 'dashboard'; fetchSalesData()" 
               :class="view === 'sales_module' ? 'bg-rose-600 text-white shadow-lg shadow-rose-900/20' : 'text-slate-400 hover:bg-slate-800'"
               class="flex items-center gap-3 px-3 py-2.5 rounded-lg transition-all group overflow-hidden border-l-4 border-transparent"
               :class="{'border-rose-400': view === 'sales_module'}">
                <i class="fas fa-cart-shopping w-6 text-center text-lg"></i>
                <span v-show="!sidebarCollapsed" class="font-medium text-sm whitespace-nowrap" v-text="isArabic ? 'إدارة المبيعات' : 'Sales & Orders'"></span>
            </a>

            <a href="#" @click.prevent="view = 'accounting_module'; accountingTab = 'dashboard'; fetchSalesData()" 
               :class="view === 'accounting_module' ? 'bg-amber-600 text-white shadow-lg shadow-amber-900/20' : 'text-slate-400 hover:bg-slate-800'"
               class="flex items-center gap-3 px-3 py-2.5 rounded-lg transition-all group overflow-hidden border-l-4 border-transparent"
               :class="{'border-amber-400': view === 'accounting_module'}">
                <i class="fas fa-file-invoice-dollar w-6 text-center text-lg"></i>
                <span v-show="!sidebarCollapsed" class="font-medium text-sm whitespace-nowrap" v-text="isArabic ? 'المحاسبة والمالية' : 'Accounting'"></span>
            </a>
        </div>

        <div class="text-[10px] font-bold text-slate-500 uppercase tracking-widest px-3 mt-8 mb-2 overflow-hidden">
            <span v-show="!sidebarCollapsed" v-text="isArabic ? 'الإعدادات والتهيئة' : 'Configuration'"></span>
            <hr v-show="sidebarCollapsed" class="border-slate-800">
        </div>

        <div class="space-y-1">
            <a href="#" @click.prevent="view = 'org_builder'"
               :class="view === 'org_builder' ? 'bg-blue-600 text-white' : 'text-slate-400 hover:bg-slate-800'"
               class="flex items-center gap-3 px-3 py-2.5 rounded-lg transition-all group overflow-hidden">
                <i class="fas fa-sitemap w-6 text-center text-lg"></i>
                <span v-show="!sidebarCollapsed" class="font-medium text-sm whitespace-nowrap" v-text="isArabic ? 'هيكلة المنظمة' : 'Org Builder'"></span>
            </a>

            <a href="#" @click.prevent="view = 'global_config'"
               :class="view === 'global_config' ? 'bg-blue-600 text-white' : 'text-slate-400 hover:bg-slate-800'"
               class="flex items-center gap-3 px-3 py-2.5 rounded-lg transition-all group overflow-hidden">
                <i class="fas fa-cogs w-6 text-center text-lg"></i>
                <span v-show="!sidebarCollapsed" class="font-medium text-sm whitespace-nowrap" v-text="isArabic ? 'إعدادات النظام' : 'Global Settings'"></span>
            </a>

            <a href="#" @click.prevent="view = 'users'"
               :class="view === 'users' ? 'bg-blue-600 text-white' : 'text-slate-400 hover:bg-slate-800'"
               class="flex items-center gap-3 px-3 py-2.5 rounded-lg transition-all group overflow-hidden">
                <i class="fas fa-users w-6 text-center text-lg"></i>
                <span v-show="!sidebarCollapsed" class="font-medium text-sm whitespace-nowrap" v-text="isArabic ? 'المستخدمين' : 'Users'"></span>
            </a>
        </div>
    </nav>

    <div class="p-4 border-t border-slate-800 bg-slate-950/50 text-white">
        <div class="flex items-center gap-3 overflow-hidden">
            <div class="w-8 h-8 rounded-full bg-blue-600 flex items-center justify-center font-bold text-xs shrink-0 shadow-lg" v-text="user.name ? user.name.charAt(0).toUpperCase() : 'U'">
            </div>
            <div v-show="!sidebarCollapsed" class="flex-1 min-w-0 animate-in fade-in">
                <p class="text-xs font-bold truncate" v-text="user.name || 'Admin'"></p>
                <a href="/logout/" class="text-[10px] text-red-400 hover:text-red-300 flex items-center gap-1">
                    <i class="fas fa-sign-out-alt"></i> <span v-text="isArabic ? 'خروج' : 'Logout'"></span>
                </a>
            </div>
        </div>
    </div>
    
    <!-- 🌍 Language Switcher -->
    <div class="px-4 py-3 border-t border-slate-800 bg-slate-900/50">
        <form action="{% url 'set_language' %}" method="post" class="w-full">
            {% csrf_token %}
            <input name="next" type="hidden" value="{{ request.get_full_path }}">
            <input name="language" type="hidden" value="{% if LANGUAGE_CODE == 'ar' %}en{% else %}ar{% endif %}">
            <button type="submit" class="w-full flex items-center gap-3 px-3 py-2 text-slate-400 hover:bg-slate-800 hover:text-white rounded-lg transition-all text-[11px] font-bold border border-slate-700/50 hover:border-blue-500/50 uppercase tracking-tighter">
                <i class="fas fa-language w-5 text-center text-lg"></i>
                <span v-show="!sidebarCollapsed" v-text="isArabic ? 'Switch to English' : 'التحويل للعربية'"></span>
            </button>
        </form>
    </div>
</aside>
