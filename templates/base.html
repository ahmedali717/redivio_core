{% load static %}
<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE }}" dir="{% if LANGUAGE_CODE|slice:':2' == 'ar' %}rtl{% else %}ltr{% endif %}">
<script>window.is_arabic = {% if LANGUAGE_CODE|slice:':2' == 'ar' %}true{% else %}false{% endif %};</script>
<head>
    <meta charset="UTF-8">
    <title>REDIVIO ERP - {% block title %}Dashboard{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    
    <script src="https://unpkg.com/html5-qrcode"></script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            DEFAULT: '#2c82f0',
                            hover: '#1e73e1',
                            dark: '#1660c1',
                            light: '#5d9ef5'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { background: #f8fafc; overflow: hidden; font-family: 'Plus Jakarta Sans', sans-serif; }
        [v-cloak] { display: none !important; }
        .glass-sidebar { background: #0f172a; color: white; }

        /* Hide scrollbars globally */
        ::-webkit-scrollbar {
            display: none !important;
            width: 0 !important;
            height: 0 !important;
        }
        * {
            scrollbar-width: none !important; /* Firefox */
            -ms-overflow-style: none !important;  /* IE and Edge */
        }

        /* Premium Sidebar Custom CSS */
        @keyframes float-orb-1 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(15px, -25px) scale(1.1); }
        }
        @keyframes float-orb-2 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(-20px, 20px) scale(1.15); }
        }
        .sidebar-premium-container {
            position: relative;
            background: linear-gradient(165deg, #0e172a 0%, #030712 100%) !important;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6), inset 0 1px 1px rgba(255, 255, 255, 0.05);
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            border: 1px solid rgba(255, 255, 255, 0.06) !important;
            backdrop-filter: blur(20px);
        }

        /* Ambient glow effects */
        .sidebar-premium-container::before {
            content: '';
            position: absolute;
            top: -10%;
            right: -25%;
            width: 250px;
            height: 250px;
            background: radial-gradient(circle, rgba(44, 130, 240, 0.22) 0%, transparent 70%);
            filter: blur(45px);
            pointer-events: none;
            z-index: 0;
            animation: float-orb-1 12s ease-in-out infinite alternate;
        }

        .sidebar-premium-container::after {
            content: '';
            position: absolute;
            bottom: 5%;
            left: -25%;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.15) 0%, transparent 70%);
            filter: blur(55px);
            pointer-events: none;
            z-index: 0;
            animation: float-orb-2 15s ease-in-out infinite alternate-reverse;
        }

        /* Hover & active styling for premium items */
        .sidebar-item-premium {
            position: relative;
            z-index: 2;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            border: 1px solid transparent !important;
        }

        .sidebar-item-premium.inactive:hover {
            background: rgba(255, 255, 255, 0.04) !important;
            border-color: rgba(255, 255, 255, 0.06) !important;
            color: #ffffff !important;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        /* Slide item micro-animations */
        html[dir="ltr"] .sidebar-item-premium.inactive:hover {
            transform: translateX(4px);
        }
        html[dir="rtl"] .sidebar-item-premium.inactive:hover {
            transform: translateX(-4px);
        }

        /* Active State */
        .sidebar-item-premium.active {
            color: #3b82f6 !important;
            font-weight: 700 !important;
            border: 1px solid rgba(59, 130, 246, 0.3) !important;
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.05), 
                        0 8px 25px rgba(59, 130, 246, 0.15),
                        0 0 2px rgba(59, 130, 246, 0.2) !important;
            text-shadow: 0 0 15px rgba(59, 130, 246, 0.3);
            transform: translateY(-1px);
        }
        html[dir="ltr"] .sidebar-item-premium.active {
            background: linear-gradient(90deg, rgba(44, 130, 240, 0.16) 0%, rgba(99, 102, 241, 0.03) 100%) !important;
            padding-left: 1.25rem !important;
        }
        html[dir="rtl"] .sidebar-item-premium.active {
            background: linear-gradient(270deg, rgba(44, 130, 240, 0.16) 0%, rgba(99, 102, 241, 0.03) 100%) !important;
            padding-right: 1.25rem !important;
        }

        .sidebar-item-premium.active::before {
            content: '';
            position: absolute;
            top: 25%;
            bottom: 25%;
            width: 4px;
            background: linear-gradient(to bottom, #3b82f6, #6366f1);
            border-radius: 4px;
            box-shadow: 0 0 12px #3b82f6, 0 0 4px rgba(59, 130, 246, 0.8);
            transition: all 0.3s ease;
        }

        html[dir="ltr"] .sidebar-item-premium.active::before {
            left: 8px;
        }
        html[dir="rtl"] .sidebar-item-premium.active::before {
            right: 8px;
        }

        .sidebar-item-premium.active i {
            color: #3b82f6 !important;
            filter: drop-shadow(0 0 8px rgba(59, 130, 246, 0.6));
        }
        .sidebar-item-premium.active img {
            filter: drop-shadow(0 0 8px rgba(59, 130, 246, 0.8)) brightness(1.2);
        }

        /* Icon & text transitions inside items */
        .sidebar-item-premium i, .sidebar-item-premium img {
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .sidebar-item-premium:hover i, .sidebar-item-premium:hover img {
            transform: scale(1.15) rotate(5deg);
        }

        /* Collapse/Expand styling improvements */
        .sidebar-premium-container.w-20 {
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        /* Brand area logo anim */
        .brand-area-container {
            border-bottom: 1px solid rgba(255, 255, 255, 0.08) !important;
            background: rgba(255, 255, 255, 0.02) !important;
        }
        .brand-area-container .group:hover img {
            transform: scale(1.08) rotate(-8deg);
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* Custom styles for language switcher button */
        .lang-btn-premium {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.3s ease;
        }
        .lang-btn-premium:hover {
            background: rgba(255, 255, 255, 0.08) !important;
            border-color: rgba(44, 130, 240, 0.4) !important;
            color: #ffffff !important;
            box-shadow: 0 0 12px rgba(44, 130, 240, 0.25);
        }

        /* Plan details popover animations & styles */
        .plan-popover-premium {
            transform-origin: bottom center;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            background: rgba(15, 23, 42, 0.95) !important;
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08) !important;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.05) !important;
        }

        /* Plan Widget Card Styles */
        .plan-card-premium {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.12) 0%, rgba(168, 85, 247, 0.06) 100%) !important;
            border: 1px solid rgba(255, 255, 255, 0.07) !important;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3), 
                        inset 0 1px 1px rgba(255, 255, 255, 0.05);
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .plan-card-premium::before {
            content: '';
            position: absolute;
            top: 0;
            left: -150%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.12), transparent);
            transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .plan-card-premium:hover {
            transform: translateY(-3px) scale(1.02);
            border-color: rgba(255, 255, 255, 0.18) !important;
            box-shadow: 0 15px 35px rgba(99, 102, 241, 0.2), 
                        inset 0 1px 1px rgba(255, 255, 255, 0.1) !important;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.2) 0%, rgba(168, 85, 247, 0.12) 100%) !important;
        }
        .plan-card-premium:hover::before {
            left: 150%;
        }

        /* Translucent collapse button */
        .sidebar-toggle-btn {
            background: rgba(15, 23, 42, 0.85) !important;
            border: 1px solid rgba(255, 255, 255, 0.15) !important;
            color: #ffffff !important;
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.25);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .sidebar-toggle-btn:hover {
            transform: scale(1.15);
            background: #2c82f0 !important;
            border-color: #5d9ef5 !important;
            box-shadow: 0 0 15px rgba(44, 130, 240, 0.5);
        }

        /* Premium Brand Dropdown popup styles */
        .brand-dropdown-premium {
            background: rgba(15, 23, 42, 0.95) !important;
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            color: #f1f5f9 !important;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.05) !important;
        }
        .brand-dropdown-premium button {
            color: #cbd5e1 !important;
            transition: all 0.25s ease;
        }
        .brand-dropdown-premium button:hover {
            background: rgba(255, 255, 255, 0.05) !important;
            color: #3b82f6 !important;
        }


        .ready-fade-enter-active, .ready-fade-leave-active { transition: all 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55); }
        .ready-fade-enter-from, .ready-fade-leave-to { opacity: 0; transform: translate(-50%, 40px) scale(0.9); }

        /* Premium Preloader Styles */
        #global-preloader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #0f172a;
            z-index: 999999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s ease, visibility 0.5s ease;
            opacity: 1;
            visibility: visible;
        }
        
        #global-preloader.fade-out {
            opacity: 0;
            visibility: hidden;
        }

        .preloader-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 2.5rem;
            padding: 3rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 40px rgba(59, 130, 246, 0.1);
            max-width: 320px;
            width: 90%;
            text-align: center;
        }

        .preloader-logo-wrapper {
            position: relative;
            width: 8rem;
            height: 8rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 2.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3), 0 0 30px rgba(59, 130, 246, 0.15);
            animation: logo-breath 3s ease-in-out infinite;
        }

        .preloader-logo-glow {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.2) 0%, transparent 70%);
            z-index: 1;
        }

        .preloader-logo {
            width: 65%;
            height: 65%;
            object-fit: contain;
            z-index: 2;
        }

        @keyframes logo-breath {
            0%, 100% { transform: scale(1); box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3), 0 0 30px rgba(59, 130, 246, 0.15); }
            50% { transform: scale(1.05); box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3), 0 0 50px rgba(59, 130, 246, 0.25); }
        }
    </style>
</head>
<body class="h-screen flex flex-col text-slate-800">

    <!-- Global Premium Preloader -->
    <div id="global-preloader">
        <div class="preloader-logo-wrapper">
            <div class="preloader-logo-glow"></div>
            <img src="{% static 'brand/logo_r.png' %}" class="preloader-logo" alt="REDIVIO Logo">
        </div>
    </div>


    <div id="app" class="flex-1 flex h-full" v-cloak>
        {% block content %}{% endblock %}
    </div>

    {% block scripts %}{% endblock %}

    {% include "components/ai_chat.html" %}
</body>
</html>
