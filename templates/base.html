{% load static %}
<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE }}" dir="{% if LANGUAGE_CODE|slice:':2' == 'ar' %}rtl{% else %}ltr{% endif %}">
<script>window.is_arabic = {% if LANGUAGE_CODE|slice:':2' == 'ar' %}true{% else %}false{% endif %};</script>
<head>
    <meta charset="UTF-8">
    <title>REDIVIO ERP - {% block title %}Dashboard{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    
    <script src="https://unpkg.com/html5-qrcode"></script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            DEFAULT: '#2c82f0',
                            hover: '#1e73e1',
                            dark: '#1660c1',
                            light: '#5d9ef5'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { background: #f8fafc; overflow: hidden; font-family: 'Plus Jakarta Sans', sans-serif; }
        [v-cloak] { display: none !important; }
        .glass-sidebar { background: #0f172a; color: white; }

        .ready-fade-enter-active, .ready-fade-leave-active { transition: all 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55); }
        .ready-fade-enter-from, .ready-fade-leave-to { opacity: 0; transform: translate(-50%, 40px) scale(0.9); }

        /* Premium Preloader Styles */
        #global-preloader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #0f172a;
            z-index: 999999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s ease, visibility 0.5s ease;
            opacity: 1;
            visibility: visible;
        }
        
        #global-preloader.fade-out {
            opacity: 0;
            visibility: hidden;
        }

        .preloader-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 2.5rem;
            padding: 3rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 40px rgba(59, 130, 246, 0.1);
            max-width: 320px;
            width: 90%;
            text-align: center;
        }

        .preloader-logo-wrapper {
            position: relative;
            width: 8rem;
            height: 8rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 2.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3), 0 0 30px rgba(59, 130, 246, 0.15);
            animation: logo-breath 3s ease-in-out infinite;
        }

        .preloader-logo-glow {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.2) 0%, transparent 70%);
            z-index: 1;
        }

        .preloader-logo {
            width: 65%;
            height: 65%;
            object-fit: contain;
            z-index: 2;
        }

        @keyframes logo-breath {
            0%, 100% { transform: scale(1); box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3), 0 0 30px rgba(59, 130, 246, 0.15); }
            50% { transform: scale(1.05); box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3), 0 0 50px rgba(59, 130, 246, 0.25); }
        }
    </style>
</head>
<body class="h-screen flex flex-col text-slate-800">

    <!-- Global Premium Preloader -->
    <div id="global-preloader">
        <div class="preloader-logo-wrapper">
            <div class="preloader-logo-glow"></div>
            <img src="{% static 'brand/logo_r.png' %}" class="preloader-logo" alt="REDIVIO Logo">
        </div>
    </div>


    <div id="app" class="flex-1 flex h-full" v-cloak>
        {% block content %}{% endblock %}
    </div>

    {% block scripts %}{% endblock %}

    {% include "components/ai_chat.html" %}
</body>
</html>
