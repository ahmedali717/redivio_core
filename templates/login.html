{% extends "auth_base.html" %}

{% block content %}
<div class="w-full max-w-md relative z-10" x-data="loginAuth()">
    <div class="bg-white p-8 rounded-[2rem] shadow-[0_20px_50px_rgba(0,0,0,0.1)]">
        
        <div class="text-center mb-8">
            <h2 class="text-3xl font-black text-slate-800 mb-2 tech-font tracking-tight drop-shadow-sm">Welcome Back</h2>
            <p class="text-slate-500 font-medium text-sm">Access your REDIVIO workspace</p>
        </div>

        <form @submit.prevent="login">
            <div class="space-y-4 mb-6">
                <div>
                    <label class="text-xs text-slate-500 font-medium block mb-1">Email Address</label>
                    <input type="email" x-model="email" class="input-field" placeholder="admin@company.com" required>
                </div>
                <div>
                    <label class="text-xs text-slate-500 font-medium block mb-1">Password</label>
                    <input type="password" x-model="password" class="input-field" placeholder="••••••••" required>
                </div>
            </div>

            <div x-show="error" class="mb-4 p-3 bg-red-50 border border-red-100 rounded-xl text-red-600 font-medium text-xs text-center" x-text="error" style="display: none;"></div>

            <button type="submit" :disabled="loading" class="w-full bg-brand hover:bg-brand-hover text-white font-bold py-3.5 rounded-xl shadow-[0_8px_20px_rgba(44,130,240,0.3)] transition-all flex items-center justify-center gap-2 transform hover:-translate-y-0.5 hover:shadow-[0_12px_25px_rgba(44,130,240,0.4)] disabled:opacity-50 disabled:transform-none">
                <span x-show="!loading" class="tracking-widest uppercase">LOG IN</span>
                <span x-show="loading" class="tracking-widest uppercase"><i class="fas fa-circle-notch fa-spin text-lg"></i> AUTHENTICATING...</span>
            </button>
        </form>

        <div class="mt-6 text-center pt-6 border-t border-slate-100">
            <a href="{% url 'landing_page' %}" class="text-xs font-medium text-slate-500 hover:text-brand transition-colors">Don't have an account? <span class="text-brand font-bold">Initialize Workspace</span></a>
        </div>
    </div>
</div>

<script>
    function loginAuth() {
        return {
            email: '',
            password: '',
            loading: false,
            error: null,
            async login() {
                this.loading = true;
                this.error = null;
                try {
                    const response = await fetch('/api/login/', {
                        method: 'POST',
                        headers: { 
                            'Content-Type': 'application/json', 
                            'X-CSRFToken': '{{ csrf_token }}' 
                        },
                        // تأكد أن السيرفر يتوقع مفتاح "email" وليس "username"
                        body: JSON.stringify({ 
                            email: this.email, 
                            password: this.password 
                        })
                    });
                    
                    const data = await response.json();
                    
                    if (response.ok) {
                        // النجاح: التوجه للداشبورد مباشرة
                        window.location.href = data.redirect_url || '/dashboard/';
                    } else {
                        // الفشل: عرض رسالة الخطأ من السيرفر
                        this.error = data.error || 'Invalid email or password';
                    }
                } catch (err) {
                    this.error = 'Server connection failed.';
                } finally {
                    this.loading = false;
                }
            }
        }
    }
</script>
{% endblock %}
