{% extends "auth_base.html" %}
{% load static %}

{% block content %}
<style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;700&display=swap');
    
    /* إجبار الخلفية على الظهور ومنع أي تداخل */
    body { 
        background-image: radial-gradient(circle at 50% 50%, #0c1e45 0%, #040914 100%) !important; 
        margin: 0;
        padding: 0;
        overflow: hidden;
        font-family: 'Montserrat', sans-serif;
    }

    /* طبقة الشبكة الثابتة والمتحركة */
    .grid-container {
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background-image: 
            linear-gradient(rgba(59, 130, 246, 0.04) 1px, transparent 1px),
            linear-gradient(90deg, rgba(59, 130, 246, 0.04) 1px, transparent 1px);
        background-size: 50px 50px;
        z-index: -1;
    }

    /* بقعة الضوء التي تتبع الماوس */
    .cursor-glow {
        position: fixed;
        width: 800px; height: 800px;
        background: radial-gradient(circle, rgba(59, 130, 246, 0.12) 0%, transparent 70%);
        border-radius: 50%;
        pointer-events: none;
        z-index: 0;
        transform: translate(-50%, -50%);
    }

    /* تصميم اللوحة الزجاجية - النسخة المظلمة العميقة */
    .glass-card {
        background: rgba(15, 23, 42, 0.65);
        backdrop-filter: blur(25px);
        border: 1px solid rgba(59, 130, 246, 0.2);
        border-radius: 30px;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 30px rgba(59, 130, 246, 0.03);
    }


    /* تصميم الأزرار الرمادية بنظام أزرق مدمج */
    .btn-custom {
        background: rgba(15, 23, 42, 0.75);
        border: 1px solid rgba(59, 130, 246, 0.18);
        color: #cbd5e1;
        transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        cursor: pointer;
        display: block;
        width: 100%;
        text-decoration: none;
    }

    /* تأثير اللمعان عند التفعيل أو الماوس */
    .btn-custom:hover, .btn-active {
        background: rgba(59, 130, 246, 0.25) !important;
        color: #ffffff !important;
        border-color: rgba(59, 130, 246, 0.4) !important;
        transform: translateY(-2px);
        box-shadow: 0 15px 30px rgba(59, 130, 246, 0.15);
    }
</style>

<div class="grid-container" id="main-grid"></div>
<div class="cursor-glow" id="mouse-glow"></div>

<div class="relative min-h-screen w-full flex items-center justify-center p-6 z-10" 
     x-data="{ view: 'menu', activeTab: 'none', ...entryPortal() }">
    
    <div class="w-full max-w-6xl flex flex-col lg:flex-row items-center gap-16">
        
        <div class="lg:w-1/2">
            <div class="flex items-center gap-4 mb-12">
                <img src="{% static 'brand/logo_r.png' %}" class="w-14 h-14 object-contain animate-pulse">
                <h2 class="text-white font-bold tracking-[0.3em] text-2xl">REDIVIO <span class="text-blue-500 font-light">ERP</span></h2>
            </div>
            <h1 class="text-7xl font-bold text-white mb-8 leading-[1.1]">
                Ease Your <br><span class="text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-blue-600">Business Control</span>
            </h1>
            <p class="text-slate-400 text-xl max-w-md font-light">
                Professional ecosystem for <span class="text-blue-400">Inventory</span> and <span class="text-blue-400 font-medium">Financial analysis</span>.
            </p>
        </div>

        <div class="lg:w-1/2 w-full max-w-md">
            <div class="glass-card p-12 h-[550px] flex flex-col justify-center relative overflow-hidden">
                
                <div x-show="view === 'menu'" x-transition.duration.500ms class="space-y-6">
                    <p class="text-center text-blue-500 text-xs tracking-[0.4em] uppercase mb-12">Select Access Path</p>
                    
                    <a href="{% url 'signup_page' %}" 
                       class="btn-custom p-8 rounded-3xl group relative overflow-hidden">
                        <div class="relative z-10">
                            <h3 class="text-xl font-bold mb-1 text-white">Start Your Journey</h3>
                            <p class="text-sm text-slate-400">Create a new workspace.</p>
                        </div>
                        <i class="fas fa-rocket absolute right-8 top-1/2 -translate-y-1/2 text-3xl text-blue-500 opacity-20 group-hover:opacity-60 transition-all"></i>
                    </a>

                    <button @click="view = 'login'" 
                            class="btn-custom p-8 rounded-3xl text-left group relative overflow-hidden">
                        <div class="relative z-10">
                            <h3 class="text-xl font-bold mb-1 text-white">Continue Enjoying</h3>
                            <p class="text-sm text-slate-400">Access your dashboard.</p>
                        </div>
                        <i class="fas fa-user-astronaut absolute right-8 top-1/2 -translate-y-1/2 text-3xl text-blue-500 opacity-20 group-hover:opacity-60 transition-all"></i>
                    </button>
                </div>

                <div x-show="view === 'login'" x-transition.duration.500ms style="display: none;">
                    <button @click="view = 'menu'" class="text-blue-500 hover:text-blue-400 mb-10 text-xs uppercase tracking-widest transition-colors font-semibold">
                        ← Back to Path Selection
                    </button>
                    <form @submit.prevent="login" class="space-y-6">
                        <h2 class="text-3xl font-bold text-white mb-8 tracking-tighter">System Access</h2>
                        <input type="email" x-model="loginData.email" placeholder="WORK EMAIL" required
                               class="w-full bg-slate-950/50 border border-slate-800 p-5 rounded-2xl text-white focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none transition-all">
                        <input type="password" x-model="loginData.password" placeholder="PASSWORD" required
                               class="w-full bg-slate-950/50 border border-slate-800 p-5 rounded-2xl text-white focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none transition-all">
                        <button type="submit" class="w-full bg-blue-600 text-white font-bold p-5 rounded-2xl hover:bg-blue-500 transition-all uppercase tracking-[0.2em] text-xs shadow-lg shadow-blue-500/20">
                            Verify Credentials
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // كود تحريك الخلفية والإضاءة (لا نغيره)
    const glow = document.getElementById('mouse-glow');
    const grid = document.getElementById('main-grid');

    document.addEventListener('mousemove', (e) => {
        glow.style.left = e.clientX + 'px';
        glow.style.top = e.clientY + 'px';
        const x = (window.innerWidth / 2 - e.pageX) / 40;
        const y = (window.innerHeight / 2 - e.pageY) / 40;
        grid.style.transform = `translate(${x}px, ${y}px)`;
    });

    // --- التعديل الجوهري هنا ---
    function entryPortal() {
        return {
            loginData: { email: '', password: '' },
            loading: false,
            error: null,
            async login() {
                this.loading = true;
                this.error = null;

                try {
                    const response = await fetch('/api/login/', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            // نستخدم التوكن من Django لحماية الطلب
                            'X-CSRFToken': '{{ csrf_token }}'
                        },
                        body: JSON.stringify({
                            email: this.loginData.email,
                            password: this.loginData.password
                        })
                    });

                    const data = await response.json();

                    if (response.ok) {
                        // في حال النجاح، التوجه للداشبورد
                        // الميدل وير سيقوم بتحديد الشركة (OpCo) تلقائياً
                        window.location.href = data.redirect_url || '/dashboard/';
                    } else {
                        // إظهار الخطأ إذا كانت البيانات غير صحيحة
                        alert(data.error || 'Invalid credentials');
                    }
                } catch (err) {
                    console.error('Login Error:', err);
                    alert('Server connection failed. Make sure the server is running.');
                } finally {
                    this.loading = false;
                }
            }
        }
    }
</script>
{% endblock %}
