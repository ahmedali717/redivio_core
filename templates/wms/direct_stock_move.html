<!-- ================================================================ -->
<!-- شاشة الحركة المباشرة - Stand Alone Mode                         -->
<!-- تصميم احترافي Glassmorphism                                      -->
<!-- ================================================================ -->
<div class="absolute inset-0 flex flex-col overflow-hidden bg-white/40 backdrop-blur-3xl rounded-[2rem] border border-white/60 shadow-2xl shadow-slate-200/50">

    <!-- Header -->
    <div class="flex items-center justify-between px-8 py-6 border-b border-slate-200/60 shrink-0 bg-white/20">
        <div>
            <h2 class="text-xl font-black text-slate-900 tracking-tight flex items-center gap-3">
                <div class="w-10 h-10 rounded-2xl bg-emerald-500 flex items-center justify-center shadow-lg shadow-emerald-200">
                    <i class="fas fa-exchange-alt text-white"></i>
                </div>
                <span v-text="isArabic ? 'الحركات المخزنية' : 'Stock Moves'"></span>
            </h2>
            <p class="text-xs text-slate-500 mt-1 font-medium px-13"
               v-text="isArabic ? 'إدارة الإضافة والصرف اليدوي' : 'Manual stock receipts and issues'"></p>
        </div>
        
        <div class="flex items-center gap-3">
            <!-- Grouping Options -->
            <div class="flex bg-slate-100/80 p-1 rounded-xl border border-slate-200/40">
                <button @click="forms.stock_entry.groupBy = 'none'"
                        :class="forms.stock_entry.groupBy === 'none' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500 hover:text-slate-700'"
                        class="px-3 py-1.5 rounded-lg text-[10px] font-black transition-all">
                    <span v-text="isArabic ? 'الكل' : 'All'"></span>
                </button>
                <button @click="forms.stock_entry.groupBy = 'material'"
                        :class="forms.stock_entry.groupBy === 'material' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500 hover:text-slate-700'"
                        class="px-3 py-1.5 rounded-lg text-[10px] font-black transition-all">
                    <span v-text="isArabic ? 'بالصنف' : 'By Item'"></span>
                </button>
                <button @click="forms.stock_entry.groupBy = 'contact'"
                        :class="forms.stock_entry.groupBy === 'contact' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500 hover:text-slate-700'"
                        class="px-3 py-1.5 rounded-lg text-[10px] font-black transition-all">
                    <span v-text="isArabic ? 'بالمورد' : 'By Contact'"></span>
                </button>
            </div>

            <button @click="openModal('stock_entry')"
                    class="flex items-center gap-2 bg-slate-900 hover:bg-slate-800 text-white text-xs font-black px-6 py-3 rounded-2xl transition-all shadow-xl shadow-slate-900/20 active:scale-95">
                <i class="fas fa-plus"></i>
                <span v-text="isArabic ? 'حركة جديدة' : 'New Move'"></span>
            </button>
        </div>
    </div>

    <!-- Stats Row (Filterable) -->
    <div class="grid grid-cols-3 gap-4 px-8 py-5 shrink-0 bg-slate-50/30">
        <div @click="forms.stock_entry.filterType = 'IN'"
             :class="forms.stock_entry.filterType === 'IN' ? 'ring-2 ring-emerald-500 ring-offset-2 bg-emerald-50' : 'bg-white hover:bg-emerald-50/50'"
             class="border border-slate-200/60 rounded-3xl p-4 text-center transition-all cursor-pointer shadow-sm group">
            <p class="text-emerald-600 font-black text-2xl group-hover:scale-110 transition-transform"
               v-text="inventoryMoves.filter(m => m.move_type === 'IN').length"></p>
            <p class="text-[10px] text-slate-500 uppercase font-black tracking-widest mt-1"
               v-text="isArabic ? 'إضافات' : 'Receipts'"></p>
        </div>
        <div @click="forms.stock_entry.filterType = 'OUT'"
             :class="forms.stock_entry.filterType === 'OUT' ? 'ring-2 ring-rose-500 ring-offset-2 bg-rose-50' : 'bg-white hover:bg-rose-50/50'"
             class="border border-slate-200/60 rounded-3xl p-4 text-center transition-all cursor-pointer shadow-sm group">
            <p class="text-rose-600 font-black text-2xl group-hover:scale-110 transition-transform"
               v-text="inventoryMoves.filter(m => m.move_type === 'OUT').length"></p>
            <p class="text-[10px] text-slate-500 uppercase font-black tracking-widest mt-1"
               v-text="isArabic ? 'صرفيات' : 'Issues'"></p>
        </div>
        <div @click="forms.stock_entry.filterType = 'ALL'"
             :class="forms.stock_entry.filterType === 'ALL' ? 'ring-2 ring-slate-900 ring-offset-2 bg-slate-900' : 'bg-white hover:bg-slate-50'"
             class="border border-slate-200/60 rounded-3xl p-4 text-center transition-all cursor-pointer shadow-sm group">
            <p class="font-black text-2xl group-hover:scale-110 transition-transform"
               :class="forms.stock_entry.filterType === 'ALL' ? 'text-white' : 'text-slate-900'"
               v-text="inventoryMoves.length"></p>
            <p class="text-[10px] uppercase font-black tracking-widest mt-1"
               :class="forms.stock_entry.filterType === 'ALL' ? 'text-slate-400' : 'text-slate-500'"
               v-text="isArabic ? 'الكل' : 'Total'"></p>
        </div>
    </div>

    <!-- Moves List -->
    <div class="flex-1 overflow-y-auto px-8 py-4 scroll-smooth">

        <!-- Empty State -->
        <div v-if="!inventoryMoves || inventoryMoves.length === 0"
             class="flex flex-col items-center justify-center h-full text-center py-20">
            <div class="w-24 h-24 rounded-3xl bg-slate-100 flex items-center justify-center mb-6">
                <i class="fas fa-box-open text-4xl text-slate-300"></i>
            </div>
            <p class="text-slate-900 font-black text-lg"
               v-text="isArabic ? 'المخزن فارغ تماماً' : 'Empty Inventory'"></p>
            <p class="text-slate-500 text-xs mt-2 mb-8 max-w-xs font-medium"
               v-text="isArabic ? 'ابدأ بإضافة أول حركة يدوية لتتبع بضاعتك بسهولة' : 'Start by adding your first manual move to track your stock easily'"></p>
            <button @click="openModal('stock_entry')"
                    class="flex items-center gap-3 bg-emerald-500 hover:bg-emerald-600 text-white text-xs font-black px-8 py-3.5 rounded-2xl shadow-xl shadow-emerald-200 transition-all active:scale-95">
                <i class="fas fa-plus"></i>
                <span v-text="isArabic ? 'إضافة حركة الآن' : 'Add First Move'"></span >
            </button>
        </div>

        <!-- Moves List -->
        <div v-else class="space-y-3 pb-8">
            <div v-for="move in displayMoves" 
                 :key="move.id"
                 class="group flex items-center gap-5 bg-white/60 hover:bg-white border border-white/80 hover:border-emerald-200 hover:shadow-xl hover:shadow-slate-200/40 rounded-3xl px-6 py-4 transition-all duration-300">

                <!-- Type Icon -->
                <div class="shrink-0 relative">
                    <div v-if="move.move_type === 'IN'"
                         class="w-12 h-12 rounded-2xl bg-emerald-50 flex items-center justify-center border border-emerald-100 shadow-inner">
                        <i class="fas fa-arrow-down text-emerald-500"></i>
                    </div>
                    <div v-else
                         class="w-12 h-12 rounded-2xl bg-rose-50 flex items-center justify-center border border-rose-100 shadow-inner">
                        <i class="fas fa-arrow-up text-rose-500"></i>
                    </div>
                    <!-- Indicator dot -->
                    <div class="absolute -top-1 -right-1 w-3 h-3 rounded-full border-2 border-white"
                         :class="move.move_type === 'IN' ? 'bg-emerald-500' : 'bg-rose-500'"></div>
                </div>

                <!-- Info -->
                <div class="flex-1 min-w-0">
                    <div class="flex items-center gap-2">
                        <p class="text-sm font-black text-slate-900 truncate" v-text="move.material_name || '---'"></p>
                        <span class="text-[9px] font-black px-2 py-0.5 rounded-md uppercase tracking-tighter"
                              :class="move.move_type === 'IN' ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700'"
                              v-text="move.move_type"></span>
                    </div>
                    <p class="text-[11px] text-slate-500 font-bold mt-1 flex items-center gap-1.5">
                        <i class="fas fa-user-circle text-slate-300"></i>
                        <span v-text="move.vendor_name || (isArabic ? 'بدون طرف' : 'No Contact')"></span>
                        <span class="text-slate-200 mx-1">|</span>
                        <i class="fas fa-file-invoice text-slate-300"></i>
                        <span v-text="move.reference || '---'"></span>
                    </p>
                </div>

                <!-- Qty & Value -->
                <div class="text-right shrink-0 px-4">
                    <p class="font-black text-lg leading-none"
                       :class="move.move_type === 'IN' ? 'text-emerald-600' : 'text-rose-600'"
                       v-text="(move.move_type === 'OUT' ? '-' : '+') + move.quantity"></p>
                    <p class="text-[10px] text-slate-400 font-bold mt-1 uppercase" 
                       v-text="formatDate(move.created_at)"></p>
                </div>

                <!-- Actions (Hover Only) -->
                <div class="flex items-center gap-2 shrink-0 opacity-0 group-hover:opacity-100 transition-opacity translate-x-2 group-hover:translate-x-0">
                    <button @click="printMove(move)" 
                            class="w-10 h-10 rounded-xl bg-slate-100 hover:bg-slate-900 text-slate-500 hover:text-white flex items-center justify-center transition-all">
                        <i class="fas fa-print text-sm"></i>
                    </button>
                    <button @click="editMove(move)"
                            class="w-10 h-10 rounded-xl bg-slate-100 hover:bg-slate-900 text-slate-500 hover:text-white flex items-center justify-center transition-all">
                        <i class="fas fa-edit text-sm"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
