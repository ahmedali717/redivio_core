<div class="sales-dashboard-wrapper space-y-8 animate-in fade-in slide-in-from-bottom-5 duration-700 pb-10">
    
    <!-- Header Control Bar -->
    <div class="bg-white rounded-[2rem] p-6 flex flex-col md:flex-row justify-between items-start md:items-center border border-slate-100 shadow-[0_8px_30px_rgb(0,0,0,0.04)] gap-6">
        <div class="flex items-center gap-5">
            <div class="w-16 h-16 bg-gradient-to-br from-rose-500 to-pink-600 rounded-2xl flex items-center justify-center text-white shadow-lg shadow-rose-200 rotate-3 hover:rotate-0 transition-transform">
                <i class="fas fa-hand-holding-dollar text-2xl"></i>
            </div>
            <div>
                <h1 class="text-3xl font-black text-slate-800 tracking-tight" v-text="isArabic ? 'إدارة المبيعات (Sales Control)' : 'Sales Command Center'"></h1>
                <p class="text-slate-500 text-sm font-bold uppercase tracking-wider flex items-center gap-2 mt-1">
                    <span class="flex h-2 w-2 relative">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
                    </span>
                    <span v-text="isArabic ? 'تحليلات وعمليات البيع الحية' : 'Live Pipeline Operations'"></span>
                </p>
            </div>
        </div>
        
        <!-- Quick Control Actions -->
        <div class="flex flex-wrap gap-3">
            <button @click="openModal('salesorder')" class="group bg-rose-50 hover:bg-rose-600 text-rose-600 hover:text-white px-5 py-3 rounded-xl shadow-sm transition-all flex items-center gap-2 font-bold tracking-wide">
                <i class="fas fa-file-invoice-dollar group-hover:scale-110 transition-transform"></i> <span v-text="isArabic ? 'إنشاء أمر بيع جديد' : 'New Sales Order'"></span>
            </button>
            <button @click="openModal('customer')" class="bg-slate-900 hover:bg-slate-800 text-white px-5 py-3 rounded-xl shadow-lg transition-all flex items-center gap-2 font-bold tracking-wide">
                <i class="fas fa-user-plus"></i> <span v-text="isArabic ? 'تعريف عميل' : 'New Customer'"></span>
            </button>
        </div>
    </div>
    
    <!-- Actionable Alerts (Bottlenecks & Critical KPIs) -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        
        <!-- Critical Alert: Pending Approvals -->
        <div class="bg-gradient-to-br from-rose-50 to-white p-6 rounded-[2rem] border border-rose-100 shadow-sm relative overflow-hidden group hover:shadow-md transition-shadow">
            <div class="absolute right-0 top-0 w-24 h-24 bg-rose-100/50 rounded-bl-full z-0 transition-transform group-hover:scale-110"></div>
            <div class="relative z-10 flex justify-between items-start mb-2">
                <div class="w-10 h-10 bg-rose-100 text-rose-600 rounded-xl flex items-center justify-center animate-pulse"><i class="fas fa-file-signature"></i></div>
                <span class="text-[10px] font-black text-rose-600 uppercase tracking-widest bg-white/80 px-2 py-1 rounded-md border border-rose-100">Review</span>
            </div>
            <div class="relative z-10 mt-4">
                <h3 class="text-4xl font-black text-rose-600 tech-font" v-text="kpis.pending_sos || 4"></h3>
                <p class="text-sm font-bold text-slate-800 mt-1" v-text="isArabic ? 'عروض أسعار تنتظر الاعتماد' : 'Quotes missing approval'"></p>
                <button @click="salesTab = 'orders'" class="mt-4 text-xs font-black text-rose-600 hover:text-rose-700 uppercase flex items-center gap-1 group/btn">
                    <span v-text="isArabic ? 'اعتماد العروض الآن' : 'Validate Quotes'"></span> <i class="fas fa-arrow-right transition-transform group-hover/btn:translate-x-1" :class="isArabic ? 'rotate-180' : ''"></i>
                </button>
            </div>
        </div>

        <!-- Warning: Churn Risk -->
        <div class="bg-gradient-to-br from-amber-50 to-white p-6 rounded-[2rem] border border-amber-100 shadow-sm relative overflow-hidden group hover:shadow-md transition-shadow">
            <div class="absolute right-0 top-0 w-24 h-24 bg-amber-100/50 rounded-bl-full z-0 transition-transform group-hover:scale-110"></div>
            <div class="relative z-10 flex justify-between items-start mb-2">
                <div class="w-10 h-10 bg-amber-100 text-amber-600 rounded-xl flex items-center justify-center"><i class="fas fa-user-clock"></i></div>
                <span class="text-[10px] font-black text-amber-600 uppercase tracking-widest bg-white/80 px-2 py-1 rounded-md border border-amber-100">Alert</span>
            </div>
            <div class="relative z-10 mt-4">
                <h3 class="text-4xl font-black text-amber-600 tech-font" v-text="2"></h3>
                <p class="text-sm font-bold text-slate-800 mt-1" v-text="isArabic ? 'عملاء لم يشتروا منذ 6 أشهر' : 'Inactive Clients > 6 months'"></p>
                <button class="mt-4 text-xs font-black text-amber-600 hover:text-amber-700 uppercase flex items-center gap-1 group/btn">
                    <span v-text="isArabic ? 'إرسال حملة تنشيط' : 'Send Retention Promo'"></span> <i class="fas fa-arrow-right transition-transform group-hover/btn:translate-x-1" :class="isArabic ? 'rotate-180' : ''"></i>
                </button>
            </div>
        </div>

        <!-- Good: Sales Target -->
        <div class="bg-gradient-to-br from-emerald-50 to-white p-6 rounded-[2rem] border border-emerald-100 shadow-sm relative overflow-hidden group hover:shadow-md transition-shadow">
            <div class="absolute right-0 top-0 w-24 h-24 bg-emerald-100/50 rounded-bl-full z-0 transition-transform group-hover:scale-110"></div>
            <div class="relative z-10 flex justify-between items-start mb-2">
                <div class="w-10 h-10 bg-emerald-100 text-emerald-600 rounded-xl flex items-center justify-center"><i class="fas fa-trophy"></i></div>
                <span class="text-[10px] font-black text-emerald-600 uppercase tracking-widest bg-white/80 px-2 py-1 rounded-md border border-emerald-100">On Track</span>
            </div>
            <div class="relative z-10 mt-4">
                <div class="flex items-end gap-1">
                    <h3 class="text-4xl font-black text-emerald-600 tech-font">82</h3><span class="text-xl font-bold text-emerald-600 mb-1">%</span>
                </div>
                <p class="text-sm font-bold text-slate-800 mt-1" v-text="isArabic ? 'تحقيق التارجت الشهري' : 'Monthly Quota Attainment'"></p>
                <div class="w-full bg-emerald-100 h-2 mt-4 rounded-full overflow-hidden">
                    <div class="bg-emerald-500 h-full rounded-full" style="width: 82%"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bottlenecks & Operational Health Flow -->
    <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
        
        <!-- Pipeline Visualizer -->
        <div class="lg:col-span-1 bg-slate-900 rounded-[2.5rem] p-8 relative overflow-hidden shadow-2xl flex flex-col justify-between group">
            <div class="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/carbon-fibre.png')] opacity-20"></div>
            <div class="relative z-10">
                <h3 class="font-black text-white text-lg flex items-center gap-2 mb-1">
                    <i class="fas fa-filter text-rose-400"></i>
                    <span v-text="isArabic ? 'قمع المبيعات' : 'Sales Pipeline'"></span>
                </h3>
                <p class="text-[10px] text-slate-400 uppercase tracking-widest font-bold" v-text="isArabic ? 'مسار التحويل الحالي' : 'Current Deal Flow'"></p>
            </div>
            
            <div class="relative z-10 flex flex-col gap-3 my-8">
                <div class="w-full bg-white/10 rounded-xl p-3 flex justify-between items-center backdrop-blur-sm border border-white/5">
                     <span class="text-xs font-bold text-slate-300">Leads Flow</span>
                     <span class="font-black text-white">120</span>
                </div>
                <div class="w-11/12 mx-auto bg-white/10 rounded-xl p-3 flex justify-between items-center backdrop-blur-sm border border-white/5">
                     <span class="text-xs font-bold text-slate-300">Quotes</span>
                     <span class="font-black text-white">45</span>
                </div>
                <div class="w-5/6 mx-auto bg-rose-500/20 rounded-xl p-3 flex justify-between items-center backdrop-blur-sm border border-rose-500/40">
                     <span class="text-xs font-bold text-rose-200">Wins</span>
                     <span class="font-black text-white">18</span>
                </div>
            </div>
            
            <div class="relative z-10 text-center">
                <span class="text-3xl font-black text-white tech-font">15%</span>
                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mt-1" v-text="isArabic ? 'معدل التحويل' : 'Win Rate Conversion'"></p>
            </div>
        </div>

        <!-- Operations Queue Control -->
        <div class="lg:col-span-3 bg-white border border-slate-100 rounded-[2.5rem] p-8 shadow-[0_8px_30px_rgb(0,0,0,0.04)]">
            <div class="flex justify-between items-center mb-6">
                <div>
                    <h3 class="font-black text-xl text-slate-800" v-text="isArabic ? 'أوامر مبدئية معلقة (Pending Sales)' : 'Pending Sales Queue'"></h3>
                    <p class="text-xs font-bold text-slate-400 mt-1 uppercase tracking-wider" v-text="isArabic ? 'طلبات تتطلب تأكيد الدفع أو الاعتماد' : 'Orders requiring payment or manager approval'"></p>
                </div>
                <button class="w-10 h-10 bg-slate-50 text-slate-400 hover:text-blue-600 rounded-xl flex items-center justify-center transition-colors">
                    <i class="fas fa-ellipsis-v"></i>
                </button>
            </div>
            
            <div class="w-full overflow-x-auto">
                <table class="w-full text-left border-collapse" :dir="isArabic ? 'rtl' : 'ltr'">
                    <thead>
                        <tr class="border-b-2 border-slate-100 text-[10px] font-black text-slate-400 uppercase tracking-widest">
                            <th class="pb-4 w-1/4" v-text="isArabic ? 'رقم الأمر' : 'Order Ref'"></th>
                            <th class="pb-4 w-1/4" v-text="isArabic ? 'العميل' : 'Customer'"></th>
                            <th class="pb-4 w-1/4" v-text="isArabic ? 'القيمة' : 'Value'"></th>
                            <th class="pb-4 w-1/4 text-center" v-text="isArabic ? 'التحكم' : 'Action'"></th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr class="border-b border-slate-50 hover:bg-slate-50/50 transition-colors group">
                            <td class="py-4">
                                <span class="font-black text-slate-700 font-mono">SO-2023-0104</span>
                                <p class="text-[10px] text-red-500 font-bold"><i class="fas fa-lock"></i> [[ isArabic ? 'يتطلب مراجعة' : 'Requires Audit' ]]</p>
                            </td>
                            <td class="py-4 font-bold text-sm text-slate-600">Alrajhi Bank</td>
                            <td class="py-4 font-black text-rose-600">12,500 <span class="text-[10px] text-slate-400">SAR</span></td>
                            <td class="py-4 text-center">
                                <button class="opacity-0 group-hover:opacity-100 bg-rose-600 text-white px-4 py-1.5 rounded-lg text-xs font-bold shadow-md hover:bg-rose-700 transition-all uppercase tracking-wider" v-text="isArabic ? 'اعتماد العرض' : 'Confirm Deal'"></button>
                            </td>
                        </tr>
                        <tr class="border-b border-slate-50 hover:bg-slate-50/50 transition-colors group">
                            <td class="py-4">
                                <span class="font-black text-slate-700 font-mono">SO-2023-0105</span>
                                <p class="text-[10px] text-slate-400 font-bold">[[ isArabic ? 'مسودة عرض سعر' : 'Draft Quote' ]]</p>
                            </td>
                            <td class="py-4 font-bold text-sm text-slate-600">Jomiah Corp</td>
                            <td class="py-4 font-black text-rose-600">4,200 <span class="text-[10px] text-slate-400">SAR</span></td>
                            <td class="py-4 text-center">
                                <button class="opacity-0 group-hover:opacity-100 bg-rose-600 text-white px-4 py-1.5 rounded-lg text-xs font-bold shadow-md hover:bg-rose-700 transition-all uppercase tracking-wider" v-text="isArabic ? 'إرسال للعميل' : 'Send Quote'"></button>
                            </td>
                        </tr>
                    </tbody>
                </table>
                <div class="mt-4 text-center">
                     <button @click="salesTab = 'orders'" class="text-[10px] font-black text-slate-400 hover:text-rose-600 uppercase tracking-widest transition-colors" v-text="isArabic ? 'عرض كافة أوامر المبيعات' : 'View All Sales Orders'"></button>
                </div>
            </div>
        </div>
    </div>
</div>
