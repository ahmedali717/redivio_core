<div class="sales-dashboard-wrapper space-y-8 animate-in fade-in slide-in-from-bottom-5 duration-700 pb-12">
    
    <!-- Header Control Bar -->
    <div class="liquid-glass-card rounded-[2.5rem] p-6 md:p-8 flex flex-col md:flex-row justify-between items-start md:items-center gap-6 relative overflow-hidden">
        <div class="glass-sheen"></div>
        <div class="relative z-10 flex items-center gap-5">
            <div class="w-16 h-16 bg-blue-600/15 border border-blue-500/30 rounded-3xl flex items-center justify-center text-blue-400 shadow-xl shadow-blue-500/15">
                <i class="fas fa-handshake text-2xl text-blue-400"></i>
            </div>
            <div>
                <h1 class="text-2xl md:text-3xl font-black text-[var(--heading-color)] tracking-tight" v-text="isArabic ? 'إدارة المبيعات والعملاء (Sales CRM)' : 'Sales Command Center'"></h1>
                <p class="text-xs font-semibold text-[var(--text-secondary)] mt-1.5 flex items-center gap-2">
                    <span class="flex h-2 w-2 relative">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-blue-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-2 w-2 bg-blue-500"></span>
                    </span>
                    <span v-text="isArabic ? 'دورة المبيعات المتكاملة والتحصيل المالي اللحظي' : 'Live Pipeline & Financial Receivables'"></span>
                </p>
            </div>
        </div>
        
        <!-- Quick Actions -->
        <div class="relative z-10 flex flex-wrap gap-3">
            <button @click="openModal('salesorder')" class="liquid-glass-btn bg-blue-600 hover:bg-blue-500 text-white px-5 py-3 rounded-2xl shadow-lg shadow-blue-600/25 transition-all flex items-center gap-2 font-bold text-xs">
                <i class="fas fa-file-invoice-dollar text-xs"></i> 
                <span v-text="isArabic ? 'إنشاء أمر بيع جديد' : 'New Sales Order'"></span>
            </button>
            <button @click="openModal('customer')" class="liquid-glass-btn bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-600/30 px-5 py-3 rounded-2xl shadow-md transition-all flex items-center gap-2 font-bold text-xs">
                <i class="fas fa-user-plus text-blue-400"></i> 
                <span v-text="isArabic ? 'تعريف عميل جديد' : 'New Customer'"></span>
            </button>
        </div>
    </div>
    
    <!-- Actionable KPI Stat Cards (Unified 3-Color: Blue, Gray, White) -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        
        <!-- Card 1: Pending Approvals -->
        <div class="liquid-glass-card rounded-[2rem] p-6 relative overflow-hidden group">
            <div class="glass-sheen"></div>
            <div class="relative z-10 flex justify-between items-start mb-3">
                <div class="w-12 h-12 rounded-2xl bg-slate-800/80 border border-slate-600/30 text-white flex items-center justify-center">
                    <i class="fas fa-file-signature text-blue-400 text-lg"></i>
                </div>
                <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest bg-[var(--subcard-bg)] px-2.5 py-1 rounded-xl border border-[var(--subcard-border)]">Pending</span>
            </div>
            <div class="relative z-10 mt-2">
                <h3 class="text-3xl font-black text-[var(--heading-color)] tech-font" v-text="soStats ? soStats.draftCount : 0"></h3>
                <p class="text-xs font-bold text-[var(--text-secondary)] mt-1" v-text="isArabic ? 'عروض أسعار في انتظار الاعتماد' : 'Quotes awaiting confirmation'"></p>
                <button @click="salesTab = 'orders'" class="mt-4 text-xs font-black text-blue-400 hover:text-blue-300 uppercase flex items-center gap-1.5 transition-colors">
                    <span v-text="isArabic ? 'اعتماد العروض الآن' : 'Validate Quotes'"></span> 
                    <i class="fas" :class="isArabic ? 'fa-arrow-left' : 'fa-arrow-right'"></i>
                </button>
            </div>
        </div>

        <!-- Card 2: Confirmed Orders -->
        <div class="liquid-glass-card rounded-[2rem] p-6 relative overflow-hidden group">
            <div class="glass-sheen"></div>
            <div class="relative z-10 flex justify-between items-start mb-3">
                <div class="w-12 h-12 rounded-2xl bg-blue-600/15 border border-blue-500/30 text-blue-400 flex items-center justify-center">
                    <i class="fas fa-truck-ramp-box text-blue-400 text-lg"></i>
                </div>
                <span class="text-[10px] font-black text-blue-400 uppercase tracking-widest bg-blue-500/10 px-2.5 py-1 rounded-xl border border-blue-500/20">Delivery</span>
            </div>
            <div class="relative z-10 mt-2">
                <h3 class="text-3xl font-black text-blue-400 tech-font" v-text="soStats ? soStats.confirmedCount : 0"></h3>
                <p class="text-xs font-bold text-[var(--text-secondary)] mt-1" v-text="isArabic ? 'أوامر بيع جاهزة للصرف المخزني' : 'Orders ready for warehouse delivery'"></p>
                <button @click="salesTab = 'orders'" class="mt-4 text-xs font-black text-blue-400 hover:text-blue-300 uppercase flex items-center gap-1.5 transition-colors">
                    <span v-text="isArabic ? 'تنفيذ الصرف بالمستودع' : 'Dispatch Items'"></span> 
                    <i class="fas" :class="isArabic ? 'fa-arrow-left' : 'fa-arrow-right'"></i>
                </button>
            </div>
        </div>

        <!-- Card 3: Monthly Attainment -->
        <div class="liquid-glass-card rounded-[2rem] p-6 relative overflow-hidden group">
            <div class="glass-sheen"></div>
            <div class="relative z-10 flex justify-between items-start mb-3">
                <div class="w-12 h-12 rounded-2xl bg-slate-800/80 border border-slate-600/30 text-white flex items-center justify-center">
                    <i class="fas fa-trophy text-slate-200 text-lg"></i>
                </div>
                <span class="text-[10px] font-black text-slate-300 uppercase tracking-widest bg-[var(--subcard-bg)] px-2.5 py-1 rounded-xl border border-[var(--subcard-border)]">Performance</span>
            </div>
            <div class="relative z-10 mt-2">
                <div class="flex items-end gap-1">
                    <h3 class="text-3xl font-black text-[var(--heading-color)] tech-font">88</h3>
                    <span class="text-base font-bold text-slate-400 mb-1">%</span>
                </div>
                <p class="text-xs font-bold text-[var(--text-secondary)] mt-1" v-text="isArabic ? 'نسبة تحقيق مبيعات الشهر' : 'Monthly Quota Attainment'"></p>
                <div class="w-full bg-[var(--subcard-bg)] h-2 mt-4 rounded-full overflow-hidden border border-[var(--subcard-border)]">
                    <div class="bg-blue-600 h-full rounded-full" style="width: 88%"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Operations Queue & Pipeline Flow -->
    <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
        
        <!-- Pipeline Funnel Visualizer -->
        <div class="lg:col-span-1 liquid-glass-card rounded-[2.5rem] p-6 md:p-8 relative overflow-hidden flex flex-col justify-between">
            <div class="glass-sheen"></div>
            <div class="relative z-10">
                <h3 class="font-black text-[var(--heading-color)] text-base flex items-center gap-2 mb-1">
                    <i class="fas fa-filter text-blue-400"></i>
                    <span v-text="isArabic ? 'قمع المبيعات' : 'Sales Pipeline'"></span>
                </h3>
                <p class="text-[10px] text-slate-400 uppercase tracking-widest font-bold" v-text="isArabic ? 'معدل التحويل' : 'Conversion Flow'"></p>
            </div>
            
            <div class="relative z-10 flex flex-col gap-3 my-6">
                <div class="w-full bg-[var(--subcard-bg)] border border-[var(--subcard-border)] rounded-2xl p-3 flex justify-between items-center">
                     <span class="text-xs font-bold text-slate-400">Quotes</span>
                     <span class="font-black text-[var(--heading-color)] tech-font">[[ soStats ? soStats.draftCount : 45 ]]</span>
                </div>
                <div class="w-11/12 mx-auto bg-blue-500/10 border border-blue-500/20 rounded-2xl p-3 flex justify-between items-center">
                     <span class="text-xs font-bold text-blue-400">Confirmed</span>
                     <span class="font-black text-blue-400 tech-font">[[ soStats ? soStats.confirmedCount : 28 ]]</span>
                </div>
                <div class="w-5/6 mx-auto bg-slate-800/80 border border-slate-600/30 rounded-2xl p-3 flex justify-between items-center text-white">
                     <span class="text-xs font-bold text-slate-300">Fulfilled</span>
                     <span class="font-black text-white tech-font">[[ soStats ? soStats.shippedCount : 18 ]]</span>
                </div>
            </div>
            
            <div class="relative z-10 text-center pt-3 border-t border-[var(--subcard-border)]">
                <span class="text-2xl font-black text-blue-400 tech-font">24.5%</span>
                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mt-0.5" v-text="isArabic ? 'معدل الإغلاق الناجح' : 'Win Rate Conversion'"></p>
            </div>
        </div>

        <!-- Operations Queue Control -->
        <div class="lg:col-span-3 liquid-glass-card rounded-[2.5rem] p-6 md:p-8 relative overflow-hidden">
            <div class="glass-sheen"></div>
            <div class="relative z-10 flex justify-between items-center mb-6">
                <div>
                    <h3 class="font-black text-lg md:text-xl text-[var(--heading-color)]" v-text="isArabic ? 'أحدث أوامر المبيعات الجارية' : 'Active Sales Orders'"></h3>
                    <p class="text-xs font-medium text-[var(--text-secondary)] mt-0.5" v-text="isArabic ? 'متابعة الصرف المخزني وإصدار الفواتير فور التسليم' : 'Track delivery dispatch and invoice issuance'"></p>
                </div>
                <button @click="salesTab = 'orders'" class="text-xs font-bold text-blue-400 hover:text-blue-300 flex items-center gap-1 transition-colors">
                    <span v-text="isArabic ? 'عرض كافة الأوامر' : 'View All'"></span>
                    <i class="fas" :class="isArabic ? 'fa-arrow-left' : 'fa-arrow-right'"></i>
                </button>
            </div>
            
            <div class="relative z-10 w-full overflow-x-auto">
                <table class="w-full text-right border-separate border-spacing-y-2">
                    <thead>
                        <tr class="text-[10px] font-black text-slate-400 uppercase tracking-widest">
                            <th class="px-4 py-2" v-text="isArabic ? 'رقم الأمر' : 'Order Ref'"></th>
                            <th class="px-4 py-2" v-text="isArabic ? 'العميل' : 'Customer'"></th>
                            <th class="px-4 py-2" v-text="isArabic ? 'القيمة الإجمالية' : 'Value'"></th>
                            <th class="px-4 py-2 text-center" v-text="isArabic ? 'الحالة' : 'Status'"></th>
                            <th class="px-4 py-2 text-left" v-text="isArabic ? 'إجراءات Odoo' : 'Actions'"></th>
                        </tr>
                    </thead>
                    <tbody class="text-xs font-medium">
                        <tr v-for="so in (salesOrders || []).slice(0, 5)" :key="so.id" 
                            class="bg-[var(--subcard-bg)] hover:bg-[var(--subcard-hover-bg)] border border-[var(--subcard-border)] rounded-2xl transition-all">
                            <td class="px-4 py-3.5 rounded-r-2xl font-black text-[var(--heading-color)] font-mono">
                                [[ so.so_number ]]
                            </td>
                            <td class="px-4 py-3.5 font-bold text-[var(--text-primary)]">
                                [[ so.customer_name ]]
                            </td>
                            <td class="px-4 py-3.5 font-black text-blue-400 tech-font">
                                $[[ formatNumber(so.grand_total) ]]
                            </td>
                            <td class="px-4 py-3.5 text-center">
                                <span :class="getStatusClass(so.status)" class="text-[10px] px-2.5 py-0.5 rounded-full font-bold uppercase border">
                                    [[ so.status ]]
                                </span>
                            </td>
                            <td class="px-4 py-3.5 text-left rounded-l-2xl">
                                <div class="flex items-center justify-end gap-1.5">
                                    <button v-if="so.status === 'CONFIRMED' || so.status === 'SHIPPED'" @click="generateInvoice(so)"
                                        :title="isArabic ? 'إصدار فاتورة Odoo' : 'Invoice'"
                                        class="px-2.5 py-1 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-bold text-[10px] transition-all">
                                        [[ isArabic ? 'فاتورة' : 'Invoice' ]]
                                    </button>
                                    <button @click="printSO(so.id)" class="w-7 h-7 rounded-lg bg-[var(--subcard-bg)] border border-[var(--subcard-border)] text-slate-400 hover:text-white flex items-center justify-center text-xs">
                                        <i class="fas fa-print"></i>
                                    </button>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
