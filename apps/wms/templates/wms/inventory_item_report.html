<div class="h-full flex flex-col space-y-6 p-4 animate-in fade-in duration-500">
    <div class="bg-white p-8 rounded-[2.5rem] border border-slate-200 shadow-sm">
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
            <div class="space-y-2">
                <label class="text-xs font-black text-slate-500 mr-2">اختيار الصنف</label>
                <select v-model="reportFilters.material_id" class="w-full bg-slate-50 border-2 border-slate-100 rounded-2xl p-4 text-sm font-bold outline-none">
                    <option value="">-- اختر الصنف --</option>
                    <option v-for="m in materials_list" :key="m.id" :value="m.id">[[ m.name ]]</option>
                </select>
            </div>

            <div class="space-y-2">
                <label class="text-xs font-black text-slate-500 mr-2">الموقع</label>
                <select v-model="reportFilters.location_id" class="w-full bg-slate-50 border-2 border-slate-100 rounded-2xl p-4 text-sm font-bold outline-none">
                    <option value="">-- كل المواقع --</option>
                    <option v-for="loc in plants" :key="loc.id" :value="loc.id">[[ loc.name ]]</option>
                </select>
            </div>

            <div class="space-y-2">
                <label class="text-xs font-black text-slate-500 mr-2">من تاريخ</label>
                <input type="date" v-model="reportFilters.date_from" class="w-full bg-slate-50 border-2 border-slate-100 rounded-2xl p-4 text-sm font-bold outline-none">
            </div>

            <div class="space-y-2">
                <label class="text-xs font-black text-slate-500 mr-2">إلى تاريخ</label>
                <div class="flex gap-2">
                    <input type="date" v-model="reportFilters.date_to" class="w-full bg-slate-50 border-2 border-slate-100 rounded-2xl p-4 text-sm font-bold outline-none">
                    <button @click="generateItemReport" class="bg-indigo-600 hover:bg-indigo-700 text-white w-14 rounded-2xl flex items-center justify-center">
                        <i class="fas fa-search"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="flex-1 bg-white rounded-[2.5rem] border border-slate-200 shadow-sm overflow-hidden flex flex-col">
        <div class="flex-1 overflow-y-auto">
            <table class="w-full text-right border-collapse" v-if="inventoryMoves && inventoryMoves.length > 0">
                <thead class="sticky top-0 bg-slate-50 border-b border-slate-100">
                    <tr class="text-[10px] font-black text-slate-400">
                        <th class="px-8 py-5">التاريخ والوقت</th>
                        <th class="px-8 py-5">نوع الحركة</th>
                        <th class="px-8 py-5 text-center">الكمية</th>
                        <th class="px-8 py-5">المرجع</th>
                    </tr>
                </thead>
                <tbody>
                    <tr v-for="move in inventoryMoves" :key="move.id">
                        <td class="px-8 py-5 text-xs font-bold">[[ formatDate(move.date) ]]</td>
                        <td class="px-8 py-5">[[ move.move_type ]]</td>
                        <td class="px-8 py-5 text-center font-black">[[ move.quantity ]]</td>
                        <td class="px-8 py-5 text-[10px]">[[ move.reference ]]</td>
                    </tr>
                </tbody>
            </table>

            <div v-else class="py-32 text-center text-slate-400 font-black">
                <i class="fas fa-layer-group text-8xl opacity-10 mb-4"></i>
                <p>قم باختيار الصنف والبحث</p>
            </div>
        </div>
    </div>
</div>
