<div class="wms-dashboard-wrapper space-y-8 animate-in fade-in slide-in-from-bottom-5 duration-700 pb-10">
    
    <!-- Header Control Bar -->
    <div class="bg-white rounded-[2rem] p-6 flex flex-col md:flex-row justify-between items-start md:items-center border border-slate-100 shadow-[0_8px_30px_rgb(0,0,0,0.04)] gap-6">
        <div class="flex items-center gap-5">
            <div class="w-16 h-16 bg-gradient-to-br from-indigo-500 to-blue-600 rounded-2xl flex items-center justify-center text-white shadow-lg shadow-indigo-200 rotate-3 hover:rotate-0 transition-transform">
                <i class="fas fa-boxes-stacked text-2xl"></i>
            </div>
            <div>
                <h1 class="text-3xl font-black text-slate-800 tracking-tight" v-text="isArabic ? 'لوحة تحكم المستودعات' : 'WMS Command Center'"></h1>
                <p class="text-slate-500 text-sm font-bold uppercase tracking-wider flex items-center gap-2 mt-1">
                    <span class="flex h-2 w-2 relative">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
                    </span>
                    <span v-text="isArabic ? 'مراقبة حية للمخزون' : 'Real-time Stock Monitoring'"></span>
                </p>
            </div>
        </div>
        
        <!-- Quick Control Actions -->
        <div class="flex flex-wrap gap-3">
            <button @click="openModal('stock_entry')" class="group bg-blue-50 hover:bg-blue-600 text-blue-600 hover:text-white px-5 py-3 rounded-xl shadow-sm transition-all flex items-center gap-2 font-bold tracking-wide">
                <i class="fas fa-truck-loading group-hover:animate-bounce"></i> <span v-text="isArabic ? 'إذن مخزني' : 'Stock Move'"></span>
            </button>
            <button @click="openModal('material')" class="group bg-indigo-50 hover:bg-indigo-600 text-indigo-600 hover:text-white px-5 py-3 rounded-xl shadow-sm transition-all flex items-center gap-2 font-bold tracking-wide">
                <i class="fas fa-barcode group-hover:scale-110 transition-transform"></i> <span v-text="isArabic ? 'تعريف صنف' : 'New SKU'"></span>
            </button>
            <button @click="printInventoryReport()" class="bg-slate-900 hover:bg-slate-800 text-white px-5 py-3 rounded-xl shadow-lg transition-all flex items-center gap-2 font-bold tracking-wide">
                <i class="fas fa-print"></i> <span v-text="isArabic ? 'طباعة تقرير الجرد' : 'Print Audit'"></span>
            </button>
        </div>
    </div>
    
    <!-- Actionable Alerts (Bottlenecks & Critical KPIs) -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        
        <!-- Critical Alert: Low Stock -->
        <div class="bg-gradient-to-br from-red-50 to-white p-6 rounded-[2rem] border border-red-100 shadow-sm relative overflow-hidden group">
            <div class="absolute right-0 top-0 w-24 h-24 bg-red-100/50 rounded-bl-full z-0 transition-transform group-hover:scale-110"></div>
            <div class="relative z-10 flex justify-between items-start mb-2">
                <div class="w-10 h-10 bg-red-100 text-red-600 rounded-xl flex items-center justify-center animate-pulse"><i class="fas fa-triangle-exclamation"></i></div>
                <span class="text-[10px] font-black text-red-600 uppercase tracking-widest bg-white/80 px-2 py-1 rounded-md border border-red-100">Action Required</span>
            </div>
            <div class="relative z-10 mt-4">
                <h3 class="text-4xl font-black text-red-600 tech-font" v-text="kpis.low_stock_count || 3"></h3>
                <p class="text-sm font-bold text-slate-800 mt-1" v-text="isArabic ? 'أصناف تجاوزت حد إعادة الطلب' : 'SKUs below reorder point'"></p>
                <button @click="openModal('purchase_order')" class="mt-4 text-xs font-black text-red-600 hover:text-red-700 uppercase flex items-center gap-1 group/btn">
                    <span v-text="isArabic ? 'إنشاء أمر شراء الآن' : 'Create PO Now'"></span> <i class="fas fa-arrow-right transition-transform group-hover/btn:translate-x-1" :class="isArabic ? 'rotate-180' : ''"></i>
                </button>
            </div>
        </div>

        <!-- Warning: Stagnant Stock -->
        <div class="bg-gradient-to-br from-amber-50 to-white p-6 rounded-[2rem] border border-amber-100 shadow-sm relative overflow-hidden group">
            <div class="absolute right-0 top-0 w-24 h-24 bg-amber-100/50 rounded-bl-full z-0 transition-transform group-hover:scale-110"></div>
            <div class="relative z-10 flex justify-between items-start mb-2">
                <div class="w-10 h-10 bg-amber-100 text-amber-600 rounded-xl flex items-center justify-center"><i class="fas fa-hourglass-half"></i></div>
                <span class="text-[10px] font-black text-amber-600 uppercase tracking-widest bg-white/80 px-2 py-1 rounded-md border border-amber-100">Review</span>
            </div>
            <div class="relative z-10 mt-4">
                <h3 class="text-4xl font-black text-amber-600 tech-font" v-text="12"></h3>
                <p class="text-sm font-bold text-slate-800 mt-1" v-text="isArabic ? 'أصناف راكدة لأكثر من 90 يوم' : 'Stagnant items > 90 days'"></p>
                <button @click="viewStagnantStock()" class="mt-4 text-xs font-black text-amber-600 hover:text-amber-700 uppercase flex items-center gap-1 group/btn">
                    <span v-text="isArabic ? 'مراجعة الأصناف الراكدة' : 'Review Stagnant SKUs'"></span> <i class="fas fa-arrow-right transition-transform group-hover/btn:translate-x-1" :class="isArabic ? 'rotate-180' : ''"></i>
                </button>
            </div>
        </div>

        <!-- Good: Fulfillment Rate -->
        <div class="bg-gradient-to-br from-emerald-50 to-white p-6 rounded-[2rem] border border-emerald-100 shadow-sm relative overflow-hidden group">
            <div class="absolute right-0 top-0 w-24 h-24 bg-emerald-100/50 rounded-bl-full z-0 transition-transform group-hover:scale-110"></div>
            <div class="relative z-10 flex justify-between items-start mb-2">
                <div class="w-10 h-10 bg-emerald-100 text-emerald-600 rounded-xl flex items-center justify-center"><i class="fas fa-bullseye"></i></div>
                <span class="text-[10px] font-black text-emerald-600 uppercase tracking-widest bg-white/80 px-2 py-1 rounded-md border border-emerald-100">Optimal</span>
            </div>
            <div class="relative z-10 mt-4">
                <div class="flex items-end gap-1">
                    <h3 class="text-4xl font-black text-emerald-600 tech-font">98.5</h3><span class="text-xl font-bold text-emerald-600 mb-1">%</span>
                </div>
                <p class="text-sm font-bold text-slate-800 mt-1" v-text="isArabic ? 'معدل تلبية أوامر المبيعات' : 'Order Fulfillment Rate'"></p>
                <p class="mt-4 text-xs font-black text-slate-500 uppercase flex items-center gap-1">
                    <i class="fas fa-arrow-trend-up text-emerald-500"></i> <span v-text="isArabic ? '+2.1% عن الشهر الماضي' : '+2.1% than last month'"></span>
                </p>
            </div>
        </div>
    </div>

    <!-- Bottlenecks & Operational Health Flow -->
    <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
        
        <!-- Warehouse Capacity Visualizer -->
        <div class="lg:col-span-1 bg-slate-900 rounded-[2.5rem] p-8 relative overflow-hidden shadow-2xl flex flex-col justify-between group">
            <div class="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/carbon-fibre.png')] opacity-20"></div>
            <div class="relative z-10">
                <h3 class="font-black text-white text-lg flex items-center gap-2 mb-1">
                    <i class="fas fa-warehouse text-indigo-400"></i>
                    <span v-text="isArabic ? 'إشغال المستودعات' : 'Capacity Load'"></span>
                </h3>
                <p class="text-[10px] text-slate-400 uppercase tracking-widest font-bold" v-text="isArabic ? 'سعة التخزين الحالية' : 'Current Storage Utilization'"></p>
            </div>
            
            <div class="relative z-10 flex flex-col items-center justify-center my-8">
                <!-- Circular Capacity Meter -->
                <div class="relative w-40 h-40 flex items-center justify-center rounded-full border-8 border-slate-800">
                    <svg class="absolute inset-0 w-full h-full -rotate-90">
                        <circle cx="50%" cy="50%" r="48%" class="stroke-indigo-500 transition-all duration-1000" stroke-width="12" fill="none" 
                                :stroke-dasharray="301" :stroke-dashoffset="301 - (301 * (wms_stats.capacity || 0) / 100)" stroke-linecap="round"></circle>
                    </svg>
                    <div class="text-center">
                        <span class="text-4xl font-black text-white tech-font">[[ wms_stats.capacity || 0 ]]%</span>
                    </div>
                </div>
            </div>
            
            <div class="relative z-10 space-y-3">
                <div class="flex justify-between text-xs font-bold text-slate-300">
                    <span v-text="isArabic ? 'مواقع مشغولة' : 'Occupied Bins'"></span> <span>[[ wms_stats.occupied_bins || 0 ]]</span>
                </div>
                <div class="flex justify-between text-xs font-bold text-slate-300">
                    <span v-text="isArabic ? 'مواقع شاغرة' : 'Available Bins'"></span> <span class="text-emerald-400">[[ (wms_stats.total_bins - wms_stats.occupied_bins) || 0 ]]</span>
                </div>
            </div>
        </div>

        <!-- Operations Queue Control -->
        <div class="lg:col-span-3 bg-white border border-slate-100 rounded-[2.5rem] p-8 shadow-[0_8px_30px_rgb(0,0,0,0.04)]">
            <div class="flex justify-between items-center mb-6">
                <div>
                    <h3 class="font-black text-xl text-slate-800" v-text="isArabic ? 'طابور العمليات (Operations Queue)' : 'Pending Operations Queue'"></h3>
                    <p class="text-xs font-bold text-slate-400 mt-1 uppercase tracking-wider" v-text="isArabic ? 'الحركات المعلقة التي تحتاج اعتماد' : 'Moves pending validation'"></p>
                </div>
                <button class="w-10 h-10 bg-slate-50 text-slate-400 hover:text-blue-600 rounded-xl flex items-center justify-center transition-colors">
                    <i class="fas fa-ellipsis-v"></i>
                </button>
            </div>
            
            <div class="w-full overflow-x-auto">
                <table class="w-full text-left border-collapse" :dir="isArabic ? 'rtl' : 'ltr'">
                    <thead>
                        <tr class="border-b-2 border-slate-100 text-[10px] font-black text-slate-400 uppercase tracking-widest">
                            <th class="pb-4 w-1/4" v-text="isArabic ? 'رقم الإذن' : 'Reference'"></th>
                            <th class="pb-4 w-1/4" v-text="isArabic ? 'نوع الحركة' : 'Operation Type'"></th>
                            <th class="pb-4 w-1/4" v-text="isArabic ? 'المسؤول' : 'Assigned To'"></th>
                            <th class="pb-4 w-1/4 text-center" v-text="isArabic ? 'التحكم' : 'Action'"></th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Live Operations Data -->
                        <tr v-for="op in wms_stats.pending_operations" :key="op.ref" class="border-b border-slate-50 hover:bg-slate-50/50 transition-colors group">
                            <td class="py-4">
                                <span class="font-black text-slate-700 font-mono">[[ op.ref ]]</span>
                                <p class="text-[10px] text-slate-400 font-bold" v-text="op.type_label"></p>
                            </td>
                            <td class="py-4">
                                <span :class="op.type === 'IN' ? 'bg-blue-50 text-blue-600' : 'bg-rose-50 text-rose-600'" 
                                      class="px-3 py-1 rounded-lg text-[10px] font-black uppercase">
                                    <i :class="op.type === 'IN' ? 'fas fa-arrow-down mr-1' : 'fas fa-arrow-up mr-1'"></i> 
                                    [[ op.type === 'IN' ? 'Inbound' : 'Outbound' ]]
                                </span>
                            </td>
                            <td class="py-4">
                                <span class="font-bold text-sm text-slate-600 flex items-center gap-2">
                                    <div class="w-6 h-6 rounded-full bg-slate-200 flex items-center justify-center text-[10px]">[[ (op.owner || 'U')[0] ]]</div> [[ op.owner ]]
                                </span>
                            </td>
                            <td class="py-4 text-center">
                                <button @click="op.type === 'IN' ? openReceiptModal(op.id) : openDeliveryModal(op.id)"
                                        class="opacity-0 group-hover:opacity-100 bg-blue-600 text-white px-4 py-1.5 rounded-lg text-xs font-bold shadow-md hover:bg-blue-700 transition-all uppercase tracking-wider" 
                                        v-text="isArabic ? 'اعتماد' : 'Validate'"></button>
                            </td>
                        </tr>
                        <tr v-if="!wms_stats.pending_operations || wms_stats.pending_operations.length === 0">
                            <td colspan="4" class="py-10 text-center text-slate-400 font-bold" v-text="isArabic ? 'لا توجد عمليات معلقة حالياً' : 'No pending operations'"></td>
                        </tr>
                    </tbody>
                </table>
                <div class="mt-4 text-center">
                     <button class="text-[10px] font-black text-slate-400 hover:text-blue-600 uppercase tracking-widest transition-colors" v-text="isArabic ? 'عرض كافة العمليات' : 'View All Operations'"></button>
                </div>
            </div>
        </div>
    </div>
</div>
