<div class="h-full flex flex-col space-y-8 p-2 animate-in fade-in slide-in-from-bottom-4 duration-700">
    
    <div v-if="!activeOperation" class="grid grid-cols-1 md:grid-cols-2 gap-10">
        
        <div class="space-y-6">
            <div class="flex items-center gap-3 mb-2 px-2">
                <div class="w-2 h-8 bg-emerald-500 rounded-full"></div>
                <h3 class="text-xl font-black text-slate-800 tracking-tight">[[ isArabic ? 'عمليات الإضافة' : 'Incoming' ]]</h3>
            </div>
            
            <div class="grid gap-4">
                <button v-for="op in [{id:'po_receipt', ar:'إضافة من أمر توريد', en:'PO Receipt', icon:'fa-file-import'}, {id:'mrp_receipt', ar:'إضافة من أمر تصنيع', en:'Production Receipt', icon:'fa-industry'}, {id:'so_return', ar:'مرتجع من أمر بيع', en:'Sales Return', icon:'fa-undo-alt'}]"
                        @click="startOperation(op.id)"
                        class="group relative flex items-center justify-between p-5 bg-white border border-slate-100 rounded-[1.8rem] hover:border-emerald-200 hover:shadow-[0_20px_40px_-15px_rgba(16,185,129,0.15)] transition-all duration-500 hover:-translate-y-1">
                    <div class="flex items-center gap-4">
                        <div class="w-12 h-12 bg-emerald-50 text-emerald-600 rounded-2xl flex items-center justify-center text-xl group-hover:bg-emerald-500 group-hover:text-white group-hover:rotate-[360deg] transition-all duration-700">
                            <i :class="'fas ' + op.icon"></i>
                        </div>
                        <div class="text-right">
                            <span class="block font-bold text-slate-700 group-hover:text-emerald-700 transition-colors">[[ isArabic ? op.ar : op.en ]]</span>
                            <span class="text-[10px] text-slate-400 font-medium uppercase tracking-widest">Operation Mode</span>
                        </div>
                    </div>
                    <div class="w-8 h-8 rounded-full bg-slate-50 flex items-center justify-center text-slate-300 group-hover:bg-emerald-50 group-hover:text-emerald-500 transition-all">
                        <i class="fas fa-arrow-left text-xs"></i>
                    </div>
                </button>
            </div>
        </div>

        <div class="space-y-6">
            <div class="flex items-center gap-3 mb-2 px-2">
                <div class="w-2 h-8 bg-rose-500 rounded-full"></div>
                <h3 class="text-xl font-black text-slate-800 tracking-tight">[[ isArabic ? 'عمليات الصرف' : 'Outgoing' ]]</h3>
            </div>
            
            <div class="grid gap-4">
                <button v-for="op in [{id:'so_delivery', ar:'صرف لأمر بيع', en:'Sales Delivery', icon:'fa-shipping-fast'}, {id:'internal_transfer', ar:'تحويل داخلي', en:'Internal Transfer', icon:'fa-exchange-alt'}, {id:'scrap', ar:'تسجيل هالك', en:'Scrap Management', icon:'fa-dumpster'}]"
                        @click="startOperation(op.id)"
                        class="group relative flex items-center justify-between p-5 bg-white border border-slate-100 rounded-[1.8rem] hover:border-rose-200 hover:shadow-[0_20px_40px_-15px_rgba(244,63,94,0.15)] transition-all duration-500 hover:-translate-y-1">
                    <div class="flex items-center gap-4">
                        <div class="w-12 h-12 bg-rose-50 text-rose-600 rounded-2xl flex items-center justify-center text-xl group-hover:bg-rose-500 group-hover:text-white group-hover:rotate-[360deg] transition-all duration-700">
                            <i :class="'fas ' + op.icon"></i>
                        </div>
                        <div class="text-right">
                            <span class="block font-bold text-slate-700 group-hover:text-rose-700 transition-colors">[[ isArabic ? op.ar : op.en ]]</span>
                            <span class="text-[10px] text-slate-400 font-medium uppercase tracking-widest">Inventory Issue</span>
                        </div>
                    </div>
                    <div class="w-8 h-8 rounded-full bg-slate-50 flex items-center justify-center text-slate-300 group-hover:bg-rose-50 group-hover:text-rose-500 transition-all">
                        <i class="fas fa-arrow-left text-xs"></i>
                    </div>
                </button>
            </div>
        </div>
    </div>

    <transition enter-active-class="animate-in zoom-in-95 duration-500" leave-active-class="animate-out zoom-out-95 duration-300">
        <div v-if="activeOperation" class="bg-white rounded-[2.5rem] border border-slate-200 shadow-2xl overflow-hidden flex-1 flex flex-col">
            <div class="p-6 border-b border-slate-100 flex items-center justify-between bg-gradient-to-r from-slate-50 to-white">
                <div class="flex items-center gap-4">
                    <button @click="activeOperation = null" class="w-11 h-11 bg-white border border-slate-200 rounded-2xl flex items-center justify-center text-slate-500 hover:bg-slate-900 hover:text-white hover:rotate-12 transition-all duration-500 shadow-sm">
                        <i class="fas fa-arrow-right"></i>
                    </button>
                    <div>
                        <h3 class="font-black text-slate-800 text-lg">[[ getOperationTitle() ]]</h3>
                        <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">Draft Operation • [[ activeOperation ]]</p>
                    </div>
                </div>
            </div>
            
            <div class="flex-1 p-12 flex flex-col items-center justify-center text-center space-y-4">
                <div class="w-24 h-24 bg-slate-50 rounded-full flex items-center justify-center animate-bounce">
                    <i class="fas fa-edit text-3xl text-slate-200"></i>
                </div>
                <p class="text-slate-400 font-medium italic">[[ isArabic ? 'جاري تجهيز حقول الإدخال الذكية...' : 'Preparing smart input fields...' ]]</p>
            </div>
        </div>
    </transition>
</div>
