<div class="bg-white rounded-[2rem] border border-slate-200 shadow-sm flex flex-col h-full overflow-hidden">
    <div class="p-6 border-b border-slate-100 flex justify-between items-center bg-white">
        <h3 class="font-black text-slate-800 flex items-center gap-3">
            <i class="fas fa-exchange-alt text-emerald-500"></i>
            [[ isArabic ? 'سجل العمليات المخزنية' : 'Stock Operations Log' ]]
        </h3>
        <div class="flex gap-2">
            <button class="bg-slate-100 text-slate-600 px-4 py-2 rounded-xl text-xs font-bold hover:bg-slate-200 transition-all">
                <i class="fas fa-file-excel mr-1"></i> Export
            </button>
        </div>
    </div>

    <div class="flex-1 overflow-x-auto">
        <table class="w-full text-right text-xs">
            <thead class="text-slate-400 uppercase font-black tracking-widest bg-slate-50/50 border-b">
                <tr>
                    <th class="p-4">Reference</th>
                    <th class="p-4">Product</th>
                    <th class="p-4">From (Source)</th>
                    <th class="p-4">To (Dest)</th>
                    <th class="p-4 text-center">Quantity</th>
                    <th class="p-4 text-center">Status</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-slate-50">
                <tr v-for="n in 8" :key="n" class="hover:bg-slate-50/80 transition-colors">
                    <td class="p-4 font-bold text-indigo-600">WH/MO/00[[n]]</td>
                    <td class="p-4 font-bold text-slate-700">سيراميك رويال 60*60</td>
                    <td class="p-4 text-slate-400">Main Warehouse</td>
                    <td class="p-4 text-emerald-600 font-bold">Zone-B / Shelf-04</td>
                    <td class="p-4 text-center font-black">200.00</td>
                    <td class="p-4 text-center">
                        <span class="px-3 py-1 bg-emerald-50 text-emerald-600 rounded-full font-black text-[9px] border border-emerald-100 uppercase">Done</span>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
