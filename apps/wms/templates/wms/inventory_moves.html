<div class="h-full flex flex-col space-y-6 animate-in fade-in duration-500">
    
    <div v-if="!activeOperation" class="grid grid-cols-1 md:grid-cols-2 gap-8 pb-10">
        
        <div class="space-y-4">
            <h3 class="flex items-center gap-2 text-slate-800 font-black px-2 uppercase tracking-tighter">
                <i class="fas fa-arrow-down text-emerald-500 bg-emerald-50 p-2 rounded-lg"></i>
                [[ isArabic ? 'عمليات الإضافة (وارد)' : 'Incoming Operations' ]]
            </h3>
            <div class="grid grid-cols-1 gap-3">
                <button @click="startOperation('po_receipt')" class="group operation-card">
                    <div class="op-info">
                        <div class="op-icon bg-emerald-500"><i class="fas fa-file-invoice"></i></div>
                        <span class="op-label">[[ isArabic ? 'إضافة من أمر توريد' : 'Receipt from PO' ]]</span>
                    </div>
                    <i class="fas fa-chevron-left op-arrow"></i>
                </button>

                <button @click="startOperation('mrp_receipt')" class="group operation-card">
                    <div class="op-info">
                        <div class="op-icon bg-emerald-500"><i class="fas fa-industry"></i></div>
                        <span class="op-label">[[ isArabic ? 'إضافة من أمر تصنيع' : 'Manufacturing Receipt' ]]</span>
                    </div>
                    <i class="fas fa-chevron-left op-arrow"></i>
                </button>

                <button @click="startOperation('so_return')" class="group operation-card">
                    <div class="op-info">
                        <div class="op-icon bg-emerald-500"><i class="fas fa-undo"></i></div>
                        <span class="op-label">[[ isArabic ? 'مرتجع من أمر بيع' : 'Sales Return' ]]</span>
                    </div>
                    <i class="fas fa-chevron-left op-arrow"></i>
                </button>

                <button @click="startOperation('incoming_transfer')" class="group operation-card border-dashed">
                    <div class="op-info">
                        <div class="op-icon bg-blue-500"><i class="fas fa-truck-moving"></i></div>
                        <span class="op-label">[[ isArabic ? 'تحويل وارد' : 'Incoming Transfer' ]]</span>
                    </div>
                    <i class="fas fa-chevron-left op-arrow"></i>
                </button>
            </div>
        </div>

        <div class="space-y-4">
            <h3 class="flex items-center gap-2 text-slate-800 font-black px-2 uppercase tracking-tighter">
                <i class="fas fa-arrow-up text-rose-500 bg-rose-50 p-2 rounded-lg"></i>
                [[ isArabic ? 'عمليات الصرف (صادر)' : 'Outgoing Operations' ]]
            </h3>
            <div class="grid grid-cols-1 gap-3">
                <button @click="startOperation('so_delivery')" class="group operation-card">
                    <div class="op-info">
                        <div class="op-icon bg-rose-500"><i class="fas fa-shipping-fast"></i></div>
                        <span class="op-label">[[ isArabic ? 'صرف على أمر بيع' : 'Sales Delivery' ]]</span>
                    </div>
                    <i class="fas fa-chevron-left op-arrow"></i>
                </button>

                <button @click="startOperation('internal_transfer')" class="group operation-card">
                    <div class="op-info">
                        <div class="op-icon bg-blue-500"><i class="fas fa-exchange-alt"></i></div>
                        <span class="op-label">[[ isArabic ? 'تحويل داخلي' : 'Internal Transfer' ]]</span>
                    </div>
                    <i class="fas fa-chevron-left op-arrow"></i>
                </button>

                <button @click="startOperation('mrp_issue')" class="group operation-card">
                    <div class="op-info">
                        <div class="op-icon bg-rose-500"><i class="fas fa-tools"></i></div>
                        <span class="op-label">[[ isArabic ? 'صرف لأمر تصنيع' : 'Issue for Manufacturing' ]]</span>
                    </div>
                    <i class="fas fa-chevron-left op-arrow"></i>
                </button>

                <button @click="startOperation('scrap')" class="group operation-card">
                    <div class="op-info">
                        <div class="op-icon bg-slate-700"><i class="fas fa-trash-alt"></i></div>
                        <span class="op-label">[[ isArabic ? 'هالك' : 'Scrap' ]]</span>
                    </div>
                    <i class="fas fa-chevron-left op-arrow"></i>
                </button>

                <button @click="startOperation('po_return')" class="group operation-card border-dashed">
                    <div class="op-info">
                        <div class="op-icon bg-rose-500"><i class="fas fa-undo-alt"></i></div>
                        <span class="op-label">[[ isArabic ? 'مردودات مشتريات' : 'Purchase Return' ]]</span>
                    </div>
                    <i class="fas fa-chevron-left op-arrow"></i>
                </button>
            </div>
        </div>
    </div>

    <div v-if="activeOperation" class="bg-white rounded-[2.5rem] border border-slate-200 shadow-xl overflow-hidden flex-1 animate-in zoom-in-95 duration-300">
        </div>

</div>

<style>
.operation-card {
    @apply flex items-center justify-between p-4 bg-white border border-slate-200 rounded-2xl transition-all text-right w-full;
}
.operation-card:hover {
    @apply border-indigo-400 shadow-lg shadow-indigo-50;
}
.op-info { @apply flex items-center gap-4; }
.op-icon { 
    @apply w-10 h-10 rounded-xl flex items-center justify-center text-white transition-transform group-hover:scale-110; 
}
.op-label { @apply font-bold text-slate-700 text-sm; }
.op-arrow { @apply text-slate-300 group-hover:translate-x-[-5px] transition-transform; }
</style>
