<div class="bg-white rounded-[2rem] border border-slate-200 shadow-sm flex flex-col min-h-[500px] p-6 animate-in fade-in">
    <div class="flex justify-between items-center mb-6 pb-4 border-b border-slate-100">
        <h2 class="text-xl font-black text-slate-800"><i class="fas fa-truck text-emerald-500 mr-2"></i> قائمة الموردين</h2>
        <button @click="view = 'procurement_module'" class="bg-slate-800 text-white px-4 py-2 rounded-xl font-bold hover:bg-slate-700">عودة للمشتريات</button>
    </div>
    <div class="bg-slate-50 rounded-2xl border border-slate-200 overflow-hidden">
        <table class="w-full text-right" dir="rtl">
            <thead class="bg-white border-b border-slate-200 text-xs text-slate-500">
                <tr>
                    <th class="p-4 font-bold">الكود</th>
                    <th class="p-4 font-bold">الاسم</th>
                    <th class="p-4 font-bold">الرقم الضريبي</th>
                </tr>
            </thead>
            <tbody class="text-sm">
                <tr v-for="v in (vendors || [])" :key="v.id" class="border-b border-white hover:bg-white/50 transition-colors">
                    <td class="p-4 font-bold">[[ v.code ]]</td>
                    <td class="p-4">[[ v.name ]]</td>
                    <td class="p-4 text-slate-400">[[ v.tax_id || '---' ]]</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
