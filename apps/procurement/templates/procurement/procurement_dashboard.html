{% verbatim %}
<div class="procurement-dashboard-wrapper space-y-8 animate-in fade-in slide-in-from-bottom-5 duration-700 pb-10">
    
    <!-- Header Control Bar -->
    <div class="bg-white rounded-[2rem] p-6 flex flex-col md:flex-row justify-between items-start md:items-center border border-slate-100 shadow-[0_8px_30px_rgb(0,0,0,0.04)] gap-6">
        <div class="flex items-center gap-5">
            <div class="w-16 h-16 bg-gradient-to-br from-emerald-500 to-teal-600 rounded-2xl flex items-center justify-center text-white shadow-lg shadow-emerald-200 rotate-3 hover:rotate-0 transition-transform">
                <img src="/static/brand/rpms_icon.png" class="w-10 h-10 object-contain brightness-0 invert" alt="RPMS">
            </div>
            <div>
                <h1 class="text-3xl font-black text-slate-800 tracking-tight" v-text="isArabic ? 'RPMS - لوحة التحكم' : 'RPMS Control Center'"></h1>
                <p class="text-slate-500 text-sm font-bold uppercase tracking-wider flex items-center gap-2 mt-1">
                    <span class="flex h-2 w-2 relative">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
                    </span>
                    <span v-text="isArabic ? 'نظام إدارة المشتريات والتموين الذكي' : 'Redivio Procurement Management System'"></span>
                </p>
            </div>
        </div>
        
        <!-- Quick Control Actions -->
        <div class="flex flex-wrap gap-3">
            <button @click="openModal('po')" class="group bg-emerald-50 hover:bg-emerald-600 text-emerald-600 hover:text-white px-5 py-3 rounded-xl shadow-sm transition-all flex items-center gap-2 font-bold tracking-wide">
                <i class="fas fa-file-signature group-hover:scale-110 transition-transform"></i> <span v-text="isArabic ? 'إنشاء أمر توريد' : 'New Purchase Order'"></span>
            </button>
            <button @click="openModal('pr')" class="group bg-blue-50 hover:bg-blue-600 text-blue-600 hover:text-white px-5 py-3 rounded-xl shadow-sm transition-all flex items-center gap-2 font-bold tracking-wide">
                <i class="fas fa-file-alt group-hover:scale-110 transition-transform"></i> <span v-text="isArabic ? 'طلب شراء جديد (PR)' : 'New PR'"></span>
            </button>
            <button @click="view = 'vendors_list'" class="bg-slate-900 hover:bg-slate-800 text-white px-5 py-3 rounded-xl shadow-lg transition-all flex items-center gap-2 font-bold tracking-wide">
                <i class="fas fa-handshake"></i> <span v-text="isArabic ? 'قائمة الموردين' : 'Vendors List'"></span>
            </button>
        </div>
    </div>

    <!-- Enterprise Workflow Tab Switcher -->
    <div class="bg-slate-900 p-2 rounded-2xl flex flex-wrap gap-2 text-sm font-bold text-slate-400 border border-slate-800">
        <button @click="procTab = 'pos'" :class="procTab === 'pos' ? 'bg-emerald-600 text-white shadow-lg' : 'hover:bg-slate-800 hover:text-slate-200'" class="px-5 py-2.5 rounded-xl transition-all flex items-center gap-2">
            <i class="fas fa-file-invoice-dollar"></i> <span v-text="isArabic ? 'أوامر التوريد (POs)' : 'Purchase Orders'"></span>
        </button>
        <button @click="procTab = 'prs'" :class="procTab === 'prs' ? 'bg-blue-600 text-white shadow-lg' : 'hover:bg-slate-800 hover:text-slate-200'" class="px-5 py-2.5 rounded-xl transition-all flex items-center gap-2">
            <i class="fas fa-clipboard-list"></i> <span v-text="isArabic ? 'طلبات الشراء (PR)' : 'Requisitions (PR)'"></span>
        </button>
        <button @click="procTab = 'rfqs'" :class="procTab === 'rfqs' ? 'bg-purple-600 text-white shadow-lg' : 'hover:bg-slate-800 hover:text-slate-200'" class="px-5 py-2.5 rounded-xl transition-all flex items-center gap-2">
            <i class="fas fa-tags"></i> <span v-text="isArabic ? 'عروض الأسعار (RFQ)' : 'RFQs & Quotes'"></span>
        </button>
        <button @click="procTab = 'matrix'" :class="procTab === 'matrix' ? 'bg-amber-600 text-white shadow-lg' : 'hover:bg-slate-800 hover:text-slate-200'" class="px-5 py-2.5 rounded-xl transition-all flex items-center gap-2">
            <i class="fas fa-balance-scale"></i> <span v-text="isArabic ? 'مقارنة الأسعار (Matrix)' : 'Comparison Matrix'"></span>
        </button>
        <button @click="procTab = 'rtv'" :class="procTab === 'rtv' ? 'bg-rose-600 text-white shadow-lg' : 'hover:bg-slate-800 hover:text-slate-200'" class="px-5 py-2.5 rounded-xl transition-all flex items-center gap-2">
            <i class="fas fa-undo"></i> <span v-text="isArabic ? 'مردودات المشتريات (RTV)' : 'Purchase Returns'"></span>
        </button>
    </div>

    
    <!-- Actionable Alerts (Bottlenecks & Critical KPIs) -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        
        <!-- Critical Alert: Pending Approvals -->
        <div class="bg-gradient-to-br from-rose-50 to-white p-6 rounded-[2rem] border border-rose-100 shadow-sm relative overflow-hidden group hover:shadow-md transition-shadow">
            <div class="absolute right-0 top-0 w-24 h-24 bg-rose-100/50 rounded-bl-full z-0 transition-transform group-hover:scale-110"></div>
            <div class="relative z-10 flex justify-between items-start mb-2">
                <div class="w-10 h-10 bg-rose-100 text-rose-600 rounded-xl flex items-center justify-center animate-pulse"><i class="fas fa-clock"></i></div>
                <span class="text-[10px] font-black text-rose-600 uppercase tracking-widest bg-white/80 px-2 py-1 rounded-md border border-rose-100">Action Required</span>
            </div>
            <div class="relative z-10 mt-4">
                <h3 class="text-4xl font-black text-rose-600 tech-font" v-text="purchase_orders.filter(po => po.status === 'draft').length || 0"></h3>
                <p class="text-sm font-bold text-slate-800 mt-1" v-text="isArabic ? 'أوامر شراء مسودة تنتظر الاعتماد' : 'Draft POs requiring approval'"></p>
                <button class="mt-4 text-xs font-black text-rose-600 hover:text-rose-700 uppercase flex items-center gap-1 group/btn">
                    <span v-text="isArabic ? 'فتح قائمة الاعتمادات' : 'Open Approvals Queue'"></span> <i class="fas fa-arrow-right transition-transform group-hover/btn:translate-x-1" :class="isArabic ? 'rotate-180' : ''"></i>
                </button>
            </div>
        </div>

        <!-- Warning: Late Deliveries -->
        <div class="bg-gradient-to-br from-amber-50 to-white p-6 rounded-[2rem] border border-amber-100 shadow-sm relative overflow-hidden group hover:shadow-md transition-shadow">
            <div class="absolute right-0 top-0 w-24 h-24 bg-amber-100/50 rounded-bl-full z-0 transition-transform group-hover:scale-110"></div>
            <div class="relative z-10 flex justify-between items-start mb-2">
                <div class="w-10 h-10 bg-amber-100 text-amber-600 rounded-xl flex items-center justify-center"><i class="fas fa-calendar-times"></i></div>
                <span class="text-[10px] font-black text-amber-600 uppercase tracking-widest bg-white/80 px-2 py-1 rounded-md border border-amber-100">Review</span>
            </div>
            <div class="relative z-10 mt-4">
                <h3 class="text-4xl font-black text-amber-600 tech-font" v-text="1"></h3>
                <p class="text-sm font-bold text-slate-800 mt-1" v-text="isArabic ? 'شحنات متأخرة عن موعد التسليم' : 'Deliveries past ETA'"></p>
                <button class="mt-4 text-xs font-black text-amber-600 hover:text-amber-700 uppercase flex items-center gap-1 group/btn">
                    <span v-text="isArabic ? 'تواصل مع الموردين' : 'Contact Suppliers'"></span> <i class="fas fa-arrow-right transition-transform group-hover/btn:translate-x-1" :class="isArabic ? 'rotate-180' : ''"></i>
                </button>
            </div>
        </div>

        <!-- Good: Vendor Score -->
        <div class="bg-gradient-to-br from-emerald-50 to-white p-6 rounded-[2rem] border border-emerald-100 shadow-sm relative overflow-hidden group hover:shadow-md transition-shadow">
            <div class="absolute right-0 top-0 w-24 h-24 bg-emerald-100/50 rounded-bl-full z-0 transition-transform group-hover:scale-110"></div>
            <div class="relative z-10 flex justify-between items-start mb-2">
                <div class="w-10 h-10 bg-emerald-100 text-emerald-600 rounded-xl flex items-center justify-center"><i class="fas fa-star"></i></div>
                <span class="text-[10px] font-black text-emerald-600 uppercase tracking-widest bg-white/80 px-2 py-1 rounded-md border border-emerald-100">On Track</span>
            </div>
            <div class="relative z-10 mt-4">
                <div class="flex items-end gap-1">
                    <h3 class="text-4xl font-black text-emerald-600 tech-font">91.4</h3><span class="text-xl font-bold text-emerald-600 mb-1">%</span>
                </div>
                <p class="text-sm font-bold text-slate-800 mt-1" v-text="isArabic ? 'متوسط تقييم جودة التوريد' : 'Average Supplier Quality Score'"></p>
                <div class="w-full bg-emerald-100 h-2 mt-4 rounded-full overflow-hidden">
                    <div class="bg-emerald-500 h-full rounded-full" style="width: 91.4%"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bottlenecks & Operational Health Flow -->
    <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
        
        <!-- Spend Flow Visualizer -->
        <div class="lg:col-span-1 bg-slate-900 rounded-[2.5rem] p-8 relative overflow-hidden shadow-2xl flex flex-col justify-between group">
            <div class="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/carbon-fibre.png')] opacity-20"></div>
            <div class="relative z-10">
                <h3 class="font-black text-white text-lg flex items-center gap-2 mb-1">
                    <i class="fas fa-wallet text-purple-400"></i>
                    <span v-text="isArabic ? 'موازنة المشتريات' : 'Spend Flow'"></span>
                </h3>
                <p class="text-[10px] text-slate-400 uppercase tracking-widest font-bold" v-text="isArabic ? 'متابعة نفقات الموردين' : 'Supplier Spend Flow'"></p>
            </div>
            
            <div class="relative z-10 flex flex-col items-center justify-center my-8">
                <div class="relative w-40 h-40 flex items-center justify-center rounded-full border-8 border-slate-800 bg-slate-800/50">
                    <svg class="absolute inset-0 w-full h-full -rotate-90">
                        <circle cx="50%" cy="50%" r="48%" class="stroke-emerald-500 transition-all duration-1000" stroke-width="12" fill="none" stroke-dasharray="100 100" stroke-dashoffset="65" stroke-linecap="round"></circle>
                    </svg>
                    <div class="text-center">
                        <span class="text-xl font-black text-white tech-font">[[ formatCurrency ? formatCurrency(85400) : '85,400' ]]</span>
                        <p class="text-[9px] text-emerald-400 font-bold uppercase mt-1">YTD Spend</p>
                    </div>
                </div>
            </div>
            
            <div class="relative z-10 space-y-3">
                <div class="flex justify-between text-xs font-bold text-slate-300 border-b border-white/10 pb-2">
                    <span v-text="isArabic ? 'مورد 1 (Alrajhi)' : 'Top Vendor'"></span> <span class="text-purple-400">45%</span>
                </div>
                <div class="flex justify-between text-xs font-bold text-slate-300">
                    <span v-text="isArabic ? 'موردين آخرين' : 'Other Vendors'"></span> <span class="text-slate-400">55%</span>
                </div>
            </div>
        </div>

        <!-- Operations Queue Control -->
        <div class="lg:col-span-3 bg-white border border-slate-100 rounded-[2.5rem] p-8 shadow-[0_8px_30px_rgb(0,0,0,0.04)]">
            <div class="flex justify-between items-center mb-6">
                <div>
                    <h3 class="font-black text-xl text-slate-800" v-text="isArabic ? 'أوامر التوريد النشطة (Active POs)' : 'Active Purchase Orders'"></h3>
                    <p class="text-xs font-bold text-slate-400 mt-1 uppercase tracking-wider" v-text="isArabic ? 'متابعة حالة الاستلام والاعتماد' : 'Track delivery and approval status'"></p>
                </div>
                <button class="w-10 h-10 bg-slate-50 text-slate-400 hover:text-purple-600 rounded-xl flex items-center justify-center transition-colors">
                    <i class="fas fa-ellipsis-v"></i>
                </button>
            </div>
            
            <div class="w-full overflow-x-auto">
                <table class="w-full text-left border-collapse" :dir="isArabic ? 'rtl' : 'ltr'">
                    <thead>
                        <tr class="border-b-2 border-slate-100 text-[10px] font-black text-slate-400 uppercase tracking-widest">
                            <th class="pb-4 w-1/5" v-text="isArabic ? 'رقم الأمر' : 'PO Ref'"></th>
                            <th class="pb-4 w-1/4" v-text="isArabic ? 'المورد' : 'Vendor'"></th>
                            <th class="pb-4 w-1/5" v-text="isArabic ? 'تاريخ التوصيل' : 'ETA'"></th>
                            <th class="pb-4 w-1/5" v-text="isArabic ? 'القيمة' : 'Value'"></th>
                            <th class="pb-4 w-1/5 text-center" v-text="isArabic ? 'التحكم' : 'Action'"></th>
                        </tr>
                    </thead>
                    <tbody>
                        <template v-for="po in purchase_orders" :key="po.id">
                            <tr class="border-b border-slate-100 hover:bg-slate-50/80 transition-colors group cursor-pointer" @click="po.showDetails = !po.showDetails">
                                <td class="py-4 px-2">
                                    <div class="flex items-center gap-2">
                                        <button @click.stop="po.showDetails = !po.showDetails" class="w-6 h-6 rounded-lg bg-slate-100 text-slate-500 hover:bg-indigo-100 hover:text-indigo-600 flex items-center justify-center text-xs transition-colors">
                                            <i class="fas" :class="po.showDetails ? 'fa-chevron-down' : (isArabic ? 'fa-chevron-left' : 'fa-chevron-right')"></i>
                                        </button>
                                        <div>
                                            <span @click.stop="viewPODetails(po)" class="font-black text-slate-800 font-mono hover:text-indigo-600 hover:underline cursor-pointer">[[ po.po_number ]]</span>
                                            <p v-if="po.status === 'draft' || po.status === 'DRAFT'" class="text-[10px] text-rose-500 font-bold"><i class="fas fa-lock"></i> Needs Approval</p>
                                            <p v-else-if="po.status === 'confirmed' || po.status === 'CONFIRMED'" class="text-[10px] text-amber-500 font-bold"><i class="fas fa-truck"></i> On the way</p>
                                            <p v-else class="text-[10px] text-emerald-500 font-bold"><i class="fas fa-check-circle"></i> [[ po.status ]]</p>
                                        </div>
                                    </div>
                                </td>
                                <td class="py-4 font-bold text-sm text-slate-700">[[ po.vendor_name || '-' ]]</td>
                                <td class="py-4 text-xs font-bold text-slate-500">[[ po.date ]]</td>
                                <td class="py-4 font-black" :class="(po.status === 'draft' || po.status === 'DRAFT') ? 'text-slate-400' : 'text-slate-900'">
                                    [[ formatCurrency ? formatCurrency(po.total_amount) : (po.total_amount || 0) ]]
                                </td>
                                <td class="py-4 text-center flex justify-center items-center gap-2" @click.stop>
                                    <button v-if="po.status === 'draft' || po.status === 'DRAFT'" @click="updatePOStatus(po.id, 'CONFIRMED')" class="bg-rose-600 text-white px-3 py-1.5 rounded-lg text-[10px] font-bold shadow-sm hover:bg-rose-700 transition-all uppercase tracking-wider flex items-center gap-1" v-text="isArabic ? 'اعتماد الطلب' : 'Validate'"></button>
                                    <button v-else-if="po.status === 'confirmed' || po.status === 'CONFIRMED'" @click="viewPODetails(po)" class="bg-emerald-600 text-white px-3 py-1.5 rounded-lg text-[10px] font-bold shadow-sm hover:bg-emerald-700 transition-all uppercase tracking-wider flex items-center gap-1" v-text="isArabic ? 'استلام' : 'Receive'"></button>
                                    <button @click="viewPODetails(po)" class="bg-indigo-50 text-indigo-600 hover:bg-indigo-600 hover:text-white px-3 py-1.5 rounded-lg text-[10px] font-bold shadow-sm transition-all uppercase tracking-wider flex items-center gap-1">
                                        <i class="fas fa-eye"></i>
                                        <span v-text="isArabic ? 'تفاصيل' : 'Details'"></span>
                                    </button>
                                    <button @click="po.showDetails = !po.showDetails" class="bg-slate-100 text-slate-600 px-3 py-1.5 rounded-lg text-[10px] font-bold hover:bg-slate-200 transition-all uppercase tracking-wider">
                                        <span v-text="po.showDetails ? (isArabic ? 'إغلاق' : 'Collapse') : (isArabic ? 'توسيع' : 'Expand')"></span>
                                    </button>
                                </td>
                            </tr>

                            <!-- Expanded PO Detail Row -->
                            <tr v-if="po.showDetails" :key="'detail-' + po.id" class="bg-slate-50/90 border-b border-slate-200">
                                <td colspan="5" class="p-4">
                                    <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-4">
                                        <div class="flex justify-between items-center border-b pb-3">
                                            <div class="flex items-center gap-3">
                                                <span class="w-8 h-8 rounded-xl bg-indigo-100 text-indigo-700 flex items-center justify-center font-bold text-xs">
                                                    <i class="fas fa-file-invoice-dollar"></i>
                                                </span>
                                                <div>
                                                    <h4 class="font-black text-slate-800 text-sm">[[ po.po_number ]] — [[ po.vendor_name || 'Vendor' ]]</h4>
                                                    <p class="text-[10px] text-slate-400 font-bold">[[ isArabic ? 'تاريخ الإنشـاء:' : 'Created Date:' ]] [[ po.date ]]</p>
                                                </div>
                                            </div>
                                            <div class="flex items-center gap-2">
                                                <button v-if="po.status === 'draft' || po.status === 'DRAFT'" @click="updatePOStatus(po.id, 'CONFIRMED')" class="bg-rose-600 hover:bg-rose-700 text-white px-3 py-1.5 rounded-xl text-xs font-black shadow-sm transition-all flex items-center gap-1">
                                                    <i class="fas fa-check-circle"></i>
                                                    <span v-text="isArabic ? 'اعتماد الطلب' : 'Validate PO'"></span>
                                                </button>
                                                <button v-else-if="po.status === 'confirmed' || po.status === 'CONFIRMED'" @click="viewPODetails(po)" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded-xl text-xs font-black shadow-sm transition-all flex items-center gap-1">
                                                    <i class="fas fa-box-open"></i>
                                                    <span v-text="isArabic ? 'استلام البضاعة' : 'Receive Goods'"></span>
                                                </button>
                                                <button @click="viewPODetails(po)" class="bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-1.5 rounded-xl text-xs font-black shadow-sm transition-all flex items-center gap-1">
                                                    <i class="fas fa-window-maximize"></i>
                                                    <span v-text="isArabic ? 'عرض بطاقة الأمر كاملة' : 'Open PO Card'"></span>
                                                </button>
                                            </div>
                                        </div>

                                        <!-- Lines Table -->
                                        <div v-if="po.lines && po.lines.length > 0" class="overflow-x-auto">
                                            <table class="w-full text-xs text-slate-700 border border-slate-100 rounded-xl overflow-hidden">
                                                <thead class="bg-slate-100 text-slate-500 font-black uppercase text-[9px]">
                                                    <tr>
                                                        <th class="p-2.5 text-right">[[ isArabic ? 'الصنف' : 'Material / Item' ]]</th>
                                                        <th class="p-2.5 text-center">[[ isArabic ? 'الكود (SKU)' : 'SKU' ]]</th>
                                                        <th class="p-2.5 text-center">[[ isArabic ? 'الكمية المطلوبة' : 'Ordered Qty' ]]</th>
                                                        <th class="p-2.5 text-center">[[ isArabic ? 'الكمية المستلمة' : 'Received Qty' ]]</th>
                                                        <th class="p-2.5 text-center">[[ isArabic ? 'سعر الوحدة' : 'Unit Cost' ]]</th>
                                                        <th class="p-2.5 text-center">[[ isArabic ? 'الإجمالي' : 'Subtotal' ]]</th>
                                                    </tr>
                                                </thead>
                                                <tbody class="divide-y divide-slate-100">
                                                    <tr v-for="line in po.lines" :key="line.id" class="hover:bg-slate-50/80">
                                                        <td class="p-2.5 font-bold text-slate-800">[[ line.material_name || line.material ]]</td>
                                                        <td class="p-2.5 text-center font-mono text-slate-500">[[ line.material_sku || '-' ]]</td>
                                                        <td class="p-2.5 text-center font-black">[[ line.quantity ]]</td>
                                                        <td class="p-2.5 text-center font-bold text-emerald-600">[[ line.received_qty || 0 ]]</td>
                                                        <td class="p-2.5 text-center font-bold">[[ formatCurrency ? formatCurrency(line.unit_price) : line.unit_price ]]</td>
                                                        <td class="p-2.5 text-center font-black text-slate-900">[[ formatCurrency ? formatCurrency(line.quantity * line.unit_price) : (line.quantity * line.unit_price) ]]</td>
                                                    </tr>
                                                </tbody>
                                            </table>
                                        </div>
                                        <div v-else class="text-center py-4 bg-slate-50 rounded-xl border border-dashed text-xs font-bold text-slate-400">
                                            <i class="fas fa-info-circle mr-1"></i>
                                            [[ isArabic ? 'لا توجد بنود أصناف مسجلة في هذا الأمر' : 'No line items recorded in this purchase order' ]]
                                        </div>
                                    </div>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
                <div class="mt-4 text-center">
                     <button class="text-[10px] font-black text-slate-400 hover:text-purple-600 uppercase tracking-widest transition-colors" v-text="isArabic ? 'عرض كافة الطلبات' : 'View All Operations'"></button>
                </div>
            </div>
        </div>
    </div>
</div>
{% endverbatim %}
